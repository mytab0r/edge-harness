# Конфиг gitleaks (docs/decisions — обоснование выбора инструмента в
# docs/research/30-rejected-alternatives.md, раздел «14. Секрет-сканирование»).
#
# Наследуем встроенный набор правил gitleaks (провайдерные форматы токенов +
# generic-api-key/generic-password по энтропии) и добавляем ТОЛЬКО точечные
# исключения на подтверждённые ложные срабатывания — каждое со своей причиной,
# не общее отключение правила и не общее отключение сканера.
title = "edge-harness gitleaks config"

[extend]
useDefault = true

# Найдено полным прогоном по истории (#634, 2026-09-07): мутационные тесты
# нарочно шлют заведомо неверный токен/ключ, чтобы проверить, что харнес
# честно отвечает 401/невалидный доступ, а не молча принимает. Формат
# "definitely-wrong-*" специально нечитаем как настоящий секрет ни одним
# провайдером — это и есть его смысл (canary, не значение).
[[allowlists]]
description = "Мутационные smoke/quotas-тесты: заведомо неверный токен/ключ (.github/workflows/quotas.yml, diag-integrations-journal.yml, diag-502.yml) — проверяется факт отказа доступа, не хранится настоящий секрет"
regexes = ['''definitely-wrong-[a-z0-9-]+''']

# Историческая находка полного прогона по истории (#634, 2026-09-07): коммит
# d5c50cbe (уже смёржен в main, история неизменяема) один раз положил в
# фикстуру test_check_pr.py буквальный AWS-ключ по форме AKIA+16 симв., чтобы
# доказать, что check_pr.py красит PR при обнаружении секрета в диффе.
# Правка #345 (0add5172) заменила подход на конкатенацию для новых тестов —
# текущий scripts/review/test_check_pr.py такого литерала уже не содержит,
# но сам коммит d5c50cbe остаётся в истории репозитория как есть. Буквы идут
# по алфавиту — не валидный формат AWS (реальный ключ так не выглядит).
#
# Регекс ниже написан с \x-эскейпом ОДНОЙ буквы, а не сплошным литералом:
# крупная гвардия check_pr.py (SECRET_PATTERNS) сканирует ЛЮБУЮ добавленную
# строку ЛЮБОГО файла диффа PR (не только .py) и не знает про allowlist
# gitleaks — сплошной литерал в этом самом файле красил бы собственный PR
# правки (класс #345: тест-литерал ловит себя же в диффе). \x41 = 'A' в
# RE2/Go regexp — совпадение со значением "AKIA"+"ABCDEFGHIJKLMNOP" (16 букв
# по алфавиту) не меняется.
[[allowlists]]
description = "Историческая тестовая фикстура коммита d5c50cbe (давно смёржен, заменён на конкатенацию правкой #345/0add5172): синтетический AWS-ключ (буквы по алфавиту)"
regexes = ["AKIA\\x41BCDEFGHIJKLMNOP"]

# plugins-src/runner-bridge/test/server.test.mjs проверяет readToken() на
# валидном/невалидном значении. Значение — словарная строка "abcdef123456",
# не случайные символы: невозможный формат для настоящего PAT.
[[allowlists]]
description = "plugins-src/runner-bridge/test/server.test.mjs: синтетический GitHub PAT (словарная последовательность abcdef123456) для unit-теста readToken()"
regexes = ['''ghp_abcdef123456''']

# dsh-edge/*-integration/check.mjs (registry/proxy/pipeline/ingest — файл
# копировался при добавлении новых интеграций) собирает заглушку конкатенацией
# по частям specifically, чтобы не быть литералом с суффиксом *KEY/*TOKEN —
# сам файл комментирует "настоящих секретов нет (локальный unstable_dev)".
[[allowlists]]
description = "dsh-edge/*-integration/check.mjs: AUTH_DUMMY — заглушка авторизации локального unstable_dev, не секрет (см. комментарий в файле)"
regexes = ['''key-0123456789abcdef''']

# Пример .dev.vars для локального wrangler dev: значения пустые или
# буквально "dev-token"/"dev-session-secret" — не секреты, а подсказка
# разработчику, какие переменные вообще существуют (AGENTS.md: «в
# документации — только имена»).
[[allowlists]]
description = "cf-worker/.dev.vars.example: только имена переменных и placeholder-значения для локальной разработки, реальных секретов файл не содержит по своему назначению"
paths = ['''cf-worker/\.dev\.vars\.example''']
