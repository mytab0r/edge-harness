name: 📋 Задача в пул
description: Единица работы для любого агента. Берётся через assign + ветку agent/<номер>.
labels: [task]
body:
  - type: textarea
    id: goal
    attributes:
      label: Цель
      description: Что должно стать верным и наблюдаемым. Одна фраза.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Критерий готовности
      description: Видимый результат, а не «шаг прошёл». Что именно проверяем.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Площадь
      options:
        - area:worker
        - area:hands
        - area:docs
        - area:orchestra
        - area:process
    validations:
      required: true
  - type: input
    id: blocked_by
    attributes:
      label: Чем блокируется
      description: >-
        Номера issue через пробел (#123 #124) или «ничем». Явный ответ обязателен —
        «не думал об этом» не вариант. Это человекочитаемый след в теле: настоящая
        связь ставится отдельно, python scripts/lib/task_deps.py block <эта#> <блокирующая#>.
      placeholder: "ничем"
    validations:
      required: true
  - type: input
    id: blocking
    attributes:
      label: Что блокирует
      description: >-
        Номера issue через пробел (#123 #124) или «ничем» — какие ДРУГИЕ задачи не
        могут начаться раньше этой. Тоже явный ответ, не пропуск.
      placeholder: "ничем"
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст и ссылки
      description: Ссылки на research/ADR/спеку. Чего НЕ трогать (границы задачи).
  - type: checkboxes
    id: rules
    attributes:
      label: Правила
      options:
        - label: Я прочитал docs/research/30-rejected-alternatives.md и задача не из отвергнутых
          required: true
        - label: Критерий готовности проверяем по видимому результату
          required: true
