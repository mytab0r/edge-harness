# Кампания замера хвоста задержки «repository_dispatch → старт job'а» (задача #4).
#
# Два job'а, один файл:
#   tick  (schedule/workflow_dispatch) — отправляет repository_dispatch с PAT и
#         сторожит таймаут замера; PAT один на весь пишущий путь (диспатч, push
#         CSV, PR) — это широкий GH_PIPELINE_PAT, не узкий GH_DISPATCH_TOKEN
#         (кампании нужны issues/PR): события от GITHUB_TOKEN проверки не
#         зажигают — см. docs/research/21-github-actions.md;
#   probe (repository_dispatch)       — сам измеряемый job'а: стартует максимально
#         простым шагом (метрика фиксируется GitHub'ом в run_started_at ДО любого
#         шага) и записывает свою строку в CSV на ветке данных.
#
# Каденция — самоподдержка, не schedule: шаг «Цепочка» из always()-шага тика
# диспатчит следующий workflow_dispatch; cron — только страховка смерти цепочки.
# Замер 2026-09-04: cron `*/15` на этом репозитории доставил ~7% тиков (31 из
# ~449 за 112 ч), dispatch-события — 32 из 32 (docs/research/21-github-actions.md,
# «Замер schedule на этом репозитории»). Минуты страховочного cron сдвинуты с
# четвертей часа — рекомендация GitHub на случай пиков нагрузки в начале часа.
#
# Файл обязан лежать на default branch — dispatch с ветки молча возвращает 204
# без запуска; гвардия в scripts/measure/dispatch_tail.py это проверяет.
# После финализации кампания отключает этот workflow сама (gh workflow enable —
# вернуть). Расписание на публичном репозитории умирает после 60 дней тишины
# (docs/research/21-github-actions.md) — кампания короче на порядки.
#
# Дизайн и метрика: docs/decisions/0005-dispatch-tail-campaign.md.
name: dispatch-latency-probe

on:
  schedule:
    - cron: "37 4,16 * * *"
    - cron: "11 10,22 * * *"
  repository_dispatch:
    types: [dispatch-latency-probe]
  workflow_dispatch:

permissions:
  contents: read  # checkout; все записи (CSV, PR, комментарии) идут под PAT

env:
  # Сознательное продление кампании после unmet-финализации (ADR 0005, дельта
  # «Темп добора»): ОДНА декларация на оба job'а — тик и probe считают один
  # лимит. Переопределение на уровне шага доходит только до одного job'а, и
  # продление умирает при рождении: probe досчитает до 7 дней и финализирует
  # снова. Гвардия — scripts/measure/test_dispatch_tail.py.
  CAMPAIGN_MAX_DAYS: "7"

jobs:
  tick:
    if: github.event_name != 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Сериализуем только тики: измеряемый probe никогда не должен ждать за
    # диспетчером — иначе измеряем очередь самого диспетчера, а не GitHub.
    concurrency:
      group: dispatch-latency-probe-tick
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Git-авторизация под PAT (push строк CSV)
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: gh auth setup-git
      - name: Тик кампании
        env:
          GH_PIPELINE_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          # Без GH_TOKEN в env credential helper gh не авторизует push из
          # dispatch-пути: timeout/dispatch_failed строки не записывались бы
          # никогда, и кампания молча деградировала бы до «только ok».
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: python scripts/measure/dispatch_tail.py dispatch
      - name: След тика, умершего до диспатча
        # Класс «молча деградировало и никто не заметил»: тик, умерший до
        # POST /dispatches, обязан оставить строку dispatch_failed, а не только
        # красный job. Доставку schedule это не ловит (ран не создан — ловить
        # нечем): она видна сверкой истории runs, см. замер schedule в доке.
        if: failure()
        env:
          GH_PIPELINE_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: python scripts/measure/dispatch_tail.py tick_failed
      - name: Цепочка — следующая ступень тика
        # Основной механизм каденции. always(): один сбой тика не роняет
        # кампанию до страховочного cron; ограничитель повтора — CHAIN_DELAY_S
        # и сериализация тиков (concurrency ниже). Останавливается сам:
        # покрытие достигнуто, лимит дней или workflow не на main.
        if: always()
        env:
          GH_PIPELINE_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: python scripts/measure/dispatch_tail.py chain

  probe:
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Первый шаг намеренно тривиален и без checkout: run_started_at уже зафиксирован
      # GitHub'ом к моменту его начала — содержимое шагов на метрику не влияет.
      - name: Маркер старта
        env:
          PROBE_ID: ${{ github.event.client_payload.probe_id }}
          SENT_AT_MS: ${{ github.event.client_payload.sent_at }}
        run: echo "probe $PROBE_ID dispatched at $SENT_AT_MS"
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Git-авторизация под PAT (push строки CSV)
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: gh auth setup-git
      - name: Запись замера
        env:
          GH_PIPELINE_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
          PROBE_ID: ${{ github.event.client_payload.probe_id }}
          SENT_AT_MS: ${{ github.event.client_payload.sent_at }}
        run: python scripts/measure/dispatch_tail.py record
