# Оркестратор мультиагентной работы: следит за пулом задач и сериализует слияния.
#
# Два режима:
#   contract  — на каждый PR: проверка контракта «PR ↔ задача из пула» (обязательная
#               проверка защиты ветки main);
#   orchestra — по расписанию и вручную: просроченные назначения, метки конфликтов,
#               очередь слияний (цикл слияний за запуск, до MERGE_LOOP_MAX_MERGES
#               PR, #297; один PR за проход — сериализация update_branch не тронута).
#
# Concurrency-группа сериализует сами запуски orchestra: два слияния никогда
# не идут параллельно. Это архитектурный замок, а не договорённость.
#
# Группа объявлена на уровне КАЖДОГО джоба, а не файла: на уровне workflow она
# делила бы одну очередь между обязательной проверкой contract (обязана идти
# по каждому PR независимо) и длинной серийной работой orchestra — так все PR
# массово теряли статус contract, вытесненные чужими прогонами и кроном (#189).
#
# ⚠️ Расписание в публичном репозитории само отключается после 60 дней без активности
#    (docs/research/21-github-actions.md) — деградация громкая: отчёты перестанут
#    появляться в Actions. Поднимать активность или дёргать workflow_dispatch вручную.
name: orchestra

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Группа уникальна для PR: чужой PR никогда не отменяет и не откладывает эту
    # проверку. cancel-in-progress: true — можно отменять свой же устаревший
    # прогон: новый push в тот же PR делает старую проверку контракта неактуальной.
    concurrency:
      group: orchestra-contract-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Контракт PR ↔ задача
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/orchestra/contract_check.py --pr ${{ github.event.pull_request.number }}

  orchestra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Глобальная группа — архитектурный замок из шапки файла: два слияния
    # никогда не идут параллельно.
    concurrency:
      group: orchestra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - name: Обход пула и очередь слияний
        env:
          GH_TOKEN: ${{ github.token }}
          # PAT для update-branch: GITHUB_TOKEN-обновления не зажигают проверки
          ORCHESTRA_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          # Активный канал предохранителя конвейера и пульса (#120,
          # scripts/orchestra/pulse_guard.py): та же пара секретов, что у воркера
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Архив сессий раннеров после слияния (#119): сессия harness-<N> уходит
          # в архив морды, в активных остаются живые задачи. Не заданы — шаг
          # пропускается с ⚠️ в отчёте, слияния это не блокирует.
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: python scripts/orchestra/scheduler.py

      # Гвардия «протухшей» метки blocked (#334): чисто читающий шаг, ничего
      # не блокирует и не решает вместо владельца (снятие метки — по-прежнему
      # ручное, docs/agents/LABELS.md). continue-on-error нарочно: красный шаг
      # виден в логе (fail loud), но не гасит зелёный статус всего job'а —
      # предохранитель конвейера (#120) читает историю ИМЕННО этого job'а как
      # пульс, и ложный «пульс пропал» от находки на живых issue дороже
      # задержанного обнаружения протухшей метки.
      - name: Гвардия протухшей метки blocked (#334)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/orchestra/stale_blocked_guard.py
