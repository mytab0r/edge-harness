# Оркестратор мультиагентной работы: следит за пулом задач и сериализует слияния.
#
# Два режима:
#   contract  — на каждый PR: проверка контракта «PR ↔ задача из пула» (обязательная
#               проверка защиты ветки main);
#   orchestra — по расписанию и вручную: просроченные назначения, метки конфликтов,
#               очередь слияний (цикл слияний за запуск, до MERGE_LOOP_MAX_MERGES
#               PR, #297; один PR за проход — сериализация update_branch не тронута).
#
# Concurrency-группа сериализует сами запуски orchestra: два слияния никогда
# не идут параллельно. Это архитектурный замок, а не договорённость.
#
# Группа объявлена на уровне КАЖДОГО джоба, а не файла: на уровне workflow она
# делила бы одну очередь между обязательной проверкой contract (обязана идти
# по каждому PR независимо) и длинной серийной работой orchestra — так все PR
# массово теряли статус contract, вытесненные чужими прогонами и кроном (#189).
#
# ⚠️ Расписание в публичном репозитории само отключается после 60 дней без активности
#    (docs/research/21-github-actions.md) — деградация громкая: отчёты перестанут
#    появляться в Actions. Поднимать активность или дёргать workflow_dispatch вручную.
name: orchestra

on:
  # `edited` — правка тела/заголовка/базовой ветки PR (#599): единственный
  # способ снять contract:failed без нового коммита, если нарушение было в
  # ТЕЛЕ PR (например, запрещённая директива Closes/Fixes/Resolves рядом с
  # #N, contract_check.py:184-191) — до этой строки автор мог поправить
  # текст сколько угодно, метка висела вечно (живой случай PR #586: метка
  # поставлена, тело исправлено, ни одного unlabeled после). Дешёвый
  # приёмник события — только job `contract` ниже (`if: github.event_name
  # == 'pull_request'`); job `orchestra` явно исключает pull_request
  # (`if: github.event_name != 'pull_request'`) и `edited` его не трогает —
  # безопасно расширять типы события на уровне всего workflow, а не заводить
  # отдельный триггер под один job. Сам job `contract` — только чтения через
  # `gh api` и разбор текста, без платных вызовов модели и без будильника
  # другого workflow, поэтому лишние прогоны от частых правок тела не стоят
  # ничего дороже нескольких секунд раннера; concurrency-группа ниже
  # (`cancel-in-progress: true`) схлопывает подряд идущие правки одного PR
  # в последний прогон.
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Группа уникальна для PR: чужой PR никогда не отменяет и не откладывает эту
    # проверку. cancel-in-progress: true — можно отменять свой же устаревший
    # прогон: новый push в тот же PR делает старую проверку контракта неактуальной.
    concurrency:
      group: orchestra-contract-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - name: Контракт PR ↔ задача
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/orchestra/contract_check.py --pr ${{ github.event.pull_request.number }}

  orchestra:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Глобальная группа — архитектурный замок из шапки файла: два слияния
    # никогда не идут параллельно.
    concurrency:
      group: orchestra
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Ранний отказ по квоте GITHUB_TOKEN вместо 403 посреди работы (#454):
      # этот job — самый дорогой потребитель общего бюджета 1000 запросов/час
      # на репозиторий (150-250 REST-вызовов за прогон при непустой очереди,
      # issue #443), и именно он ронял чужие обязательные проверки живым
      # прогоном 2026-09-06 (PR #428/#453). scripts/lib/rate_guard.py — порог
      # и обоснование там же. `gh api rate_limit` не тратит собственную
      # квоту (подтверждено, см. докстринг), поэтому эта проверка сама не
      # приближает то, от чего защищает.
      - name: Квота GitHub API — ранняя проверка
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lib/rate_guard.py --job orchestra

      - name: Обход пула и очередь слияний
        if: steps.quota.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # PAT для update-branch: GITHUB_TOKEN-обновления не зажигают проверки
          ORCHESTRA_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          # Активный канал предохранителя конвейера и пульса (#120,
          # scripts/orchestra/pulse_guard.py): та же пара секретов, что у воркера
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Архив сессий раннеров после слияния (#119): сессия harness-<N> уходит
          # в архив морды, в активных остаются живые задачи. Не заданы — шаг
          # пропускается с ⚠️ в отчёте, слияния это не блокирует.
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: python scripts/orchestra/scheduler.py

      # Инварианты состояния репозитория (#244): состояние дрейфует БЕЗ
      # коммитов (задачу закрыли, PR слили, метку снял бот) — repo-ci.yml
      # реагирует только на push/PR, здесь тот же отчёт бежит по расписанию
      # (cron */15 мин, тот же job, что и планировщик выше). --orchestra
      # включает эскалацию (scripts/orchestra/pulse_guard.py::escalate,
      # канал #120 + Telegram — третий канал не заводим) для инвариантов 1 и
      # 3: у обоих есть естественный возраст состояния (когда слит PR, когда
      # поставлена review:ok), эскалация — один раз на конкретный набор
      # нарушителей (issue_marker_times), не на каждый пульс.
      - name: Инварианты состояния репозитория
        if: steps.quota.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/orchestra/repo_invariants.py --orchestra

      # Гвардия «протухшей» метки blocked (#334): чисто читающий шаг, ничего
      # не блокирует и не решает вместо владельца (снятие метки — по-прежнему
      # ручное, docs/agents/LABELS.md). continue-on-error нарочно: не гасит
      # зелёный статус всего job'а — сам пульс (heartbeat_check, #120) читает
      # историю ИМЕННО этого job'а orchestra (не предохранитель конвейера —
      # тот читает worker.yml, это другой механизм, находка AI-ревью PR #336,
      # третий раунд), и ложный «пульс пропал» от находки на живых issue
      # дороже задержанного обнаружения протухшей метки. Реальный провал
      # (а не просто находка) в логе НЕ считается видимым сам по себе (#887,
      # живой прогон 34506949025: Jobs API отдал success при
      # `##[error]Process completed with exit code 1` в логе, никто это не
      # прочитал) — id обязателен, чтобы шаг «Свод реальных исходов»
      # в конце job'а увидел его через `toJSON(steps)` и эскалировал по
      # факту, не по логу, который никто не открывает регулярно.
      - name: Гвардия протухшей метки blocked (#334)
        id: stale_blocked
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Тот же канал эскалации, что у scheduler-шага выше (#120) — без него
          # pulse_guard.escalate всегда вернёт «НЕ доставлен» (нет токена/чата).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/orchestra/stale_blocked_guard.py

      # Гвардия «задача ждёт решения владельца» (waiting:owner, #470, слайс
      # #254): авто-метка по блоку вариантов, снятие метки по маркеру ответа
      # «РЕШЕНИЕ: N», эскалация в саму задачу + Telegram. continue-on-error —
      # тот же приём, что у гвардии blocked выше, тот же газ на реальный
      # провал — id + «Свод реальных исходов» ниже (#887).
      - name: Гвардия waiting:owner — задача ждёт решения владельца (#470)
        id: waiting_owner
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # Тот же канал эскалации, что у шагов выше (#120) — без него
          # pulse_guard.escalate всегда вернёт «НЕ доставлен» (нет токена/чата).
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/orchestra/waiting_owner_guard.py

      # Само-аудит здоровья конвейера (openspec/changes/pipeline-health-
      # self-audit): снимок 6-7 дешёвых метрик раз в календарные сутки
      # (гейт внутри pipeline_health.snapshot_and_store — ветка данных
      # data/pipeline-health, не main), затем детектор регрессии
      # (health_regression.py) и, если найдена устойчивая деградация,
      # само-аудит заводит задачу пула (health_audit.py, метка self-audit,
      # свой дедуп/потолок — docs/agents/LABELS.md). continue-on-error —
      # тот же приём, что у гвардий blocked/waiting:owner выше, тот же газ на
      # реальный провал — id + «Свод реальных исходов» ниже (#887). GH_TOKEN —
      # широкий GH_PIPELINE_PAT (не github.token), как у dispatch_tail.py:
      # нужен для git push на ветку данных, не только для чтения issues/PR/runs.
      #
      # Git-авторизация под PAT (issue #882 — корень живого инцидента): без
      # неё свежий клон в $RUNNER_TEMP (pipeline_health.clone_data_branch)
      # не наследует креды actions/checkout, push на data/pipeline-health
      # падает 403, а старый код молча трактовал этот отказ как «уже
      # записано параллельным прогоном» — тот же шаг, что уже стоит в
      # dispatch-latency-probe.yml перед каждым git-пишущим шагом.
      # id обязателен (#887, гвардия orchestra_workflow_lint): continue-on-error
      # шаг без id не попадает в toJSON(steps) — его реальный провал снова
      # стал бы невидимым; «Свод реальных исходов» в конце job'а прочитает его.
      - name: Git-авторизация под PAT (push снимка здоровья на data-ветку)
        id: git_auth_setup
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: gh auth setup-git
      - name: Само-аудит здоровья конвейера (снимок + регрессия + задачи)
        id: health_audit
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
          GH_PIPELINE_PAT: ${{ secrets.GH_PIPELINE_PAT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Опциональны (design.md §1): без них DO cost — честное «нет
          # данных», остальные метрики снимаются как обычно.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python scripts/orchestra/health_audit.py run

      # Свод РЕАЛЬНЫХ исходов continue-on-error шагов (#887): Jobs API после
      # завершения прогона отдаёт `steps[].conclusion` — значение уже ПОСЛЕ
      # маскировки continue-on-error (всегда success), не `outcome`
      # (реальный результат, виден только контекстом `steps` ВНУТРИ ещё
      # идущего job). `if: always()` — шаг обязан отработать даже если один
      # из предыдущих шагов вообще упал бы без continue-on-error. Сам этот
      # шаг НЕ несёт continue-on-error и НЕ проверяется на id (best_effort_
      # outcome_guard.py сам никогда не «проваливается» по-настоящему —
      # эскалирует находку и возвращает 0, см. его докстринг), поэтому не
      # участвует в собственной проверке (test_orchestra_workflow_lint.py).
      - name: Свод реальных исходов best-effort шагов (не путать conclusion с outcome, #887)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STEPS_JSON: ${{ toJSON(steps) }}
        run: python scripts/orchestra/best_effort_outcome_guard.py
