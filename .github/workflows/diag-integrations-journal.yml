# Временный диагностический workflow (issue #503): владелец видит в разделе
# Settings → Integrations «Journal unavailable: HTTP 404» на каждой строке.
# Предыдущий PR поправил только формулировку ошибки — не причину. Этот
# workflow бьёт РЕАЛЬНЫЕ эндпоинты теми же запросами, что делает плагин
# (plugins-src/integrations/src/body.js, JOURNAL_QUERY), под настоящими
# секретами (HARNESS_URL/HANDS_TOKEN/DSH_EDGE_ACCESS_KEY — уже в GitHub
# Actions secrets/vars), и печатает коды+тела ответов. Секреты в лог не
# печатаются — только результаты HTTP-запросов.
#
# Проверяет:
#   1) GET {HARNESS_URL}/api/events?task_id=integration:telegram — журнал
#      харнеса напрямую, с правильным Bearer HANDS_TOKEN;
#   1b) тот же запрос с заведомо неверным Bearer — 401 (доказательство, что
#      маршрут /api/events вообще существует в задеплоенном воркере харнеса:
#      его отсутствие дало бы 404 уже на этом шаге, авторизация ни при чём);
#   2) GET {DSH_EDGE_URL}/api/harness/events?task_id=integration:telegram —
#      тот же запрос, что плагин, через прокси морды с сессионной кукой
#      владельца (логин по DSH_EDGE_ACCESS_KEY);
#   2b) тот же путь без куки — ожидание 401 (морда режет раньше прокси);
#   3) полный дамп журнала харнеса без фильтра по task_id (limit=200) —
#      ищем события kind=integration_status и по каждому id из
#      dsh-edge/integrations.json смотрим, есть ли для него хоть одно
#      событие. Пустой список для всех id — тогда деплой не пишет статусы
#      вовсе (белое пятно в другом месте, не в проксировании).
#
# Снять после починки или оставить как канарейку — решается в PR по факту
# найденной причины (design.md этого не требует держать вечно).
name: diag-integrations-journal

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 1) Харнес напрямую — GET /api/events?task_id=integration:telegram (Bearer верный)
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HARNESS_URL:-}" ]; then echo "::error::vars.HARNESS_URL не задан"; exit 1; fi
          if [ -z "${HANDS_TOKEN:-}" ]; then echo "::error::secrets.HANDS_TOKEN не задан"; exit 1; fi
          url="${HARNESS_URL%/}/api/events?task_id=integration:telegram&limit=5"
          echo "URL: $url"
          code=$(curl -sS -o /tmp/body1.json -w '%{http_code}' \
            -H "Authorization: Bearer ${HANDS_TOKEN}" -H 'accept: application/json' "$url")
          echo "HTTP $code"
          echo "--- тело ---"
          cat /tmp/body1.json
          echo
          echo "code=$code" >> "$GITHUB_OUTPUT" 2>/dev/null || true

      - name: 1b) Харнес — тот же путь с заведомо НЕВЕРНЫМ Bearer (маршрут существует ⇒ 401, не 404)
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
        run: |
          set -euo pipefail
          url="${HARNESS_URL%/}/api/events?task_id=integration:telegram&limit=5"
          code=$(curl -sS -o /tmp/body1b.json -w '%{http_code}' \
            -H 'Authorization: Bearer definitely-wrong-token' -H 'accept: application/json' "$url")
          echo "HTTP $code (ожидание: 401 — маршрут есть, токен неверный)"
          cat /tmp/body1b.json
          echo

      - name: 2) Морда — логин владельца (DSH_EDGE_ACCESS_KEY) и кука
        env:
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DSH_EDGE_URL:-}" ]; then echo "::error::vars.DSH_EDGE_URL не задан"; exit 1; fi
          if [ -z "${DSH_EDGE_ACCESS_KEY:-}" ]; then echo "::error::secrets.DSH_EDGE_ACCESS_KEY не задан"; exit 1; fi
          login_code=$(curl -sS -o /tmp/login.json -D /tmp/login_headers.txt -w '%{http_code}' \
            -X POST "${DSH_EDGE_URL%/}/api/auth/login" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "accessKey=${DSH_EDGE_ACCESS_KEY}" \
            --max-redirs 0 || true)
          echo "логин HTTP $login_code"
          cookie=$(grep -i '^set-cookie:' /tmp/login_headers.txt | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: *//; s/\r$//' | cut -d';' -f1)
          if [ -z "$cookie" ]; then
            echo "::error::кука владельца не выдана — тело логина:"
            cat /tmp/login.json
            exit 1
          fi
          echo "кука получена (значение не печатается)"
          printf '%s' "$cookie" > /tmp/owner_cookie.txt

      - name: 2a) Морда БЕЗ куки — GET /api/harness/events (ожидание 401 до прокси)
        env:
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
        run: |
          set -euo pipefail
          url="${DSH_EDGE_URL%/}/api/harness/events?task_id=integration:telegram&limit=5"
          code=$(curl -sS -o /tmp/body2a.json -w '%{http_code}' -H 'accept: application/json' "$url")
          echo "HTTP $code (ожидание: 401)"
          cat /tmp/body2a.json
          echo

      - name: 2b) Морда С кукой — GET /api/harness/events?task_id=integration:telegram (тот же запрос, что плагин)
        env:
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
        run: |
          set -euo pipefail
          cookie=$(cat /tmp/owner_cookie.txt)
          url="${DSH_EDGE_URL%/}/api/harness/events?task_id=integration:telegram&limit=5&after=0"
          echo "URL: $url"
          code=$(curl -sS -o /tmp/body2b.json -w '%{http_code}' \
            -H "cookie: ${cookie}" -H 'accept: application/json' "$url")
          echo "HTTP $code"
          echo "--- тело ---"
          cat /tmp/body2b.json
          echo

      - name: 3) Харнес — полный дамп журнала (без фильтра task_id, limit=200), ищем integration_status
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
        run: |
          set -euo pipefail
          url="${HARNESS_URL%/}/api/events?limit=200"
          code=$(curl -sS -o /tmp/dump.json -w '%{http_code}' \
            -H "Authorization: Bearer ${HANDS_TOKEN}" -H 'accept: application/json' "$url")
          echo "HTTP $code"
          echo "всего событий в этой странице:"
          jq '.events | length' /tmp/dump.json
          echo "события kind=integration_status (task_id, ts, data):"
          jq -c '[.events[] | select(.kind=="integration_status") | {task_id, ts, data}]' /tmp/dump.json
          echo "уникальные task_id с kind=integration_status:"
          jq -r '[.events[] | select(.kind=="integration_status") | .task_id] | unique | .[]' /tmp/dump.json || echo "(нет ни одного)"
          echo "has_more=$(jq -r .has_more /tmp/dump.json) next_after=$(jq -r .next_after /tmp/dump.json)"

      - name: 3b) Проверка по каждому id из integrations.json — есть ли для него integration_status
        run: |
          set -euo pipefail
          echo "ids из dsh-edge/integrations.json:"
          jq -r '.integrations[].id' dsh-edge/integrations.json
          echo "--- сверка с task_id из дампа (шаг 3) ---"
          for id in $(jq -r '.integrations[].id' dsh-edge/integrations.json); do
            count=$(jq --arg tid "integration:$id" '[.events[] | select(.kind=="integration_status" and .task_id==$tid)] | length' /tmp/dump.json)
            echo "integration:$id → событий integration_status в первой странице (limit=200): $count"
          done
