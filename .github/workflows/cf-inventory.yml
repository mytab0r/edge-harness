# Прогон инвентаря возможностей Cloudflare (issue #322): секреты есть только
# здесь, локально агент их не видит. Лог — доказательство, не пересказ
# документации. Ничего не пишет и не удаляет — только GET/безопасные проверки.
name: cf-inventory

on:
  workflow_dispatch:

# github.token этой работе нужен ТОЛЬКО на чтение (checkout) — без явного
# permissions: {} он получает дефолтные права репозитория (тот же класс, с
# которым борется ADR 0008). Находка ревью PR #328, п.3. contents: read
# объявлен ЯВНО на job'е — checkout без него делает шаг зависимым от того,
# как GitHub трактует незаданные скоупы; гвардия
# scripts/lib/test_dispatch_token_usage.py красит job с checkout без
# явного contents (класс закрыт в #869, поймано на ребейзе 2026-09-11).
permissions: {}

jobs:
  inventory:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Инвентарь (workers, DO, KV/D1/R2, зоны, bindings-имена)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf/status.sh

      - name: Логи воркера — доступны ли за окно
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/cf/worker-logs.sh
