# Применение решения владельца, присланного нажатием инлайн-кнопки в Telegram
# (#254). Морда шлёт repository_dispatch тем же узким GH_DISPATCH_TOKEN, что и
# остальной dispatch-путь (ADR 0008: только Contents+Actions на этот
# репозиторий) — этот job читает ТРИ секрета репозитория:
# TELEGRAM_WEBHOOK_SECRET (проверка подписи, ниже) плюс
# TELEGRAM_BOT_TOKEN/TELEGRAM_CHAT_ID (ответ владельцу на ОТВЕРГНУТОЕ
# нажатие, #1398 — разбор у самих переменных в step'е ниже), плюс
# issues:write из своих же permissions (github.token). Все три секрета
# существующие, НОВЫХ не заводилось — но TELEGRAM_WEBHOOK_SECRET несёт
# ВТОРУЮ роль (ключ подписи решения владельца) с правкой #1251, и это
# принято ЯВНО, не молча: ADR 0014, «Изменение 2026-09-17» (класс
# «секрет-шире-имени», находка ревью PR #1254). Число секретов названо
# здесь и в докстринге scripts/orchestra/apply_owner_decision.py — две
# копии одного факта расходятся молча, поэтому правятся синхронно
# (находка ai-ревью PR #1401: этот PR завёл расхождение сам).
#
# Результат неотличим от ручного ответа владельца комментарием (#470/#471):
# первая строка «РЕШЕНИЕ: N» — тот же артефакт, который снимает waiting:owner
# гвардия scripts/orchestra/waiting_owner_guard.py (#470/#471, слит) на
# следующем пульсе orchestra. Второй "apply"-путь здесь НЕ заводится, только
# запись комментария (apply_owner_decision.py переиспользует post_issue_comment).
#
# ⚠️ repository_dispatch запускает воркфлоу только с файла на default branch
#    (docs/research/21-github-actions.md) — до мержа этого файла в main
#    события owner-decision принимаются GitHub API (204), но job не стартует.
#
# Подпись client_payload (issue #1251): repository_dispatch не проверяет,
# каким токеном его вызвали, только scope — без подписи любой держатель
# токена с правом Actions-write на этот репозиторий (это есть у каждого
# агента) получил бы отсюда тот же артефакт «РЕШЕНИЕ: N», что и настоящее
# нажатие кнопки. TELEGRAM_WEBHOOK_SECRET — существующий секрет: уже
# репозиторный GitHub Actions secret (deploy-worker.yml/telegram-webhook.yml
# читают его тем же именем) и уже воркер-секрет Cloudflare, аутентифицирующий
# бота вебхука (cf-worker/src/harness.ts) — новый секрет здесь не заводится,
# но добавленная роль честно названа: Actions-копию секрета читает ЛЮБОЙ
# слитый workflow, изоляцией от агентов подпись НЕ является — её назначение
# происхождение артефакта и цена подделки (ADR 0014, «Изменение 2026-09-17»).
# Сама проверка подписи (три РАЗНЫХ отказа, см. докстринг
# scripts/orchestra/apply_owner_decision.py) — целиком в этом скрипте, этот
# workflow только прокидывает секрет и подпись из client_payload.
name: owner-decision

on:
  repository_dispatch:
    types: [owner-decision]

permissions:
  # contents: read обязателен рядом с issues: write (находка ревью PR #486,
  # третий заход) — явный блок permissions обнуляет ВСЕ остальные скоупы
  # токена, а actions/checkout@v7 ниже клонирует репозиторий этим же
  # github.token; без contents:read checkout падает 403, job красный
  # каждый прогон, комментарий «РЕШЕНИЕ: N» не появляется никогда — тот же
  # приём, что уже применяют соседние тонкие job'ы branch-protection-watch.yml
  # и quotas.yml.
  contents: read
  issues: write

concurrency:
  # Сериализация по задаче: два подряд нажатия на одну и ту же задачу (двойной
  # тап, повтор доставки) не гонятся друг с другом за порядком комментариев.
  group: owner-decision-${{ github.event.client_payload.issue_number }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Комментарий с решением владельца
        # client_payload — через env, не подставлен в shell напрямую (тот же
        # приём, что hands.yml/dispatch-latency-probe.yml): единственный заслон
        # от произвольного содержимого — numeric-валидация argparse на другом
        # конце доверия (--issue/--option: type=int), не сам workflow.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.client_payload.issue_number }}
          OPTION: ${{ github.event.client_payload.option }}
          # Подпись (#1251) — signature из client_payload через env, тем же
          # приёмом, что ISSUE_NUMBER/OPTION выше; сам секрет для сверки —
          # отдельная переменная TELEGRAM_WEBHOOK_SECRET (имя читает
          # SIGNATURE_SECRET_ENV_VAR в apply_owner_decision.py), не CLI-аргумент,
          # тем же приёмом, что GH_TOKEN не подставляется в argv.
          SIGNATURE: ${{ github.event.client_payload.signature }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          # Ответ ТОМУ, кто нажал, тем же каналом, которым пришёл вопрос
          # (#1398). До этой правки отвергнутое нажатие оставляло ровно один
          # след — красный прогон, у которого читателя нет: владелец видел
          # нажатую кнопку и считал решение принятым, а задача сутки стояла
          # с waiting:owner (живой случай #1379).
          #
          # Цена названа явно, а не умолчана: job получает ДВА новых секрета
          # и вместе с ними право писать в чат владельца. Оба уже читают
          # соседние job'ы того же конвейера (orchestra.yml, worker.yml,
          # deploy-worker.yml и др.), новых секретов не заводится, и
          # отправитель один на репозиторий — pulse_guard.send_telegram.
          # Альтернатива «пусть уведомляет отдельный job по workflow_run»
          # отвергнута: между отказом и уведомлением появился бы второй
          # прогон, способный не состояться, — то есть тот же класс
          # «сигнал теряется молча», только этажом выше.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/orchestra/apply_owner_decision.py \
            --repo "$REPO" \
            --issue "$ISSUE_NUMBER" \
            --option "$OPTION" \
            --signature "$SIGNATURE"
