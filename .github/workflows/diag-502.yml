name: diag-502
on:
  push:
    branches: [agent/502-dsh-edge-e2e-smoke]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: npm install (playwright-core, без загрузки браузеров)
        working-directory: dsh-edge/e2e-smoke
        run: npm install --no-audit --no-fund

      - name: Мутационная проверка — заведомо неверный ключ доступа (смоук обязан покраснеть)
        working-directory: dsh-edge/e2e-smoke
        env:
          DSH_EDGE_ACCESS_KEY: definitely-wrong-key-for-mutation-test-0000
          BASE_URL: https://dsh-edge.mytab0r.workers.dev
        run: |
          if node smoke.mjs; then
            echo "::error::смоук ДОЛЖЕН был покраснеть на неверном ключе — мутационная проверка провалена"
            exit 1
          else
            echo "✅ мутационная проверка: смоук корректно красный на неверном ключе доступа"
          fi

      - name: Прогон e2e-смоука на живом проде (контроль — обязан быть зелёным)
        working-directory: dsh-edge/e2e-smoke
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
          BASE_URL: https://dsh-edge.mytab0r.workers.dev
        run: |
          time node smoke.mjs
