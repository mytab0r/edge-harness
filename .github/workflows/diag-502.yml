name: diag-502
# Временный диагностический workflow (issue #502): прогоняет dsh-edge/e2e-smoke
# на реальном проде под системным Chrome раннера, чтобы доказать рабочесть
# смоука перед тем, как звать его частью deploy-dsh-edge.yml. Удаляется вместе
# с PR, закрывающим #502.
on:
  push:
    branches: [agent/502-dsh-edge-e2e-smoke]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: npm install (playwright-core, без загрузки браузеров)
        working-directory: dsh-edge/e2e-smoke
        run: npm install --no-audit --no-fund

      - name: Прогон e2e-смоука на живом проде
        working-directory: dsh-edge/e2e-smoke
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
          BASE_URL: https://dsh-edge.mytab0r.workers.dev
        run: |
          time node smoke.mjs
