name: diag-502
# Временный диагностический workflow (issue #502): смотрит на реальную DOM-
# структуру морды dsh-edge (сайдбар настроек, вкладки) под системным Chrome
# раннера, чтобы e2e-смоук строился по факту разметки, а не по пересказу.
# Удаляется вместе с PR, закрывающим #502.
on:
  push:
    branches: [agent/502-dsh-edge-e2e-smoke]

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Установить playwright-core (без загрузки браузеров — используем системный Chrome)
        run: npm install --no-save playwright-core@1.63.0

      - name: Снять разметку сайдбара настроек под системным Chrome
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          cat > /tmp/explore.mjs <<'NODE'
          import { chromium } from 'playwright-core'
          import { writeFileSync } from 'node:fs'
          const base = 'https://dsh-edge.mytab0r.workers.dev'
          const browser = await chromium.launch({ channel: 'chrome' })
          const context = await browser.newContext()
          const page = await context.newPage()
          page.on('console', msg => console.log('CONSOLE:', msg.type(), msg.text()))
          page.on('pageerror', err => console.log('PAGEERROR:', err.message))
          await page.goto(base + '/login', { waitUntil: 'networkidle' })
          await page.waitForTimeout(1000)
          const loginHtml = await page.content()
          writeFileSync('/tmp/login.html', loginHtml)
          console.log('--- login page html length ---', loginHtml.length)
          const inputs = await page.$$eval('input', els => els.map(e => ({ type: e.type, name: e.name, id: e.id, placeholder: e.placeholder })))
          console.log('--- inputs on /login ---', JSON.stringify(inputs))
          const buttons = await page.$$eval('button', els => els.map(e => ({ text: (e.textContent||'').trim(), type: e.type })))
          console.log('--- buttons on /login ---', JSON.stringify(buttons))
          await page.locator('input').first().fill(process.env.DSH_EDGE_ACCESS_KEY)
          await Promise.all([
            page.waitForNavigation({ waitUntil: 'networkidle' }).catch(() => {}),
            page.locator('button[type=submit], button').first().click().catch(() => page.keyboard.press('Enter')),
          ])
          await page.waitForTimeout(2000)
          console.log('--- URL after login ---', page.url())
          await page.goto(base + '/', { waitUntil: 'networkidle' })
          await page.waitForTimeout(3000)
          console.log('--- root page title ---', await page.title())
          const bodyHtml = await page.content()
          console.log('--- root body length ---', bodyHtml.length)
          writeFileSync('/tmp/root.html', bodyHtml)
          const navTexts = await page.$$eval('a, button, [role="tab"], [role="link"], [role="menuitem"], [role="listitem"], li', els =>
            els.slice(0, 300).map(e => ({ tag: e.tagName, text: (e.textContent||'').trim().slice(0,40), href: e.getAttribute('href'), role: e.getAttribute('role'), testid: e.getAttribute('data-testid'), cls: (e.getAttribute('class')||'').slice(0,60) })).filter(e => e.text)
          )
          console.log('--- nav-like elements (first 300) ---')
          console.log(JSON.stringify(navTexts, null, 2))
          await browser.close()
          NODE
          node /tmp/explore.mjs 2>&1 | head -400
