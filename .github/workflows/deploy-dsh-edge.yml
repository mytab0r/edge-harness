# Деплой морды dsh-edge. Основной путь — сборка из исходников апстрима с
# плагинами по манифесту (задача #80, design — openspec/changes/dsh-edge-plugin-system/):
# клон pawaca/dsh-edge на пине из dsh-edge/upstream.json → патч-серия
# dsh-edge/patches/ → плагиновые tgz из релизов ЭТОГО репо (sha256 из
# dsh-edge/plugins.json) → кодогенерация композиции → бандл → гвардия состава →
# verify → деплой → канарейка. Всё падает громко: не сошёлся sha256, не
# применился патч, гвардия, node --check.
#
# Fallback — npm-префаб (как до #80) и используется ТОЛЬКО при пустом
# манифесте. Официальный `npx dsh-edge upgrade` интерактивен и для CI не
# годится; префаб-деплой делает то же без вопросов. Данные Durable Object
# переживают деплой (класс и миграция v1 не меняются), секреты воркера
# (DSH_EDGE_ACCESS_KEY, DEEPSEEK_*) wrangler не трогает.
name: deploy-dsh-edge

on:
  schedule:
    # Ежедневно вне топ-часа; расписание действует только на default branch.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия dsh-edge для префаб-fallback (пусто = последняя стабильная из npm)"
        required: false
        type: string

concurrency:
  group: deploy-dsh-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/setup@v2
        with:
          version: 11
          install: false

      # Маршрут: непустой манифест = source-build с плагинами (основной путь),
      # пустой = префаб-fallback. Одно место правды — dsh-edge/plugins.json;
      # валидация формы манифеста и пина — CLI manifest.mjs (первый шаг,
      # до любых дорогих действий; ошибка формы — красный job здесь, а не
      # на кодогенерации). Сырые поля манифеста в bash не интерполируются —
      # только проверенные значения из CLI-вывода.
      - name: Маршрут по манифесту (валидация CLI)
        id: route
        run: |
          manifest=$(node dsh-edge/manifest.mjs)
          echo "$manifest"
          count=$(jq -r '.count' <<<"$manifest")
          ids=$(jq -r '.ids | join(" ")' <<<"$manifest")
          sha=$(jq -r '.upstream.sha' <<<"$manifest")
          repo=$(jq -r '.upstream.repo' <<<"$manifest")
          echo "plugins=$count" >> "$GITHUB_OUTPUT"
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "Манифест валиден: $count плагин(ов) [$ids]; апстрим $repo@$sha"

      - name: Секреты на месте?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN не задан"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID не задан"; exit 1; }

      # ── Основной путь: сборка из исходников с плагинами ────────────────────────

      - name: Клон апстрима на пине
        if: steps.route.outputs.plugins != '0'
        run: |
          mkdir clone && cd clone
          git init -q
          git remote add origin "https://github.com/${{ steps.route.outputs.repo }}.git"
          git fetch -q --depth 1 origin "${{ steps.route.outputs.sha }}"
          git checkout -q FETCH_HEAD
          actual=$(git rev-parse HEAD)
          [ "$actual" = "${{ steps.route.outputs.sha }}" ] || { echo "::error::Клон не на пине: $actual != ${{ steps.route.outputs.sha }}"; exit 1; }
          echo "Клон на пине $actual"

      - name: Патч-серия
        if: steps.route.outputs.plugins != '0'
        working-directory: clone
        run: |
          shopt -s nullglob
          patches=(../dsh-edge/patches/*.patch)
          [ ${#patches[@]} -gt 0 ] || { echo "::error::Патч-серия пуста, а манифест требует source-build"; exit 1; }
          for p in "${patches[@]}"; do
            git apply --whitespace=nowarn "$p" || { echo "::error::Патч не применился: $p — апстрим уехал от пина"; exit 1; }
            echo "применён: $p"
          done

      - name: Скачать плагины и сверить sha256
        if: steps.route.outputs.plugins != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p plugins-tgz
          # Имена релизов, assets и ожидаемые sha256 — из валидированного
          # манифеста (CLI manifest.mjs), не из сырого JSON и не из логов.
          # Скачиваем ТОЛЬКО названные assets (--pattern), а не весь релиз:
          # лишний tgz не имеет права проехать в pnpm add. Цикл — из файла,
          # не из pipeline: exit внутри subshell пайпа не ронял бы шаг.
          manifest=$(node dsh-edge/manifest.mjs)
          jq -r '.plugins[] | [.id, .release, .asset, .sha256] | @tsv' <<<"$manifest" > plugins.tsv
          : > checksums.txt
          : > plugins-tgz/downloaded.txt
          while IFS=$'\t' read -r id release asset sha; do
            echo "плагин $id: релиз $release, asset $asset"
            gh release download "$release" --repo "$GITHUB_REPOSITORY" \
              --dir plugins-tgz --pattern "$asset" --clobber \
              || { echo "::error::Релиз $release недоступен — манифест ссылается на несуществующий источник"; exit 1; }
            [ -f "plugins-tgz/$asset" ] || { echo "::error::В релизе $release нет asset'а $asset (плагин $id)"; exit 1; }
            echo "$sha  plugins-tgz/$asset" >> checksums.txt
            echo "plugins-tgz/$asset" >> plugins-tgz/downloaded.txt
            # Срезы правды, вшитые в релизный пакет, сверяются с репо (#115):
            # иначе правка dsh-edge/integrations.json или plugins.json без
            # пересборки и релиза даёт зелёный деплой, который синкует секреты
            # и пишет статусы по новому реестру, а секция UI молча показывает
            # старый состав. integrations.json — байт-в-байт; у manifest.json
            # plugin-manager сверяется ростер id/server/client (sha самой
            # записи в копии пакета отстаёт по принятой самореференции).
            if tar -tf "plugins-tgz/$asset" | grep -q '^package/integrations.json$'; then
              tar -xOf "plugins-tgz/$asset" package/integrations.json \
                | diff -q - "$GITHUB_WORKSPACE/dsh-edge/integrations.json" >/dev/null \
                || { echo "::error::Реестр интеграций в релизе $asset разошёлся с dsh-edge/integrations.json — пересобери и перевыпусти плагин (конвейер #80)"; exit 1; }
            fi
            if tar -tf "plugins-tgz/$asset" | grep -q '^package/manifest.json$'; then
              if ! diff \
                <(tar -xOf "plugins-tgz/$asset" package/manifest.json | jq -S '[.plugins[] | {id, server, client}]') \
                <(jq -S '[.plugins[] | {id, server, client}]' "$GITHUB_WORKSPACE/dsh-edge/plugins.json") >/dev/null; then
                echo "::error::Ростер манифеста в релизе $asset разошёлся с dsh-edge/plugins.json — пересобери и перевыпусти плагин (конвейер #80)"; exit 1
              fi
            fi
          done < plugins.tsv
          sha256sum -c checksums.txt || { echo "::error::sha256 артефакта не сошёлся с манифестом — возможна подмена или перезапись релиза"; exit 1; }

      - name: Установить плагины в standalone (pnpm, не npm)
        if: steps.route.outputs.plugins != '0'
        working-directory: clone/apps/dsh-edge/standalone
        run: |
          # Ставим ровно то, что назвал манифест (список собран на скачивании
          # после сверки sha256), — не глобальный *.tgz.
          args=()
          while IFS= read -r f; do args+=("$GITHUB_WORKSPACE/$f"); done < "$GITHUB_WORKSPACE/plugins-tgz/downloaded.txt"
          [ ${#args[@]} -gt 0 ] || { echo "::error::Ни одного tgz из манифеста не скачано — рассинхрон с манифестом"; exit 1; }
          pnpm add --save-exact "${args[@]}"
          # pnpm-патчи Workers обязательны; add обязан сохранить patchedDependencies
          # (класс silent-wrong #43). Дальнейшую сверку делает verify и гвардия.
          grep -q "patchedDependencies" pnpm-workspace.yaml || { echo "::error::pnpm add потерял patchedDependencies — план Б из design.md"; exit 1; }

      - name: Кодогенерация плагинной композиции
        if: steps.route.outputs.plugins != '0'
        run: node dsh-edge/codegen-edge-plugins.mjs "$GITHUB_WORKSPACE/clone"

      # Рантайм-дым до дорогой сборки: каждый серверный плагин инсталлируется
      # в настоящий cordis с ToolRuntime. Ловит класс #100 (плагин объявил
      # inject: [] и читает ctx.tools — в проде «failed» в рантайме и тулов
      # нет, а сборка зелёная) на деплое, а не по жалобе чата.
      - name: Дым инсталла плагинов (cordis + ToolRuntime)
        if: steps.route.outputs.plugins != '0'
        run: node dsh-edge/smoke-edge-plugins.mjs "$GITHUB_WORKSPACE/clone"

      - name: Сборка морды из исходников
        if: steps.route.outputs.plugins != '0'
        run: pnpm --dir clone/apps/dsh-edge/standalone run build

      - name: Гвардия состава (манифест ↔ артефакт)
        if: steps.route.outputs.plugins != '0'
        run: |
          node dsh-edge/verify-edge-plugins.mjs "$GITHUB_WORKSPACE/clone"
          VERSION=$(node -p "require('./clone/apps/dsh-edge/package.json').version")
          echo "VERSION_DEPLOYED=$VERSION" >> "$GITHUB_ENV"
          echo "Собрана dsh-edge $VERSION с плагинами: ${{ steps.route.outputs.ids }}"

      - name: Контракт и детерминизм артефактов
        if: steps.route.outputs.plugins != '0'
        run: pnpm --dir clone/apps/dsh-edge/standalone run verify

      # Шов раннеров (#119) обязан работать на СОБРАННОМ артефакте до деплоя:
      # unstable_dev поднимает direct-воркер с настоящим DO SQLite и прогоняет
      # путь раннера (батчи, перенумерация turn, 400 на чужой тип, «принято =
      # сохранено», архив). Красный шаг — деплой не начинается: сломанный шов
      # невыгодно ловить на живой морде. Ревью #128 (М2): драйвер закоммичен,
      # проверка воспроизводима.
      - name: Интеграция ingest-шва на собранном артефакте (#119)
        if: steps.route.outputs.plugins != '0'
        working-directory: ${{ github.workspace }}/clone/apps/dsh-edge/standalone
        run: node "$GITHUB_WORKSPACE/dsh-edge/ingest-integration/check.mjs" "$GITHUB_WORKSPACE/clone/apps/dsh-edge"

      # Прокси статусов журнала (#105, патч 0005) обязан работать на СОБРАННОМ
      # артефакте до деплоя — тем же способом, что и ingest-шов: unstable_dev
      # поднимает direct-воркер, рядом заглушка журнала (node:http), и
      # прогоняется контракт /api/harness/events: 401 без куки (журнал не
      # дёргается), 403 кросс-origin, Bearer HANDS_TOKEN и параметры журнала
      # на заглушке, прозрачный проход ответа (включая 401/500 журнала),
      # 400 на кривые параметры, 503 при незаданном HARNESS_URL/HANDS_TOKEN.
      # Красный шаг — деплой не начинается: сломанный прокси = громко
      # ошибающиеся статусы раздела «Плагины» на свежесобранной морде (#235).
      - name: Интеграция прокси статусов на собранном артефакте (#105)
        if: steps.route.outputs.plugins != '0'
        working-directory: ${{ github.workspace }}/clone/apps/dsh-edge/standalone
        run: node "$GITHUB_WORKSPACE/dsh-edge/proxy-integration/check.mjs" "$GITHUB_WORKSPACE/clone/apps/dsh-edge"

      # Реестр провайдеров (#114) обязан работать на СОБРАННОМ артефакте до
      # деплоя: unstable_dev поднимает direct-воркер с настоящим DO SQLite и
      # прогоняет путь владельца Settings → Models теми же RPC, что шлёт UI
      # (namespace llm-pi-ai, directory, негатив при записи, добавление,
      # пикер, рестарт DO, удаление). Красный шаг — деплой не начинается.
      - name: Интеграция реестра провайдеров на собранном артефакте (#114)
        if: steps.route.outputs.plugins != '0'
        working-directory: ${{ github.workspace }}/clone/apps/dsh-edge/standalone
        run: node "$GITHUB_WORKSPACE/dsh-edge/registry-integration/check.mjs" "$GITHUB_WORKSPACE/clone/apps/dsh-edge" "$GITHUB_WORKSPACE/plugins-src/provider-registry/directory.json"

      - name: Деплой-каталог (source-build)
        if: steps.route.outputs.plugins != '0'
        run: |
          mkdir -p deploy
          cp clone/apps/dsh-edge/standalone/worker/direct/index.js deploy/worker.js
          cp -r clone/apps/dsh-edge/standalone/dist deploy/dist
          # Итоговый артефакт обязан быть валидным JS — иначе воркер не поднимется.
          node --check deploy/worker.js
          grep -q "$VERSION_DEPLOYED" deploy/worker.js || { echo "::error::В артефакте нет маркера версии $VERSION_DEPLOYED"; exit 1; }

      # ── Fallback: npm-префаб, только при пустом манифесте ──────────────────────

      - name: Скачать префаб и собрать деплой
        if: steps.route.outputs.plugins == '0'
        env:
          DSH_VERSION: ${{ inputs.version }}
        run: |
          SPEC="dsh-edge${DSH_VERSION:+@$DSH_VERSION}"
          mkdir -p /tmp/dsh-deploy && cd /tmp/dsh-deploy
          set -o pipefail
          npm pack "$SPEC" 2>&1 | tail -1
          TARBALL=$(ls dsh-edge-*.tgz | head -1)
          VERSION_DEPLOYED=${TARBALL#dsh-edge-}
          VERSION_DEPLOYED=${VERSION_DEPLOYED%.tgz}
          tar -xzf "$TARBALL"
          # Маркер версии обязан быть в артефакте: деплоим ровно то, что назвали.
          grep -q "$VERSION_DEPLOYED" package/worker/direct/index.js \
            || { echo "::error::В маркере артефакта нет версии $VERSION_DEPLOYED"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/deploy"
          cp package/worker/direct/index.js "$GITHUB_WORKSPACE/deploy/worker.js"
          cp -r package/dist "$GITHUB_WORKSPACE/deploy/dist"
          echo "VERSION_DEPLOYED=$VERSION_DEPLOYED" >> "$GITHUB_ENV"
          echo "Готов деплой префаба dsh-edge $VERSION_DEPLOYED (манифест пуст)"

      # SVG-носители бренда (#109): строковый ребренд (шаг «Бренд морды» ниже)
      # не достаёт до векторных носителей — вордмарк «deepseek» нарисован путями
      # внутри BrandWordmark, кит — FishLogo и favicon.svg. Все три слота бренда
      # (sidebar.brand.mark, sidebar.brand.name, conversation.hero.brand.mark)
      # заполняет клиентский пакет dsh-client-ui-brand-official, чей client.js
      # лежит в dist статикой: query ?rev= статикой игнорируется (проверено
      # живьём), так что замена = перезапись собранного файла нашим
      # dsh-edge/brand-official.client.js — форма слотов и обёртки сохранена,
      # меняется только отрисовка (текст «mytab0r» вместо кита и вордмарка).
      # Гвардии: файл апстрима обязан существовать и содержать маркеры формы —
      # иначе деплой падает громко, а не выкатывает молчу-чужой бренд.
      - name: Бренд-плагин и favicon морды (SVG-носители)
        working-directory: ${{ github.workspace }}/deploy
        run: |
          BRAND_DIR="dist/plugins/@deepseek-ai/dsh-client-ui-brand-official"
          test -f "$BRAND_DIR/client.js" \
            || { echo "::error::$BRAND_DIR/client.js не найден — upstream сменил состав ростера или путь сборки; патчить некуда"; exit 1; }
          for marker in "dsh-client-ui-brand-official" "OfficialBrandName" "BrandWordmark"; do
            grep -q "$marker" "$BRAND_DIR/client.js" \
              || { echo "::error::В client.js brand-official нет маркера «$marker» — upstream сменил форму пакета, слепая замена опасна"; exit 1; }
          done
          cp "$GITHUB_WORKSPACE/dsh-edge/brand-official.client.js" "$BRAND_DIR/client.js"
          node --check "$BRAND_DIR/client.js" \
            || { echo "::error::Замещающий brand-official.client.js не валиден"; exit 1; }
          grep -q "mytab0r" "$BRAND_DIR/client.js" \
            || { echo "::error::В заменённом brand-official нет маркера mytab0r"; exit 1; }
          test -f dist/favicon.svg || { echo "::error::dist/favicon.svg не найден — upstream убрал favicon, некуда класть замену"; exit 1; }
          cp "$GITHUB_WORKSPACE/dsh-edge/brand-favicon.svg" dist/favicon.svg
          echo "Бренд-плагин: brand.mark/name/hero → mytab0r (кит и вордмарк deepseek убраны), favicon заменён"

      # Селектор моделей в морде строится из каталога, зашитого в адаптере
      # (три DeepSeek-модели). Адаптер поддерживает кастомный каталог `models`,
      # но dsh-edge его не прокидывает — поэтому каталог патчится здесь, на
      # деплое, из vars (один источник правды с руками). Шаг идёт ПОСЛЕ любого
      # пути сборки (source-build и префаб собирают deploy/worker.js выше):
      # без него первый же source-build деплой ТИХО вернул бы селектор к
      # DeepSeek (W1). Форма литералов одинакова на обоих путях — минифицированный
      # вывод esbuild (проверено на source-built артефакте). Если upstream сменит
      # форму каталога — замена не найдётся и деплой упадёт громко, а не
      # соберёт молчу-неверную морду. Постоянное решение — патч 0004 из design
      # (каталог из build-time константы), отложен за PoC.
      - name: Патч каталога моделей под реального провайдера (оба пути)
        working-directory: ${{ github.workspace }}/deploy
        env:
          DSH_EDGE_MODEL_CATALOG: ${{ vars.DSH_EDGE_MODEL_CATALOG }}
          DSH_EDGE_PROVIDER_NAME: ${{ vars.DSH_EDGE_PROVIDER_NAME }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys
          catalog = json.loads(os.environ["DSH_EDGE_MODEL_CATALOG"])
          provider_name = os.environ.get("DSH_EDGE_PROVIDER_NAME") or sys.exit(
              "::error::vars.DSH_EDGE_PROVIDER_NAME не задан — имя провайдера объявляется только в vars репозитория, зашитого дефолта больше нет")
          if not catalog:
              sys.exit("::error::DSH_EDGE_MODEL_CATALOG пуст — не из чего собрать каталог")
          # Инвариант присутствия (#153, находка 2): модель раннеров (vars.DEEPSEEK_MODEL)
          # обязана быть объявлена в каталоге морды — иначе пикер и раннеры разойдутся
          # молча (морда предложит модель, которой раннер не вызывает, или наоборот).
          # Порядок каталога не переставляем и «первый = дефолтный» не додумываем —
          # только факт присутствия.
          runner_model = os.environ.get("DEEPSEEK_MODEL")
          catalog_ids = [m["id"] for m in catalog]
          if not runner_model:
              sys.exit("::error::vars.DEEPSEEK_MODEL не задан — модель раннеров объявляется только в vars репозитория")
          if runner_model not in catalog_ids:
              sys.exit(f"::error::модель раннеров {runner_model!r} не объявлена в vars.DSH_EDGE_MODEL_CATALOG "
                        f"({catalog_ids!r}) — пикер морды и раннеры разойдутся")
          # бандл минифицирован: строковые литералы в нём с двойными кавычками
          entries = ",".join(
              '{{id:"{id}",name:"{name}",contextWindow:{cw}}}'.format(
                  id=m["id"], name=m.get("name", m["id"]),
                  cw=int(m.get("contextWindow", 131072)))
              for m in catalog
          )
          new_array = "[" + entries + "]"
          src = open("worker.js", encoding="utf-8").read()
          # скобочно-сбалансированный матч: массив может содержать вложенные
          # скобки (inputModalities:["text","image"]) — наивный [^\]]* рвёт бандл
          pattern = re.compile(r'\[\{id:"deepseek-v4-flash"(?:[^\[\]]|\[[^\[\]]*\])*\]')
          patched, n = pattern.subn(lambda _: new_array, src, count=1)
          if n != 1:
              sys.exit("::error::Каталог моделей в бандле не найден — upstream сменил форму; патч применять некуда")
          old = 'displayName:"DeepSeek"'
          if old in patched:
              patched = patched.replace(old, f'displayName:"{provider_name}"', 1)
          # имя группы моделей в каталоге (providerInfo) — второй литерал
          group_pat = re.compile(r'\{id:([A-Za-z_$][\w$]*),name:"DeepSeek"\}')
          patched, n2 = group_pat.subn(lambda m: '{id:' + m.group(1) + f',name:"{provider_name}"}}', patched, count=1)
          if n2 != 1:
              sys.exit("::error::Имя группы провайдера (providerInfo) не найдено — upstream сменил форму")
          open("worker.js", "w", encoding="utf-8").write(patched)
          first_id = catalog[0]["id"]
          if f'id:"{first_id}"' not in patched:
              sys.exit("::error::После патча в бандле нет первой модели каталога")
          print(f"Каталог моделей пропатчен: {provider_name} " +
                ", ".join(m["id"] for m in catalog))
          PY
          # пропатченный бандл обязан остаться валидным JS
          node --check worker.js

      # Бренд морды (#101): видимый бренд «DeepSeek Harness» заменяется на
      # «mytab0r Harness» везде, где его видит человек. Носители: worker.js
      # (баннер агента «…running in a Cloudflare Durable Object.», системный
      # промпт, description пакета) и текстовые файлы dist (index.html <title>,
      # manifest.webmanifest name, видимые строки плагинов). Заменяется ТОЛЬКО
      # точная строка с пробелом: в JS-идентификаторах она встречаться не может,
      # поэтому deepseek-official, @deepseek-ai/*, deepseek-v4, /api/* и имена
      # файлов гарантированно не задеты. Гвардии: до замены — суммарное число
      # вхождений обязано быть > 0, иначе upstream сменил брендовые строки
      # (громкое падение, а не молча-нераспознанная морда); после — ни одного
      # вхождения «DeepSeek Harness» в worker.js и dist (побайтовый grep, включая
      # файлы, не декодировавшиеся как UTF-8), а число «mytab0r Harness» обязано
      # сойтись с числом замен. Шаг стоит на общей части обоих путей сборки,
      # после патча каталога (тот брендовых строк не трогает). Форма проверена
      # на артефакте dsh-edge 0.7.1 (пин из dsh-edge/upstream.json на момент
      # проверки; #134 подняла пин до 0.8.0) и на живом проде: 16 вхождений,
      # все — внутри человекочитаемых литералов. Гвардия ниже (>0 до замены,
      # 0 после) перепроверяет форму на каждом деплое, а не полагается на число.
      - name: Бренд морды (DeepSeek Harness → mytab0r Harness)
        working-directory: ${{ github.workspace }}/deploy
        run: |
          python3 - <<'PY'
          import os, sys
          OLD, NEW = "DeepSeek Harness", "mytab0r Harness"
          paths = ["worker.js"]
          for root, _dirs, files in os.walk("dist"):
              for name in files:
                  paths.append(os.path.join(root, name))
          per_file = {}
          total = 0
          for path in paths:
              data = open(path, "rb").read()
              try:
                  src = data.decode("utf-8")
              except UnicodeDecodeError:
                  continue  # бинарный ассет (шрифты) — текстовых замен там нет
              n = src.count(OLD)
              if not n:
                  continue
              # побайтовая запись: BOM и CRLF сохраняются, меняется только литерал
              open(path, "wb").write(src.replace(OLD, NEW).encode("utf-8"))
              per_file[path] = n
              total += n
          if total == 0:
              sys.exit("::error::«DeepSeek Harness» не найден ни в worker.js, ни в dist — upstream сменил брендовые строки, патчить нечего")
          for path, n in sorted(per_file.items()):
              print(f"  {path}: {n}")
          # каждый заменённый литерал обязан встать на место
          rebranded = sum(open(p, "rb").read().count(NEW.encode()) for p in paths)
          if rebranded != total:
              sys.exit(f"::error::Замена не сошлась: заменено {total}, «{NEW}» в дереве {rebranded}")
          print(f"Бренд морды: {total} вхождений «{OLD}» → «{NEW}»")
          PY
          # Гвардия: ни одного вхождения не осталось — побайтово, по всему
          # deploy-дереву (worker.js + dist), включая бинарные файлы.
          if grep -rqF "DeepSeek Harness" worker.js dist; then
            echo "::error::После бренд-патча остались вхождения «DeepSeek Harness»:"
            grep -rlF "DeepSeek Harness" worker.js dist
            exit 1
          fi
          # пропатченный бандл обязан остаться валидным JS
          node --check worker.js

      # Гвардия завязки реестра провайдеров на приватный литерал апстрима
      # (#114): кнопка «Add custom provider» штатного UI пишет в namespace,
      # чьё имя зашито в клиентском бандле литералом NS$1 = "llm-pi-ai".
      # Апстрим может переименовать его без semver-сигнала — тогда кнопка
      # тихо умрёт при зелёной сборке. Гвардия стоит на общей части обоих
      # путей сборки (source-build и префаб) и роняет деплой громко.
      # Мутационное доказательство гвардии — repo-ci
      # (dsh-edge/verify-provider-namespace.test.mjs).
      - name: Гвардия литерала namespace реестра провайдеров (#114)
        working-directory: ${{ github.workspace }}/deploy
        run: node "$GITHUB_WORKSPACE/dsh-edge/verify-provider-namespace.mjs" dist

      # ── Общая часть: конфиг, секреты провайдера, деплой, канарейка ─────────────

      - name: Конфиг воркера
        run: |
          cat > deploy/wrangler.jsonc <<'WRANGLER'
          {
            "name": "dsh-edge",
            "main": "worker.js",

            "compatibility_date": "2026-08-14",
            "compatibility_flags": ["nodejs_compat"],
            "no_bundle": true,
            "vars": {
              // Потолок GLM: дефолт адаптера 256000 отвергается (max 131072)
              "DEEPSEEK_MAX_OUTPUT_TOKENS": "131072",
              "GH_RUNNER_REPO": "mytab0r/edge-harness",
              // Куда прокси статусов (патч 0005, issue #105) ходит за журналом:
              // GET {HARNESS_URL}/api/events с Bearer HANDS_TOKEN (секрет ниже).
              // На префаб-маршруте var мёртв и безвреден: маршрута
              // /api/harness/events в префаб-артефакте нет (патчи не применяются);
              // секрет HANDS_TOKEN при этом на префаб не ставится — обещать
              // возможность без артефакта нечестно, var без неё безопасен.
              "HARNESS_URL": "${{ vars.HARNESS_URL }}"
            },
            "assets": {
              "binding": "ASSETS",
              "directory": "./dist",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/", "/login"]
            },
            "durable_objects": {
              "bindings": [
                { "name": "DSH_EDGE_INSTANCE", "class_name": "DshEdgeInstance" }
              ]
            },
            "migrations": [
              { "tag": "v1", "new_sqlite_classes": ["DshEdgeInstance"] }
            ],
            "observability": { "enabled": true }
          }
          WRANGLER

      # Морда и руки читают провайдера из ОДНОГО места правды — vars репозитория
      # (DEEPSEEK_* — унаследованное имя, значение любой OpenAI-compat endpoint).
      # Секреты воркера переживают деплой, put идемпотентен. ВСЕ ТРИ провайдерных
      # секрета синхронизируются вместе: частичная синхронизация (URL без ключа)
      # даёт 401 на каждом ходе морды — silent-wrong (случай #80).
      # Проверка не дублирует dsh_require_provider_env своим текстом (#153,
      # находка 7) — репозиторий уже чекаутнут в github.workspace, зовём ту же
      # функцию, что и раннеры.
      - name: Секреты провайдера морды
        working-directory: ${{ github.workspace }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
        run: |
          bash -c 'source "$GITHUB_WORKSPACE/scripts/lib/dsh-ci.sh"; dsh_require_provider_env'
          printf '%s' "$DEEPSEEK_API_KEY" | npx wrangler secret put DEEPSEEK_API_KEY
          printf '%s' "$DEEPSEEK_BASE_URL" | npx wrangler secret put DEEPSEEK_BASE_URL
          printf '%s' "$DEEPSEEK_MODEL" | npx wrangler secret put DEEPSEEK_MODEL

      # runner-bridge (#95) диспетчит воркера из чата морды: тот же широкий PAT
      # (GH_PIPELINE_PAT), что у рук и оркестратора — права на issues + workflow
      # dispatch у него уже доказаны (scheduler.py диспетчит worker.yml этим
      # токеном). Узкий GH_DISPATCH_TOKEN сюда не годится: runner-bridgeу нужны
      # issues. Секрет воркера получает своё имя (GH_RUNNER_TOKEN), чтобы морда
      # не знала слов рук; put идемпотентен, значение в лог не печатается.
      - name: Секрет раннера морды (GH_RUNNER_TOKEN)
        working-directory: ${{ github.workspace }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_RUNNER_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: |
          [ -n "$GH_RUNNER_TOKEN" ] || { echo "::error::GH_PIPELINE_PAT не задан — runner_task не сможет диспетчить воркера"; exit 1; }
          printf '%s' "$GH_RUNNER_TOKEN" | npx wrangler secret put GH_RUNNER_TOKEN

      # Интеграции внешних систем (#115): реестр dsh-edge/integrations.json —
      # единственное место правды о том, какие системы подключены и какие
      # ИМЕНА секретов им нужны (значений в реестре нет и быть не может).
      # Здесь три дела: (1) гвардия проводки — форма реестра + каждый его
      # секрет обязан быть упомянут в env ЭТОГО шага, иначе расхождение
      # красит деплой громко, а не оставляет интеграцию вечно not_configured
      # при существующем секрете; (2) синк секретов morde-интеграций в воркер
      # (put идемпотентен; telegram — wired jobs: его ключи читают job'ы
      # раннеров, морде они не нужны); (3) снимок наличия секретов по каждой
      # интеграции — его после канарейки пишет в журнал шаг «Статусы
      # интеграций». Отсутствующий секрет НЕ красит деплой: интеграция без
      # секрета — не поломка морды, а незавершённая настройка; её видимость —
      # журнал и раздел «Интеграции» (state not_configured с именами).
      # Гейт по манифесту: на префаб-маршруте (манифест пуст — аварийный
      # fallback) плагина integrations в воркере нет, и «подключено» для
      # тулов, которых в деплое нет, — ложь (тот же принцип, что у
      # plugin_status ниже).
      - name: Секреты интеграций морды (#115)
        if: steps.route.outputs.plugins != '0'
        working-directory: ${{ github.workspace }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CONFLUENCE_BASE_URL: ${{ secrets.CONFLUENCE_BASE_URL }}
          CONFLUENCE_EMAIL: ${{ secrets.CONFLUENCE_EMAIL }}
          CONFLUENCE_API_TOKEN: ${{ secrets.CONFLUENCE_API_TOKEN }}
          BITBUCKET_USER: ${{ secrets.BITBUCKET_USER }}
          BITBUCKET_APP_PASSWORD: ${{ secrets.BITBUCKET_APP_PASSWORD }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail
          registry=$(node "$GITHUB_WORKSPACE/dsh-edge/integrations.mjs")
          echo "Реестр интеграций: $(jq -r '[.integrations[] | .id] | join(", ")' <<<"$registry")"
          missing='{}'
          synced=0
          while IFS=$'\t' read -r id wired secret; do
            if [ -z "${!secret:-}" ]; then
              missing=$(jq --arg id "$id" --arg s "$secret" '.[$id].missing = ((.[$id].missing // []) + [$s])' <<<"$missing")
              echo "::notice::интеграция $id: секрет $secret в репозитории не задан — статус будет not_configured"
              continue
            fi
            if [ "$wired" = "morde" ]; then
              printf '%s' "${!secret}" | npx wrangler secret put "$secret"
              synced=$((synced + 1))
            fi
          done < <(jq -r '.integrations[] | .id as $id | .wired as $w | .secrets[] | [$id, $w, .] | @tsv' <<<"$registry")
          # Снимок для шага статусов: {id, missing:[имена]} по каждой интеграции.
          echo "$registry" | jq -c --argjson missing "$missing" \
            '.integrations[] | {id: .id, missing: ($missing[.id].missing // [])}' \
            > "$GITHUB_WORKSPACE/integration-states.ndjson"
          echo "Секретов интеграций синхронизировано в воркер: $synced"

      # Секрет журнала для прокси статусов (issue #105, патч 0005-harness-
      # status-proxy): маршрут GET /api/harness/events на морде ходит в журнал
      # (HARNESS_URL) с Authorization: Bearer <HANDS_TOKEN> — тем же токеном,
      # который журнал принимает от рук (cf-worker/src/harness.ts: exact match
      # на Bearer). Патч существует только на source-build маршруте, поэтому
      # и секрет синкается только там: класть его префаб-воркеру — обещать
      # возможность, которой в артефакте нет.
      - name: Секрет журнала для прокси статусов (HANDS_TOKEN)
        if: steps.route.outputs.plugins != '0'
        working-directory: ${{ github.workspace }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
        run: |
          [ -n "$HANDS_TOKEN" ] || { echo "::error::HANDS_TOKEN не задан — прокси /api/harness/events не сможет аутентифицироваться в журнале"; exit 1; }
          printf '%s' "$HANDS_TOKEN" | npx wrangler secret put HANDS_TOKEN

      - name: plugin_status → deploying
        if: steps.route.outputs.plugins != '0'
        # Промежуточный статус — best-effort: лежащий журнал не имеет права
        # блокировать деплой морды (скрипт для non-final ретраит и не красит
        # job; continue-on-error страхует от неожиданных ошибок самого шага).
        continue-on-error: true
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          SOURCE: deploy
          STATE: deploying
        run: |
          for id in ${{ steps.route.outputs.ids }}; do
            PLUGIN_ID=$id bash scripts/plugins/plugin_status.sh
          done

      - name: Деплой
        working-directory: ${{ github.workspace }}/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail обязателен: pipeline | tail маскирует код wrangler,
          # и упавший деплой дошёл бы до канарейки старого воркера и
          # ложного ready в журнале.
          set -o pipefail
          npx wrangler deploy 2>&1 | tail -8

      # Деплой, не оставивший живую морду, — не деплой, а поломка. Корень для
      # неавторизованных отвечает 302 на /login (проверено на проде), поэтому
      # идём за редиректом и требуем 200 конечной страницы.
      - name: Канарейка прода
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" https://dsh-edge.mytab0r.workers.dev/)
          if [ "$code" != "200" ]; then
            echo "::error::Морда отвечает $code после деплоя $VERSION_DEPLOYED"
            exit 1
          fi
          echo "✅ dsh-edge $VERSION_DEPLOYED жив: https://dsh-edge.mytab0r.workers.dev"

      # Шов «сессия раннера в морде» (#119): деплой обязан не просто поднять
      # морду, а оставить работающим маршрут ingest транскрипта — им живут все
      # раннеры (worker, hands). Прогон на живом проде: логин → сессия-канарейка
      # в воркспейсе edge-harness → батч событий → архив. Неудача — красный
      # деплой: сломанный шов невидим владельцу иначе, чем по красному job'у.
      - name: Канарейка ingest-шва (#119)
        if: success()
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          base="https://dsh-edge.mytab0r.workers.dev"
          jar="$RUNNER_TEMP/dsh-edge-canary.cookies"
          code=$(curl -s -o /dev/null -w "%{http_code}" -c "$jar" \
            -X POST "$base/api/auth/login" --data-urlencode "accessKey=$DSH_EDGE_ACCESS_KEY")
          [ "$code" = "303" ] || { echo "::error::Логин канарейки #119 не удался (HTTP $code)"; exit 1; }
          rpc() {
            local method=$1 payload=$2
            curl -fsS -b "$jar" -H 'content-type: application/json' \
              -X POST "$base/api/$method" -d "$payload" \
              || { echo "::error::RPC $method канарейки #119 отклонён"; exit 1; }
          }
          ws=$(rpc workspace.create '{"type":"client-request","rpcId":"canary","method":"workspace.create","payload":{"path":"/workspace/edge-harness"}}' \
            | jq -r '.result.value.workspace.workspaceId')
          [ -n "$ws" ] && [ "$ws" != "null" ] \
            || { echo "::error::Воркспейс edge-harness недоступен (#119)"; exit 1; }
          sid="deploy-canary-$(date -u +%Y%m%dT%H%M%S)"
          rpc session.create '{"type":"client-request","rpcId":"canary","method":"session.create","payload":{"workspaceId":"'"$ws"'","sessionId":"'"$sid"'"}}' >/dev/null
          rpc session.rename '{"type":"client-request","rpcId":"canary","method":"session.rename","payload":{"sessionId":"'"$sid"'","title":"деплой-канарейка #119"}}' >/dev/null
          printf '%s\n' \
            '{"type":"turn/start","data":{"turn":1}}' \
            '{"type":"turn/end","data":{"turn":1,"reason":{"kind":"completed"}}}' \
            | jq -s '{events: .}' > "$RUNNER_TEMP/dsh-edge-canary-batch.json"
          appended=$(curl -fsS -b "$jar" -H 'content-type: application/json' \
            -X POST "$base/api/sessions/$sid/ingest" \
            --data-binary "@$RUNNER_TEMP/dsh-edge-canary-batch.json" | jq ".appended") \
            || { echo "::error::Ingest канарейки #119 упал"; exit 1; }
          [ "$appended" -ge 2 ] \
            || { echo "::error::Ingest канарейки #119 не принял батч (appended=$appended)"; exit 1; }
          rpc workspace.archiveSession '{"type":"client-request","rpcId":"canary","method":"workspace.archiveSession","payload":{"sessionId":"'"$sid"'"}}' >/dev/null
          echo "✅ ingest-шов #119 жив: сессия $sid создана, наполнена, заархивирована"

      # Канарейка реестра провайдеров (#114), только чтение: деплой обязан не
      # просто поднять морду, а смонтировать namespace llm-pi-ai и directory
      # готовых маршрутов — без них кнопки Settings → Models мертвы, и это
      # видно только живым RPC. Мутаций в проде канарейка не делает
      # (добавление/удаление доказано интеграцией на собранном артефакте).
      # Состав directory-маршрутов ниже генерируется из
      # plugins-src/provider-registry/directory.json — единственного места
      # правды о каталоге (плюс штатный deepseek-official); списки руками
      # не ведутся.
      - name: Канарейка реестра провайдеров (#114)
        if: success() && steps.route.outputs.plugins != '0'
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          base="https://dsh-edge.mytab0r.workers.dev"
          jar="$RUNNER_TEMP/dsh-edge-registry-canary.cookies"
          code=$(curl -s -o /dev/null -w "%{http_code}" -c "$jar" \
            -X POST "$base/api/auth/login" --data-urlencode "accessKey=$DSH_EDGE_ACCESS_KEY")
          [ "$code" = "303" ] || { echo "::error::Логин канарейки #114 не удался (HTTP $code)"; exit 1; }
          rpc() {
            curl -fsS -b "$jar" -H 'content-type: application/json' -H 'User-Agent: edge-harness-deploy-canary/1.0' \
              -X POST "$base/api/$1" -d "$2"
          }
          rpc settings.describe '{"type":"client-request","rpcId":"canary114","method":"settings.describe","payload":{}}' \
            > "$RUNNER_TEMP/registry-describe.json"
          jq -e '.result.value.namespaces[] | select(.ns == "llm-pi-ai")' "$RUNNER_TEMP/registry-describe.json" >/dev/null \
            || { echo "::error::Namespace llm-pi-ai не смонтирован на проде — кнопки Settings → Models мертвы (#114)"; exit 1; }
          rpc llm.providers '{"type":"client-request","rpcId":"canary114","method":"llm.providers","payload":{}}' \
            > "$RUNNER_TEMP/registry-providers.json"
          routes="deepseek-official $(node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).map((x) => x.route).join(" "))' plugins-src/provider-registry/directory.json)"
          for route in $routes; do
            jq -e --arg route "$route" '.result.value.providers[] | select(.provider == $route)' \
              "$RUNNER_TEMP/registry-providers.json" >/dev/null \
              || { echo "::error::Маршрута $route нет в llm.providers на проде (#114)"; exit 1; }
          done
          official_active=$(jq -r '.result.value.providers[] | select(.provider == "deepseek-official") | .active' \
            "$RUNNER_TEMP/registry-providers.json")
          [ "$official_active" = "true" ] || { echo "::error::Штатный провайдер deepseek-official не активен на проде — селектор моделей сломан"; exit 1; }
          echo "✅ реестр #114 жив на проде: namespace llm-pi-ai смонтирован, directory содержит штатного и 4 готовых маршрута"

      - name: plugin_status → ready
        if: success() && steps.route.outputs.plugins != '0'
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          SOURCE: deploy
          STATE: ready
          FINAL: "1"
          DETAIL: ${{ env.VERSION_DEPLOYED }}
        run: |
          for id in ${{ steps.route.outputs.ids }}; do
            PLUGIN_ID=$id bash scripts/plugins/plugin_status.sh
          done

      # Живой статус интеграций (#115) — то, что читает раздел «Интеграции»
      # морды: ready (все секреты на месте, морда задеплоена и канарейкой
      # доказана) или not_configured (каких секретов нет — имена в detail).
      # Морда здесь уже доказанно жива, поэтому FINAL=1: статус обязан доехать.
      - name: Статусы интеграций → журнал (#115)
        if: success() && steps.route.outputs.plugins != '0'
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          SOURCE: deploy
          FINAL: "1"
        run: |
          while IFS=$'\t' read -r id missing; do
            detail=""
            state=ready
            if [ "$missing" != "[]" ]; then
              state=not_configured
              detail="нет секретов репозитория: $(jq -r 'join(", ")' <<<"$missing")"
            fi
            INTEGRATION_ID="$id" STATE="$state" DETAIL="$detail" bash scripts/plugins/integration_status.sh
          done < <(jq -r '[.id, (.missing | tojson)] | @tsv' "$GITHUB_WORKSPACE/integration-states.ndjson")

      # Финальный статус обязан доехать: деплой без ready/failed события в
      # журнале — silent-wrong. Job уже красный; событие нужно для журнала.
      - name: plugin_status → failed
        if: failure() && steps.route.outputs.plugins != '0'
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          SOURCE: deploy
          STATE: failed
          DETAIL: "деплой упал, см. лог job ${{ github.run_id }}"
        run: |
          for id in ${{ steps.route.outputs.ids }}; do
            PLUGIN_ID=$id bash scripts/plugins/plugin_status.sh || true
          done

      # Симметрично plugin_status → failed: если деплой упал, в журнале не
      # должно остаться предыдущее «подключено» как безмолвно живущее. Снимок
      # наличия секретов мог не дожить до этого шага — тогда честно «нет
      # событий», виден только если деплой падал ДО синка секретов.
      - name: Статусы интеграций → failed (#115)
        if: failure() && steps.route.outputs.plugins != '0'
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          SOURCE: deploy
          STATE: failed
          DETAIL: "деплой упал, см. лог job ${{ github.run_id }}"
        run: |
          [ -f "$GITHUB_WORKSPACE/integration-states.ndjson" ] || exit 0
          while IFS=$'\t' read -r id _missing; do
            INTEGRATION_ID="$id" bash scripts/plugins/integration_status.sh || true
          done < <(jq -r '.id' "$GITHUB_WORKSPACE/integration-states.ndjson")

      - name: Итог
        run: |
          echo "Прод обновлён: dsh-edge $VERSION_DEPLOYED"
          if [ "${{ steps.route.outputs.plugins }}" != "0" ]; then
            echo "Плагины по манифесту: ${{ steps.route.outputs.ids }} (source-build, пин ${{ steps.route.outputs.sha }})"
          else
            echo "Манифест пуст — деплоился npm-префаб"
          fi
