# Авто-актуализация морды dsh-edge: ежедневно деплоит свежий стабильный префаб
# из npm. Официальный `npx dsh-edge upgrade` интерактивен (переспрашивает режим и
# секреты) и для CI не годится; префаб-деплой ниже делает то же самое без вопросов:
# данные Durable Object переживают деплой (класс и миграция v1 не меняются),
# секреты воркера (DSH_EDGE_ACCESS_KEY, DEEPSEEK_*) wrangler не трогает.
#
# Префаб, а не сборка из исходников с плагинами: подключение плагинов в dsh-edge
# заблокировано белым пятном #43 и морде не нужно — плагины владельца живут в
# раннере (эпик #17). Морда — всегда свежий апстрим.
name: deploy-dsh-edge

on:
  schedule:
    # Ежедневно вне топ-часа; расписание действует только на default branch.
    - cron: "37 4 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Версия dsh-edge (пусто = последняя стабильная из npm)"
        required: false
        type: string

concurrency:
  group: deploy-dsh-edge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Секреты на месте?
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN не задан"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID не задан"; exit 1; }

      - name: Скачать префаб и собрать деплой
        env:
          DSH_VERSION: ${{ inputs.version }}
        run: |
          SPEC="dsh-edge${DSH_VERSION:+@$DSH_VERSION}"
          mkdir -p /tmp/dsh-deploy && cd /tmp/dsh-deploy
          npm pack "$SPEC" 2>&1 | tail -1
          TARBALL=$(ls dsh-edge-*.tgz | head -1)
          VERSION_DEPLOYED=${TARBALL#dsh-edge-}
          VERSION_DEPLOYED=${VERSION_DEPLOYED%.tgz}
          tar -xzf "$TARBALL"
          # Маркер версии обязан быть в артефакте: деплоим ровно то, что назвали.
          grep -q "$VERSION_DEPLOYED" package/worker/direct/index.js \
            || { echo "::error::В маркере артефакта нет версии $VERSION_DEPLOYED"; exit 1; }
          mkdir -p deploy
          cp package/worker/direct/index.js deploy/worker.js
          cp -r package/dist deploy/dist
          echo "VERSION_DEPLOYED=$VERSION_DEPLOYED" >> "$GITHUB_ENV"
          echo "Готов деплой dsh-edge $VERSION_DEPLOYED"

      - name: Конфиг воркера
        run: |
          cat > /tmp/dsh-deploy/deploy/wrangler.jsonc <<'WRANGLER'
          {
            "name": "dsh-edge",
            "main": "worker.js",
            "compatibility_date": "2026-08-14",
            "compatibility_flags": ["nodejs_compat"],
            "no_bundle": true,
            "assets": {
              "binding": "ASSETS",
              "directory": "./dist",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/", "/login"]
            },
            "durable_objects": {
              "bindings": [
                { "name": "DSH_EDGE_INSTANCE", "class_name": "DshEdgeInstance" }
              ]
            },
            "migrations": [
              { "tag": "v1", "new_sqlite_classes": ["DshEdgeInstance"] }
            ],
            "observability": { "enabled": true }
          }
          WRANGLER

      - name: Деплой
        working-directory: /tmp/dsh-deploy/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy 2>&1 | tail -8

      # Деплой, не оставивший живую морду, — не деплой, а поломка. Проверяем код,
      # Деплой, не оставивший живую морду, — не деплой, а поломка. Корень для
      # неавторизованных отвечает 302 на /login (проверено на проде), поэтому
      # идём за редиректом и требуем 200 конечной страницы.
      - name: Канарейка прода
        run: |
          code=$(curl -sL -o /dev/null -w "%{http_code}" https://dsh-edge.mytab0r.workers.dev/)
          if [ "$code" != "200" ]; then
            echo "::error::Морда отвечает $code после деплоя $VERSION_DEPLOYED"
            exit 1
          fi
          echo "✅ dsh-edge $VERSION_DEPLOYED жив: https://dsh-edge.mytab0r.workers.dev"

      - name: Итог
        run: echo "Прод обновлён до dsh-edge $VERSION_DEPLOYED"
