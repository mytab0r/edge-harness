# Сборка и деплой DSH Edge из исходников с плагинами владельца.
# Клонирует pawaca/dsh-edge, добавляет кастомные плагины, собирает и деплоит на CF.

name: deploy-dsh-edge

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Версия dsh-edge (пусто = последняя)"
        required: false
        type: string

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Клонировать dsh-edge
        run: |
          VERSION_ARG=""
          if [ -n "${{ inputs.version }}" ]; then
            VERSION_ARG="v${{ inputs.version }}"
          fi
          git clone --depth 1 --branch ${VERSION_ARG:-main} https://github.com/pawaca/dsh-edge.git /tmp/dsh-edge-src

      - name: Установить pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install -g pnpm@latest

      - name: Установить зависимости dsh-edge
        run: |
          cd /tmp/dsh-edge-src
          pnpm install --frozen-lockfile

      # В релизе plugins-v1 нет отдельного ассета dsh-combo-router-*.tgz —
      # оба плагина лежат внутри комплекта dsh-combo-suite-*.tgz вложенными tarball'ами.
      - name: Скачать плагины владельца
        env:
          SUITE_TGZ: ${{ vars.PLUGINS_SUITE_URL || 'https://github.com/mytab0r/edge-harness/releases/download/plugins-v1/dsh-combo-suite-0.1.0.tgz' }}
        run: |
          mkdir -p /tmp/suite /tmp/plugins
          # -f обязателен: без него 404-HTML сохраняется в .tgz и npm падает TAR_BAD_ARCHIVE
          curl -fsSL "$SUITE_TGZ" -o /tmp/suite/suite.tgz
          tar xzf /tmp/suite/suite.tgz -C /tmp/plugins
          find /tmp/plugins -name '*.tgz' | sort > /tmp/plugins.list
          cat /tmp/plugins.list
          COUNT=$(wc -l < /tmp/plugins.list)
          if [ "$COUNT" -lt 2 ]; then
            echo "В комплекте найдено $COUNT tarball'ов, ожидалось минимум 2 — релиз сменил состав"
            exit 1
          fi

      - name: Добавить плагины в DSH standalone
        # Падает громко, пока не закрыто белое пятно #43: npm install в pnpm-дерево
        # standalone рвёт pnpm-патчи, а в бандл плагин без правки композиции не попадает.
        run: |
          STANDALONE=/tmp/dsh-edge-src/apps/dsh-edge/standalone
          if [ ! -d "$STANDALONE" ]; then
            echo "standalone не найден: деплой вышел бы без плагинов владельца"
            exit 1
          fi
          cd "$STANDALONE"
          # Устанавливаем плагины как зависимости
          while IFS= read -r tgz; do
            npm install "$tgz" --save
          done < /tmp/plugins.list
          echo "Плагины добавлены в standalone"

      - name: Собрать dsh-edge
        run: |
          cd /tmp/dsh-edge-src
          pnpm build 2>&1 | tail -5

      - name: Подготовить деплой
        run: |
          DEPLOY=/tmp/dsh-deploy
          mkdir -p $DEPLOY

          # Воркер и морда из собранного dsh-edge
          if [ -d /tmp/dsh-edge-src/apps/dsh-edge/standalone/worker ]; then
            cp -r /tmp/dsh-edge-src/apps/dsh-edge/standalone/worker/* $DEPLOY/
          elif [ -d /tmp/dsh-edge-src/apps/dsh-edge/worker ]; then
            cp -r /tmp/dsh-edge-src/apps/dsh-edge/worker/* $DEPLOY/
          fi

          if [ -d /tmp/dsh-edge-src/apps/dsh-edge/standalone/dist ]; then
            cp -r /tmp/dsh-edge-src/apps/dsh-edge/standalone/dist $DEPLOY/dist
          elif [ -d /tmp/dsh-edge-src/apps/dsh-edge/dist ]; then
            cp -r /tmp/dsh-edge-src/apps/dsh-edge/dist $DEPLOY/dist
          fi

          # Wrangler конфиг
          cat > $DEPLOY/wrangler.jsonc <<'WRANGLER'
          {
            "name": "dsh-edge",
            "main": "worker.js",
            "compatibility_date": "2026-08-14",
            "compatibility_flags": ["nodejs_compat"],
            "no_bundle": true,
            "assets": {
              "binding": "ASSETS",
              "directory": "./dist",
              "not_found_handling": "single-page-application",
              "run_worker_first": ["/api/*", "/", "/login"]
            },
            "durable_objects": {
              "bindings": [
                { "name": "DSH_EDGE_INSTANCE", "class_name": "DshEdgeInstance" }
              ]
            },
            "migrations": [
              { "tag": "v1", "new_sqlite_classes": ["DshEdgeInstance"] }
            ],
            "observability": { "enabled": true }
          }
          WRANGLER

          echo "Деплой готов"

      - name: Деплой на Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd /tmp/dsh-deploy
          npx wrangler deploy 2>&1 | tail -10

      - name: Итог
        run: |
          echo "✅ DSH Edge задеплоен: https://dsh-edge.mytab0r.workers.dev"
          echo "Версия: ${{ inputs.version || 'latest' }}"
