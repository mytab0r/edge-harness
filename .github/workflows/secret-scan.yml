# Носитель правила «секреты не попадают в репозиторий никогда, даже в
# примерах» (AGENTS.md:221-222, #634) на двух пробелах, которые не закрывал
# ни один из существующих механизмов: scripts/review/check_pr.py::
# SECRET_PATTERNS уже красит PR-гейт на нескольких форматах в диффе, а
# встроенный GitHub secret scanning + push protection ловят партнёрские
# форматы токенов ещё до пуша — но ни тот, ни другой не видят полную
# историю репозитория (check_pr.py — только диапазон коммитов PR, push
# protection — только новые пуши), и ни тот, ни другой не ловят секрет
# проекта в формате вне своего списка (Cloudflare/Telegram/GitHub
# fine-grained и т.п. в непартнёрском виде, generic-паттерны по энтропии).
#
# Инструмент — gitleaks (MIT, github.com/gitleaks/gitleaks): бесплатен на
# любом плане (в т.ч. для форков), не требует нового секрета репозитория,
# не отправляет содержимое репозитория никуда — сканирование целиком
# локальное, внутри job'а. Сравнение с trufflehog и обоснование выбора —
# docs/research/30-rejected-alternatives.md, раздел «14. Секрет-сканирование».
#
# Два прогона РАЗНОЙ стоимости, специально разделены:
# - `diff` — каждый pull_request (в т.ч. из форков: секреты не нужны,
#   `pull_request` даёт read-only токен даже форку), сканирует ТОЛЬКО
#   диапазон коммитов PR (`--log-opts=base..head`) — доли секунды;
# - `full-history` — periodic (раз в неделю) + workflow_dispatch, сканирует
#   ВСЮ историю всех веток (`--log-opts=--all`). Замер на 2026-09-07: 1013
#   коммитов / ~17 МБ, 4 с прогона локально — дёшево раз в неделю, но
#   растущая история делает этот же прогон на КАЖДЫЙ PR дороже с каждым
#   месяцем без всякой новой пользы (диапазон PR и так покрыт `diff`).
#
# Образ Docker Hub пинуется по тегу И digest — обновление образа апстримом
# не меняет поведение гейта без явной правки этого файла.
name: secret-scan

on:
  pull_request:
  schedule:
    # Воскресенье 03:00 UTC — вне часов активной работы. Секрет, попавший в
    # main, всплывёт максимум через неделю этим прогоном; на попадание ЧЕРЕЗ
    # PR есть быстрый гейт `diff` выше, который видит его в течение минут.
    - cron: "0 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"

jobs:
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks — только диапазон коммитов PR
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" \
            --redact -v

  full-history:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # --report-path пишет JSON-список находок РЯДОМ с обычным логом
      # (--redact там же маскирует значения в самом логе, отчёт несёт то же
      # самое — RuleID/Fingerprint/Commit/File без Secret). Код возврата
      # gitleaks НЕ различает «находки» и «упал на конфиге/реестре/сети» —
      # оба случая exit 1 (проверено живьём: --config на несуществующий
      # файл тоже даёт exit 1) — следующий шаг поэтому решает по отчёту, не
      # по коду возврата (находка ревью #641: «алерт не гадает»).
      - name: gitleaks — вся история, все ветки
        id: scan
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo" -w /repo "$GITLEAKS_IMAGE" detect \
            --source=/repo --config=/repo/.gitleaks.toml \
            --log-opts="--all" --redact -v \
            --report-path=/repo/gitleaks-report.json --report-format json

      # Отчёт — артефакт рана (не тело issue, там нельзя приложить файл):
      # ссылка на него уходит текстом в issue ниже. always() — нужен и на
      # красном скане (report-path пишется gitleaks'ом ДО exit 1 на находке,
      # только не на fatal-сбое конфигурации, где файла нет вовсе —
      # if-no-files-found: ignore тогда просто ничего не грузит, не падает).
      - name: Загрузить отчёт находок как артефакт (без значений секретов)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 14

      # Тормоз без газа не считается (AGENTS.md, «алерт обязан кончаться
      # планом»): job и так красный (видимый исход), плюс отдельная задача в
      # пуле — иначе периодический красный прогон легко потерять между
      # прогонами heartbeat. Значения секретов в тело НЕ идут (см. --redact
      # выше и лог шага «gitleaks» — RuleID/Fingerprint/Commit там же, без
      # Secret). scripts/gh/issue-create, не голый `gh issue create`
      # (docs/agents/PROTOCOL.md) — заводится в общий пул с меткой task.
      # --not-process-ack ОБЯЗАТЕЛЕН: третий тормоз issue-create (#695,
      # приоритетный газ area:process/--not-process-ack) без него делает
      # exit 1 ДО обращения к GitHub — issue-create вызывается без метки
      # area:process, эскалация без --not-process-ack тихо не заводила бы
      # ничего, ровно тот отказ, от которого этот шаг должен страховать.
      # Дедуп по заголовку (#566) на повторных еженедельных находках даст
      # exit 1, если похожая ОТКРЫТАЯ задача уже есть, — это не новый отказ:
      # шаг и так красный (job уже упал на находке gitleaks выше), а «задача
      # уже заведена и ждёт решения» само по себе не требует второй копии.
      - name: Эскалация в пул задач при падении шага (issue, без значений секрета)
        if: failure() && steps.scan.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # gitleaks-report.json есть и непуст ([...]) — реальная находка;
          # файла нет (fatal ДО записи отчёта, проверено живьём на битом
          # --config) или пустой массив ([]) — сбой инструмента, не находка:
          # текст issue не должен утверждать то, чего гейт не подтвердил.
          count=0
          if [ -f gitleaks-report.json ]; then
            count="$(jq 'length' gitleaks-report.json 2>/dev/null || echo 0)"
          fi
          if [ "$count" -gt 0 ] 2>/dev/null; then
            title="secret-scan: находка в истории репозитория (run ${{ github.run_id }})"
            body="Периодический полный прогон gitleaks (.github/workflows/secret-scan.yml, run ${{ github.run_id }}) нашёл потенциальный секрет в истории репозитория ($count шт., отчёт gitleaks-report.json приложен к артефактам рана). Значения не печатаются (--redact в шаге «gitleaks»); там же и в отчёте — RuleID/Fingerprint/Commit/File без Secret. Секрет требует РОТАЦИИ у провайдера, не патча кода: сначала сменить значение, очистка истории — отдельное решение после ротации."
          else
            title="secret-scan: прогон full-history упал БЕЗ находки (run ${{ github.run_id }})"
            body="Периодический полный прогон gitleaks (.github/workflows/secret-scan.yml, run ${{ github.run_id }}) завершился с ошибкой ДО получения отчёта о находках (gitleaks-report.json пуст или отсутствует) — сбой самого инструмента (конфиг/реестр/сеть/образ), не подтверждённая находка секрета. Смотри лог шага «gitleaks — вся история, все ветки» этого рана."
          fi
          scripts/gh/issue-create \
            --title "$title" \
            --label task \
            --not-process-ack "инцидент безопасности/инфраструктуры (возможный секрет или сбой сканера в истории репозитория), не задача про сам процесс работы — приоритет ниже area:process сюда не подходит" \
            --body "$body"
