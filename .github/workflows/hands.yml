# Руки слайса 1 (dsh-in-job): поднимаются по repository_dispatch из морды,
# исполняют задачу полноценным DSH headless и стримят журнал в Durable Object.
# Дизайн — openspec/changes/dsh-in-job/, контракт — openspec/specs/journal-tasks-hands.md.
# Ручной прогон (workflow_dispatch) идёт под task_id manual-<run_id> и НЕ ходит в
# POST /api/tasks: задача из воркфлоу дёрнула бы новый dispatch — бесконечный цикл.
name: hands

on:
  repository_dispatch:
    types: [harness-task]
  workflow_dispatch:
    inputs:
      task_text:
        description: "Текст задачи для DSH headless"
        required: true
        type: string

permissions:
  # contents:write — аренда задачи (#121, ADR 0006): замок refs/locks/task-N
  # создаётся и снимается Git-дата-API. issues:write — видимость аренды:
  # claim() после замка назначает исполнителя и ставит след в задаче. Токен
  # (GH_RUN_TOKEN ниже) уходит из ЭКСПОРТИРУЕМОГО окружения (unset) до старта
  # DSH — агент его не видит; dsh_task.sh хранит копию в необязательной
  # переменной bash (#422, не export) и использует её ПОСЛЕ выхода DSH —
  # только для release-full при провайдере в лимите, снова без экспорта.
  # checkout не оставляет токен в .git/config (persist-credentials: false
  # ниже) — прав на пуш у агента нет.
  contents: write
  issues: write

concurrency:
  group: hands-${{ github.event.client_payload.task_id || 'manual' }}
  cancel-in-progress: false

jobs:
  dsh-task:
    runs-on: ubuntu-latest
    # 70 (#422, было 30): 25 мин таймаут DSH за попытку + до 10 мин бюджета
    # ожидания временного RATE_LIMIT (HANDS_RATE_LIMIT_MAX_WAIT_SECS в
    # dsh_task.sh, короче, чем у worker/ai-review — канал интерактивный,
    # см. обоснование в dsh_task.sh) + повторная попытка до 25 мин + запас.
    timeout-minutes: 70
    steps:
      # persist-credentials: false — github.token (теперь с contents:write) не
      # остаётся в .git/config воркспейса: DSH работает именно в корне чекаута
      # и иначе прочитал бы токен из конфига git (та же гвардия, что в worker.yml).
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm нужен dsh plugin add (монтаж стрим-плагина в профиль headless)
      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Прогон задачи через DSH headless
        env:
          HANDS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          TASK_ID: ${{ github.event.client_payload.task_id || format('manual-{0}', github.run_id) }}
          TASK_TEXT: ${{ inputs.task_text }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Сессия раннера в морде (#119): транскрипт хода работы виден в
          # нативном DSH UI, воркспейс edge-harness, имя = задача. Без
          # конфигурации job падает громко: молча-невидимая сессия дороже
          # красного прогона.
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
          # Провайдер и модель — ровно одно место правды: vars репозитория (#153).
          # Зашитого фолбэка здесь больше нет; пусто → dsh_require_provider_env
          # в dsh_task.sh падает громко до какой-либо дорогой работы.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          # Ротация учёток (#215) — одно место правды: имя переменной и
          # список секретов-кандидатов объявлены в scripts/lib/dsh-ci.sh
          # (PLUGINS_SUITE_CANDIDATE_ROUTES), здесь только проводка. Пусто →
          # dsh_install_plugins_suite печатает «не подключена» и job идёт как
          # раньше (одиночный провайдер) — обратная совместимость, критерий 4
          # приёмки #215.
          PLUGINS_SUITE_URL: ${{ vars.PLUGINS_SUITE_URL }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          ZAI_1_API_KEY: ${{ secrets.ZAI_1_API_KEY }}
          # Аренда задачи (#121): claim_task.py создаёт refs/locks/task-N под
          # этим токеном; dsh_task.sh снимает переменную ИЗ ЭКСПОРТА до старта
          # DSH (копия остаётся в bash-переменной без export для release-full
          # ПОСЛЕ выхода DSH при провайдере в лимите, #422 — см. dsh_task.sh).
          GH_RUN_TOKEN: ${{ github.token }}
        run: bash scripts/hands/dsh_task.sh
