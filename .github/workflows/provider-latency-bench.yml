# Бенчмарк латентности провайдеров-кандидатов (issue #836, доводка #837).
#
# Повод: гейт ai-review держит вердикт 30+ минут, очередь PR не сливается.
# Гипотеза владельца — первый провайдер боевой цепочки самый медленный, а
# непроверенная ёмкость в секретах (учётки, ни разу не вызванные живьём)
# может отвечать быстрее. Порядок цепочки сегодня переставлен по доступности
# квоты, не по латентности — этот workflow снимает число живым вызовом, а не
# гадает.
#
# Список кандидатов — программа (scripts/measure/provider_latency.py:
# build_candidates()), читающая config/provider-usage.json (боевая цепочка,
# #823) и scripts/lib/dsh-ci.sh (PLUGINS_SUITE_CANDIDATE_ROUTES, #215) —
# секреты ниже нужны ВСЕ сразу, по одному кандидату на секрет, в один
# прогон. Значения ключей и тела ответов провайдеров НИКОГДА не печатаются
# (scripts/measure/provider_latency.py) — наружу уходят только числа/статусы.
#
# workflow_dispatch — повторно запускаемый вручную, без расписания:
# by-demand замер (тот же принцип, что quotas.yml), а не постоянный
# мониторинг — если понадобится регулярный прогон, добавить cron отдельным
# решением, не тихой мутацией этого файла.
name: provider-latency-bench

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Промпт для замера (по умолчанию — короткий фиксированный)"
        required: false
        type: string
      timeout_secs:
        description: "Таймаут на КАЖДЫЙ вызов провайдера, секунд (по умолчанию 180)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  bench:
    runs-on: ubuntu-latest
    # Худший случай — КАЖДЫЙ кандидат уходит в таймаут (DEFAULT_TIMEOUT_SECS
    # 180с) последовательно: 10 кандидатов × 180с = 1800с = 30 мин, что уже
    # больше прежних 20 мин job'а (находка ревью #837) — GitHub убил бы
    # прогон посередине, ни одной строки таблицы не сохранив (main() пишет
    # step summary только ПОСЛЕ всех замеров). 35 мин — 30 мин худшего случая
    # + запас на checkout/pytest/guard.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тесты разбора латентности/успеха/таймаута (без сети, фейковый transport)
        run: |
          pip install --quiet pytest
          python -m pytest scripts/measure/test_provider_latency.py -q

      - name: Гвардия дефолта провайдера/модели (класс #153) на новых файлах
        run: bash scripts/lib/test/provider-default.guard.sh

      - name: Замер латентности живым вызовом
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          ZAI_1_API_KEY: ${{ secrets.ZAI_1_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROVIDER_LATENCY_PROMPT: ${{ github.event.inputs.prompt }}
          PROVIDER_LATENCY_TIMEOUT_SECS: ${{ github.event.inputs.timeout_secs }}
        run: python scripts/measure/provider_latency.py
