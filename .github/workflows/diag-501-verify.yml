name: diag-501-verify
on:
  push:
    branches: [agent/501-journal-proxy-404]
jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Логин владельца и запрос через прокси (после деплоя фикса)
        env:
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          set -x
          base="https://dsh-edge.mytab0r.workers.dev"
          jar="$RUNNER_TEMP/diag-501-verify.cookies"
          login_code=$(curl -s -o /dev/null -w "%{http_code}" -c "$jar" \
            -X POST "$base/api/auth/login" --data-urlencode "accessKey=$DSH_EDGE_ACCESS_KEY")
          echo "login status: $login_code"
          [ "$login_code" = "303" ] || { echo "::error::логин не удался"; exit 1; }
          for id in telegram jira confluence bitbucket slack; do
            proxy_code=$(curl -s -o /tmp/proxy-$id.json -w "%{http_code}" -b "$jar" \
              -H "accept: application/json" \
              "$base/api/harness/events?task_id=$(python3 -c "import urllib.parse;print(urllib.parse.quote('integration:$id'))")")
            echo "=== $id: proxy status $proxy_code ==="
            cat /tmp/proxy-$id.json
            echo
          done
