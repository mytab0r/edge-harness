# Автономный воркер (задача #89): берёт свободную задачу из пула (или конкретную
# через input), выполняет её полноценным DSH headless по
# docs/agents/WORKER-PLAYBOOK.md и открывает PR по протоколу. Диспетчится пульсом
# оркестратора (scripts/orchestra/scheduler.py), когда в пуле есть свободная
# задача и активного worker-рана нет, либо вручную. Транспорт —
# scripts/worker/task.sh; работу над задачей делает DSH, не этот workflow.
name: worker

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Номер задачи из пула (пусто = воркер выберет свободную сам)"
        required: false
        type: string

permissions:
  # actions:write — playbook-операции агента (rerun orchestra, workflow run);
  # contents:read — git push ветки идёт под PAT (GH_PIPELINE_PAT), не под этим токеном;
  # issues/pull-requests:write — назначение задачи, комментарии, PR.
  actions: write
  contents: read
  issues: write
  pull-requests: write

# Один воркер на репозиторий: два прогона соперничали бы за одни свободные задачи.
concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  task:
    runs-on: ubuntu-latest
    # 340 (#1067, было 280 с #422/#877): #877 пересчитал бюджет под цепочку
    # арифметикой «N попыток × равный таймаут» — живой инцидент 2026-09-13
    # (прогон 34735752165) показал, что эта посылка ложна: под неё
    # DSH_TIMEOUT_SECS пришлось урезать до 20 мин, и единственный реально
    # работающий провайдер (GLM, первый в цепочке) стал убиваться нашим же
    # таймаутом на КАЖДОМ прогоне (медиана его успешных завершений — ~20 мин,
    # но у 50% замеров больше, максимум 139 мин — см. полный замер и разбор
    # арифметики в комментарии у DSH_TIMEOUT_SECS, scripts/worker/task.sh).
    # #1067 отказался от «все N провайдеров зависли одновременно» как от
    # сценария, который считается, но не наблюдается (ни разу за весь замер),
    # и вернул DSH_TIMEOUT_SECS к 120 мин (task.sh). С тех пор СВЯЗЫВАЮЩЕЕ
    # ограничение длины прогона — #1160: DSH_CHAIN_TOTAL_BUDGET_SECS
    # (9000с по умолчанию, scripts/lib/dsh-ci.sh), суммарный wall-clock
    # потолок на ВСЮ цепочку — она не может занять больше ~9300с (9000с + до
    # 300с ожиданий RATE_LIMIT последней попытки), сколько бы записей и
    # ретраев ни перебрала (нож дедлайна режет каждую попытку и каждый
    # ретрай, DSH_CHAIN_DEADLINE_EPOCH в dsh-ci.sh). Худший легитимный
    # прогон по слагаемым (один набор, оверхед — ЗАМЕРЕННЫЙ ≤1.7 мин,
    # комментарий у WORKER_STALL_MINUTES, scheduler.py, не унаследованные
    # «~50 мин» #877 из шапки task.sh): попытка пула ДО цепочки (до 7200с —
    # wall пула в бюджет цепочки не входит) 120 мин + ~9300с цепочки
    # 155 мин + оверхед ≤2 мин ≈ 277 мин — 340 даёт ~63 мин запаса, а рипер
    # (WORKER_STALL_MINUTES=295) остаётся ВНЕ легитимного коридора. Упор в
    # этот потолок остаётся теоретически возможным, только если полные 7200с
    # займёт зависание ВНЕ бюджетируемой части (попытка пула, внепроточные
    # шаги) поверх худшего легитимного коридора — это громкий отказ (job
    # виден как cancelled/timed_out), а не тихий, и дальше ловится рипером
    # зависших прогонов (WORKER_STALL_MINUTES, scripts/orchestra/scheduler.py)
    # — задача возвращается в пул, не висит на 24-часовом TTL.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7
        with:
          # Полная история: воркер создаёт ветку от свежего origin/main, может
          # ребейзить и пушить — на shallow-клоне это ломается.
          fetch-depth: 0
          # Учетные данные GITHUB_TOKEN (contents:read) не годятся для push:
          # git-авторизацию выдаёт `gh auth setup-git` под PAT ниже.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # pnpm нужен dsh plugin add (монтаж стрим-плагина в профиль headless,
      # #119 — транскрипт сессии в морде; тот же шаг есть у hands).
      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Git-авторизация под PAT владельца
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
        run: |
          # Токен обязан лечь В ФАЙЛ (hosts.yml), а не только в env этого шага:
          # DSH вырезает из model-shell вызовов все env с именами *TOKEN*/*KEY*/
          # *SECRET* (проверено живым прогоном 2026-08-30: без этого gh/git push
          # внутри агента не авторизуются, хотя транспорт task.sh обещает обратное).
          # hosts.yml не env — scrub его не касается, gh и git-хелпер читают оттуда.
          # pipe, а не process substitution: токен не попадает в argv.
          # GH_TOKEN обязан быть вынут из env ДО login: gh отказывается от
          # `auth login --with-token`, пока видит GH_TOKEN в окружении
          # (#117, живой прогон 2026-08-31) — «ambiguous auth source».
          token="$GH_TOKEN"
          unset GH_TOKEN
          printf '%s' "$token" | gh auth login --with-token
          unset token
          gh auth setup-git
          gh auth status 2>&1 | grep -E 'Logged in|account' || true

      - name: Задача через DSH headless
        env:
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
          WORKER_LOGIN: mytab0r
          WORKER_TASK: ${{ inputs.task }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Пульс живости (#112-стопгэп): пока DSH работает, журнал принимает
          # /api/heartbeat — «жив/висит» видно без ожидания конца job'а.
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HEARTBEAT_SECS: "60"
          # Сессия раннера в морде (#119): транскрипт хода работы виден в
          # нативном DSH UI, воркспейс edge-harness, имя = «#N: задача». Без
          # конфигурации job падает громко: молча-невидимая сессия дороже
          # красного прогона.
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
          # Цепочка провайдеров (#727, довод #797) — одно место правды:
          # vars.DSH_PROVIDER_CHAIN репозитория (JSON-массив, порядок =
          # приоритет). Пусто → dsh_require_provider_chain в worker/task.sh
          # падает громко до какой-либо дорогой работы. Секреты ВСЕХ
          # провайдеров цепочки нужны сразу (перебор внутри одного прогона,
          # не переключение между прогонами, тот же принцип, что уже несёт
          # ai-review.yml) — NVIDIA_API_KEY литеральным именем, наравне с уже
          # переданным DEEPSEEK_API_KEY (секрет GLM/z.ai) выше.
          DSH_PROVIDER_CHAIN: ${{ vars.DSH_PROVIDER_CHAIN }}
          # Персистентное состояние квоты (#857, JSON {provider: reset_iso})
          # — читается контекстом workflow БЕЗ токена, тем же путём, что
          # DSH_PROVIDER_CHAIN выше; пишет ТОЛЬКО пульс оркестратора
          # (scripts/orchestra/provider_quota_state.py).
          DSH_PROVIDER_QUOTA_UNTIL: ${{ vars.DSH_PROVIDER_QUOTA_UNTIL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          # Окно контекста env-provider-маршрута combo-router (#789) — тот же
          # источник, что уже требует присутствие DEEPSEEK_MODEL для каталога
          # морды (deploy-dsh-edge.yml): dsh_model_context_window (dsh-ci.sh)
          # ищет DSH_MODEL по id в этом JSON, не в DSH_MAX_TOKENS (тот —
          # потолок вывода, другая величина).
          DSH_EDGE_MODEL_CATALOG: ${{ vars.DSH_EDGE_MODEL_CATALOG }}
          # Ротация учёток (#215) — одно место правды: имя переменной и
          # список секретов-кандидатов объявлены в scripts/lib/dsh-ci.sh
          # (PLUGINS_SUITE_CANDIDATE_ROUTES), здесь только проводка. Пусто →
          # dsh_install_plugins_suite печатает «не подключена» и job идёт как
          # раньше (одиночный провайдер) — обратная совместимость, критерий 4
          # приёмки #215. Секреты-кандидаты не обязаны существовать: пустой
          # секрет просто не даёт маршрута (dsh_patch_profile пропускает его).
          PLUGINS_SUITE_URL: ${{ vars.PLUGINS_SUITE_URL }}
          # Быстрый провайдер Claude (#838, anthropic-oauth-pool) —
          # НЕЗАВИСИМО от PLUGINS_SUITE_URL выше: JSON credentials.json
          # целиком в значении секрета (AGENTS.md «Секреты» — значение
          # никогда не печатается). Оба пусты → dsh_install_anthropic_pool
          # печатает «не подключён», job идёт как раньше.
          ANTHROPIC_OAUTH_1: ${{ secrets.ANTHROPIC_OAUTH_1 }}
          ANTHROPIC_OAUTH_2: ${{ secrets.ANTHROPIC_OAUTH_2 }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          ZAI_1_API_KEY: ${{ secrets.ZAI_1_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash scripts/worker/task.sh
