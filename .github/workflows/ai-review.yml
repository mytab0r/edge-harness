# AI-ревьюер диффа — второй гейт конвейера после детерминированного ревью (#18).
#
# Триггер: завершение workflow pr-review (workflow_run) — единственный
# событийный вход, который РАБОТАЕТ: метки, поставленные GITHUB_TOKEN, не
# создают событий (антирекурсия GitHub), и on: pull_request[labeled] молчал
# бы вечно; workflow_run — документированный обход этого ограничения
# (research/21). Фильтр: pr-review завершился успехом = review:ok поставлен.
# Повтор/миграция — workflow_dispatch (input pr): события отгоревших PR
# не восстановить.
# Итог: содержательный ревью-комментарий в PR + вердикт-метка ai:ok /
# ai:changes-requested / ai:failed. Оркестратор сливает только при
# review:ok И ai:ok (scripts/lib/review_labels.py — одно место правды).
#
# Trust-зона (#18): граница доверия — МЕЖДУ JOB'ами, а не только между env.
# Доверенный код ВСЕГДА из main: чекаут для шагов с GH_TOKEN — ref main,
# ревьюимая ветка — отдельным чекаутом в pr-head и является для агента
# ДАННЫМИ (дерево для чтения), не кодом. PR физически не может подсунуть
# скрипт, который исполнится с токеном (живой прогон 2026-08-31: gather упал
# на PR #108, чья ветка старше скриптов — и вскрыл ровно этот класс).
# Job `review`: недоверенный DSH-шаг не получает GitHub-токенов вовсе; всё,
# что он может испортить (файлы воркспейса, $GITHUB_ENV, $GITHUB_PATH, PATH),
# умирает вместе с виртуалкой job'а; права job'а — только чтение. DEEPSEEK_API_KEY
# нужен вызову модели; DSH вырезает env *TOKEN*/*KEY*/*SECRET* из model-shell
# вызовов (живой прогон 2026-08-30, см. worker.yml).
# Job `verdict`: СВЕЖАЯ машина, свой чекаут main, свой GH_TOKEN с
# pull-requests:write. Ответ ревью переезжает между job'ами ВЫВОДОМ
# доверенного шага (данные, не код); head для сверки — из meta.json,
# написанного доверенным gather.
#
# Concurrency: один прогон на PR. cancel-in-progress НАМЕРЕННО выключен:
# labeled-событие ЛЮБОЙ метки (conflict, orchestra:skip, сами ai:*) создаёт
# run группы даже со скипнутым job — отмена таким run'ом убила бы летящее
# ревью без автоперезапуска (review:ok уже стоит, нового события не будет).
# Протухший вердикт всё равно не применяется: verdict сверяет head.
name: ai-review

on:
  workflow_run:
    workflows: [pr-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер PR (повтор ревью, например после ai:failed)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Группа = породивший run pr-review (уникален) либо номер PR из dispatch:
  # ревью разных PR не сериализуются, у одного PR новый пуш = новый pr-review
  # run = своя группа; протухший вердикт всё равно не применяется (head-check).
  group: ai-review-${{ github.event.workflow_run.id || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    # pr-review завершился успехом (= review:ok поставлен) либо ручной dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # 60 мин — таймаут DSH (ai_dsh.sh) + установка и доверенный gather.
    # Рабочий каталог — $RUNNER_TEMP/ai-review (шаги берут его из шелл-env
    # раннера; job-level env не знает контекста runner — GitHub такой файл
    # отклоняет целиком, поймано живым прогоном).
    timeout-minutes: 70
    outputs:
      answer: ${{ steps.answer.outputs.text }}
      head: ${{ steps.answer.outputs.head }}
      dsh_rc: ${{ steps.answer.outputs.dsh_rc }}
      pr: ${{ steps.facts.outputs.pr }}
      go: ${{ steps.facts.outputs.go }}
    steps:
      # Факты идут step-outputs'ами, НЕ через GITHUB_ENV: env-файл общий на
      # job, и недоверенный шаг мог бы дописать туда переменные для соседей.
      # Step-outputs читаются из СВОЕГО временного файла на момент закрытия
      # шага — поздние записи в него игнорируются.
      - name: Факты PR (номер, head, решение «ревьюим?»)
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ github.event.inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          pr=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$PR_INPUT" in ''|*[!0-9]*) echo "::error::номер PR не число: '$PR_INPUT'"; exit 1 ;; esac
            pr=$PR_INPUT
          else
            # workflow_run не знает номера PR: ищем открытый PR по head-sha
            # завершившегося pr-review-рана.
            pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&per_page=100" \
              --jq ".[] | select(.head.sha == \"$RUN_HEAD\") | .number" | head -1)
            if [ -z "$pr" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "Открытого PR с head $RUN_HEAD нет (закрыт/слит за время события) — ревьюить нечего."
              exit 0
            fi
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
          [ -n "$head" ] || { echo "::error::у PR #$pr нет head-sha"; exit 1; }
          # Источник правды — метка, а не вывод из conclusion: pr-review мог
          # завершиться успехом с review:large (не ок) — тогда гейт не открыт.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '[.[].name] | join(" ")')
          case " $labels " in
            *" review:ok "*) go=true ;;
            *)
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "PR #$pr: review:ok не стоит ($labels) — гейт первого ревью не открыт, выходим без ревью."
              exit 0
              ;;
          esac
          {
            echo "pr=$pr"
            echo "head=$head"
            echo "go=$go"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$pr, head $head — ревьюим"

      # Доверенный инструментарий — из main: эти скрипты исполняются с
      # GH_TOKEN в шагах ниже и обязаны быть вне досягания ревьюимого PR.
      - if: steps.facts.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Дерево PR — только ДАННЫЕ для агента: агент читает репозиторий в
      # состоянии ветки (docs/спеки/код), но ни один доверенный шаг отсюда
      # не исполняется.
      - if: steps.facts.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.facts.outputs.head }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - if: steps.facts.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.facts.outputs.go == 'true'
        name: Сбор фактов и промпт (доверенный шаг)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.facts.outputs.pr }}
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          mkdir -p "$AI_WORK"
          python scripts/review/ai_review.py gather --pr "$PR_NUMBER" --out "$AI_WORK"

      # ── НЕдоверенный шаг: НИКАКОГО GitHub-токена в env ────────────────────
      # cwd = дерево PR (данные агента), сам транспорт — из main-чекаута.
      - if: steps.facts.outputs.go == 'true'
        name: Ревью агентом (DSH headless, без GitHub-токена)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Провайдер и модель — ровно одно место правды: vars репозитория (#153).
          # Зашитого фолбэка здесь больше нет; пусто → dsh_require_provider_env
          # в review/ai_dsh.sh падает громко до какой-либо дорогой работы.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DSH_TIMEOUT_SECS: "3600"
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          export AI_WORK
          cd "$GITHUB_WORKSPACE/pr-head"
          bash "$GITHUB_WORKSPACE/scripts/review/ai_dsh.sh"

      # Доверенный мост в job verdict: ответ — это ДАННЫЕ (текст модели),
      # не код; verdict исполняет свой чистый чекаут main, а не эти файлы.
      # Ограничение канала — ~1 МБ на выводы job'а; ответ ревью — килобайты
      # (контракт: ≤5 находок + блоки задач). ДелIMITER не встретится в
      # ответе; даже если встретится — вывод исковеркается и verdict уйдёт
      # в error → ai:failed (fail-closed).
      - if: steps.facts.outputs.go == 'true'
        name: Ответ ревью — в выводы job'а
        id: answer
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          {
            echo "head=$(jq -r .head "$AI_WORK/meta.json")"
            # Код возврата dsh — сигнал «транспорт упал» для verdict (иначе
            # ошибка провайдера уходит как «модель нарушила контракт»,
            # silent-wrong). Файла может не быть при экзотическом обрыве шага
            # (например SIGKILL раннера) — тогда пусто читается как «неизвестно».
            echo "dsh_rc=$(cat "$AI_WORK/dsh_rc.txt" 2>/dev/null || echo '')"
            printf 'text<<AI_REVIEW_ANSWER_EOF_7f3a\n'
            cat "$AI_WORK/answer.txt"
            printf 'AI_REVIEW_ANSWER_EOF_7f3a\n'
          } >> "$GITHUB_OUTPUT"

  # ── Доверенный job: свежая VM, чекаут main, токен на запись ────────────────
  verdict:
    needs: review
    if: needs.review.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Доверенный инструментарий — из main; ревьюимое дерево тут не нужно:
      # verdict парсит ответ и ходит в API, текущий head он сверяет сам.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Вердикт: комментарий + метка"
        env:
          GH_TOKEN: ${{ github.token }}
          # Номер PR — из outputs доверенного facts-шага job'а review: у
          # workflow_run-события pull_request-контекста нет, а сырой event
          # недоверенной стороной не редактируется. head — момент gather.
          PR_NUMBER: ${{ needs.review.outputs.pr }}
          HEAD_REVIEWED: ${{ needs.review.outputs.head }}
          ANSWER: ${{ needs.review.outputs.answer }}
          DSH_RC: ${{ needs.review.outputs.dsh_rc }}
        run: |
          printf '%s\n' "$ANSWER" > "$RUNNER_TEMP/answer.txt"
          python scripts/review/ai_review.py verdict \
            --pr "$PR_NUMBER" --answer "$RUNNER_TEMP/answer.txt" --head "$HEAD_REVIEWED" \
            --dsh-rc "$DSH_RC"
