# AI-ревьюер диффа — второй гейт конвейера после детерминированного ревью (#18).
#
# Триггер: завершение workflow pr-review (workflow_run) — единственный
# событийный вход, который РАБОТАЕТ: метки, поставленные GITHUB_TOKEN, не
# создают событий (антирекурсия GitHub), и on: pull_request[labeled] молчал
# бы вечно; workflow_run — документированный обход этого ограничения
# (research/21). Фильтр: pr-review завершился успехом И на PR стоит метка
# review:ok ИЛИ review:large (проверяет facts-шаг) — второе нужно, чтобы
# газ размерного гейта (#204, apply_large_ok) вообще имел шанс сработать:
# крупный-но-безнаходочный дифф получает review:large, а не review:ok
# (check_pr.py::verdict_for), и без этого условия AI-ревью на нём не
# запускалось бы никогда — тормоз стоял бы без единого AI-вердикта.
# Повтор/миграция — workflow_dispatch (input pr): события отгоревших PR
# не восстановить.
# review:ok сам по себе НЕ означает, что дорогой прогон нужен (#294): чистое
# подтягивание main переставляет review:ok, не меняя дифф PR, и check_pr.py
# в этом случае СОХРАНЯЕТ ai:*-метку — job review проверяет это отдельным
# шагом fingerprint (scripts/review/ai_review.py::cmd_should_run,
# review_labels.should_run_ai_review) ДО чекаута/gather/DSH и отдаёт go=false,
# если дифф не изменился с последнего вердикта AI (ai:failed — исключение,
# его автоповтор по таймеру #196 от диффа не зависит).
# Итог: содержательный ревью-комментарий в PR + вердикт-метка ai:ok /
# ai:changes-requested / ai:failed. Оркестратор сливает только при
# review:ok И ai:ok (scripts/lib/review_labels.py — одно место правды).
#
# Trust-зона (#18): граница доверия — МЕЖДУ JOB'ами, а не только между env.
# Доверенный код ВСЕГДА из main: чекаут для шагов с GH_TOKEN — ref main,
# ревьюимая ветка — отдельным чекаутом в pr-head и является для агента
# ДАННЫМИ (дерево для чтения), не кодом. PR физически не может подсунуть
# скрипт, который исполнится с токеном (живой прогон 2026-08-31: gather упал
# на PR #108, чья ветка старше скриптов — и вскрыл ровно этот класс).
# Job `review`: недоверенный DSH-шаг не получает GitHub-токенов вовсе; всё,
# что он может испортить (файлы воркспейса, $GITHUB_ENV, $GITHUB_PATH, PATH),
# умирает вместе с виртуалкой job'а; права job'а — только чтение. DEEPSEEK_API_KEY
# нужен вызову модели; DSH вырезает env *TOKEN*/*KEY*/*SECRET* из model-shell
# вызовов (живой прогон 2026-08-30, см. worker.yml).
# Job `verdict`: СВЕЖАЯ машина, свой чекаут main, свой GH_TOKEN с
# pull-requests:write (+ statuses:write — вердикт публикуется вторым каналом,
# Commit Status API harness/ai-review, параллельно метке, #345). Ответ ревью
# переезжает между job'ами ВЫВОДОМ
# доверенного шага (данные, не код); head для сверки — step-output фактов,
# закрытый до недоверенного шага: файлы $AI_WORK агенту принадлежат.
#
# Concurrency: группа = породивший pr-review-ран (workflow_run.id) или номер
# PR из dispatch. Новый пуш того же PR = НОВЫЙ pr-review-ран = своя группа —
# параллельные ревью одного PR возможны, и это осознанно: cancel-in-progress
# НАМЕРЕННО выключен — отмена погасила бы летящее ревью без автоперезапуска,
# а протухший вердикт и так не применяется (verdict сверяет head с gather).
name: ai-review

on:
  workflow_run:
    workflows: [pr-review]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Номер PR (повтор ревью, например после ai:failed)"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read
  issues: read

concurrency:
  # Группа = породивший run pr-review (уникален) либо номер PR из dispatch:
  # ревью разных PR не сериализуются, у одного PR новый пуш = новый pr-review
  # run = своя группа; протухший вердикт всё равно не применяется (head-check).
  group: ai-review-${{ github.event.workflow_run.id || github.event.inputs.pr }}
  cancel-in-progress: false

jobs:
  review:
    # pr-review завершился успехом (= review:ok поставлен) либо ручной dispatch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    # 60 мин — таймаут DSH (ai_dsh.sh) + установка и доверенный gather.
    # Рабочий каталог — $RUNNER_TEMP/ai-review (шаги берут его из шелл-env
    # раннера; job-level env не знает контекста runner — GitHub такой файл
    # отклоняет целиком, поймано живым прогоном).
    timeout-minutes: 70
    outputs:
      answer: ${{ steps.answer.outputs.text }}
      head: ${{ steps.answer.outputs.head }}
      dsh_rc: ${{ steps.answer.outputs.dsh_rc }}
      pr: ${{ steps.facts.outputs.pr }}
      # go — окончательное решение job'а: review:ok есть (facts) И дорогой
      # прогон оправдан (fingerprint, #294). Шаг fingerprint не выполняется,
      # если facts.go уже false — тогда его output пуст, что не равно 'true',
      # и needs.review.outputs.go == 'true' в job verdict тоже корректно False.
      go: ${{ steps.fingerprint.outputs.go }}
    steps:
      # Факты идут step-outputs'ами, НЕ через GITHUB_ENV: env-файл общий на
      # job, и недоверенный шаг мог бы дописать туда переменные для соседей.
      # Step-outputs читаются из СВОЕГО временного файла на момент закрытия
      # шага — поздние записи в него игнорируются.
      - name: Факты PR (номер, head, решение «ревьюим?»)
        id: facts
        env:
          GH_TOKEN: ${{ github.token }}
          PR_INPUT: ${{ github.event.inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          # Владелец головы — из события: у PR из форка head живёт в чужом
          # репо, префикс базового владельца искал бы не там (молчаливый
          # зелёный no-op на живом PR).
          HEAD_OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
          # Sha головы завершившегося рана: сверка отсекает «рано» — ветка
          # уже уехала, её ревью придёт новым workflow_run-событием.
          RUN_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          # pipefail обязателен: пайпы ниже (labels) при отказе gh обязаны
          # ронять шаг, а не отдавать пустоту как «гонку закрытия PR».
          set -o pipefail
          pr=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$PR_INPUT" in ''|*[!0-9]*) echo "::error::номер PR не число: '$PR_INPUT'"; exit 1 ;; esac
            pr=$PR_INPUT
          else
            # workflow_run не знает номера PR, но знает ветку и владельца
            # головы: pulls?head=<owner>:<branch> — точный запрос без листания
            # списков (класс «per_page=100 молча теряет хвосты» закрыт по
            # построению). Отказ gh роняет шаг (красный): «временный 5xx» ≠
            # «PR закрыт». Слэши внутри имени ветки — часть имени.
            found=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$HEAD_OWNER:$RUN_BRANCH&state=open" \
              --jq 'if .[0] then ((.[0].number | tostring) + " " + .[0].head.sha) else "" end') \
              || { echo "::error::не смог найти PR по ветке $RUN_BRANCH (сеть/права) — молчаливый no-op тут закрыл бы гейт"; exit 1; }
            pr=${found%% *}
            branch_head=${found#* }
            if [ -z "$pr" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "Открытого PR на ветке $RUN_BRANCH ($HEAD_OWNER) нет (закрыт/слит за время события) — ревьюить нечего."
              exit 0
            fi
            if [ "$branch_head" != "$RUN_HEAD" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "Ветка $RUN_BRANCH уже уехала ($branch_head != $RUN_HEAD) — её ревью придёт новым событием."
              exit 0
            fi
          fi
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)
          [ -n "$head" ] || { echo "::error::у PR #$pr нет head-sha"; exit 1; }
          # Источник правды — метка, а не вывод из conclusion: pr-review мог
          # завершиться успехом с review:large (не ок) — тогда гейт всё равно
          # открыт: review:large — ЕДИНСТВЕННЫЙ путь, которым size_gate метит
          # крупный-но-безнаходочный дифф (verdict_for в check_pr.py ставит
          # либо review:ok, либо review:large — никогда оба сразу), а газ
          # этого тормоза (#204, apply_large_ok в ai_review.py::cmd_verdict)
          # обязан опираться на состоявшийся AI-вердикт на этом же PR. Если
          # не открыть гейт и для review:large, AI-ревью никогда не запустится
          # на крупном диффе вообще — тормоз без AI-вердикта, апрув
          # review:large-ok мёртв по построению, а PR стоит молча (живой
          # замер #204, второй заход: PR #387/#384/#367/#262 без единого
          # ai:*-события в таймлайне). review:changes-requested (есть
          # findings) сюда не попадает — при findings pr-review сам
          # завершается кодом 1, workflow_run.conclusion != success, и job
          # review вообще не стартует по условию выше.
          labels=$(gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" --jq '[.[].name] | join(" ")')
          case " $labels " in
            *" review:ok "*|*" review:large "*) go=true ;;
            *)
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "PR #$pr: ни review:ok, ни review:large не стоит ($labels) — гейт первого ревью не открыт, выходим без ревью."
              exit 0
              ;;
          esac
          {
            echo "pr=$pr"
            echo "head=$head"
            echo "go=$go"
          } >> "$GITHUB_OUTPUT"
          echo "PR #$pr, head $head — ревьюим"

      # Доверенный инструментарий — из main: эти скрипты исполняются с
      # GH_TOKEN в шагах ниже и обязаны быть вне досягания ревьюимого PR.
      - if: steps.facts.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Сверка отпечатка диффа (#294, находка вердикта ai-review PR #294):
      # review:ok мог переставиться чистым подтягиванием main, при котором
      # check_pr.py СОХРАНИЛ существующую ai:*-метку (diff_unchanged) — тогда
      # дорогой прогон не нужен вовсе, а не просто «метка не переставится».
      # go=false здесь останавливает job ДО чекаута pr-head/gather/DSH.
      # Решение — review_labels.should_run_ai_review, то же место правды,
      # что читает check_pr.py (cmd_should_run в ai_review.py, не вторая
      # копия условия в YAML). ai:failed никогда не даёт пропустить прогон —
      # у него отдельный газ на автоповтор по таймеру (#196).
      #
      # workflow_dispatch — единственный документированный путь ручного
      # повтора (ADR 0007 п.4, шапка этого файла) и рабочий инструмент
      # оркестратора для проводки PR через ревью: отпечаток сверять НЕЛЬЗЯ,
      # иначе ручной запуск на PR с окончательным вердиктом и неизменным
      # диффом становится зелёным no-op без единой строчки ревью — владелец
      # теряет единственный газ пересмотра (находка 1 вердикта ai-review
      # PR #294). --force просит cmd_should_run отдать "true" без обращения
      # к сети вовсе (доказано мутацией: без --force дорогой прогон на
      # неизменном отпечатке пропускается и при dispatch). Пустой output
      # шага останавливает job verdict молча (needs.review.outputs.go !=
      # 'true') — поэтому go=true пишется явно в обеих ветках, не только
      # выводом python-команды.
      - if: steps.facts.outputs.go == 'true'
        id: fingerprint
        name: Нужен ли дорогой прогон (сверка отпечатка диффа)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.facts.outputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -o pipefail
          force_flag=""
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            force_flag="--force"
          fi
          run_needed=$(python scripts/review/ai_review.py should-run --pr "$PR_NUMBER" $force_flag) \
            || { echo "::error::не смог решить, нужен ли дорогой прогон ai-review для PR #$PR_NUMBER"; exit 1; }
          if [ "$run_needed" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "PR #$PR_NUMBER: дифф не изменился с последнего вердикта AI — дорогой прогон не нужен."
          fi

      # Дерево PR — только ДАННЫЕ для агента: агент читает репозиторий в
      # состоянии ветки (docs/спеки/код), но ни один доверенный шаг отсюда
      # не исполняется.
      - if: steps.fingerprint.outputs.go == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.facts.outputs.head }}
          path: pr-head
          fetch-depth: 0
          persist-credentials: false

      - if: steps.fingerprint.outputs.go == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - if: steps.fingerprint.outputs.go == 'true'
        name: Сбор фактов и промпт (доверенный шаг)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.facts.outputs.pr }}
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          mkdir -p "$AI_WORK"
          python scripts/review/ai_review.py gather --pr "$PR_NUMBER" --out "$AI_WORK"

      # ── НЕдоверенный шаг: НИКАКОГО GitHub-токена в env ────────────────────
      # cwd = дерево PR (данные агента), сам транспорт — из main-чекаута.
      - if: steps.fingerprint.outputs.go == 'true'
        name: Ревью агентом (DSH headless, без GitHub-токена)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          # Провайдер и модель — ровно одно место правды: vars репозитория (#153).
          # Зашитого фолбэка здесь больше нет; пусто → dsh_require_provider_env
          # в review/ai_dsh.sh падает громко до какой-либо дорогой работы.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          DSH_TIMEOUT_SECS: "3600"
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          export AI_WORK
          cd "$GITHUB_WORKSPACE/pr-head"
          bash "$GITHUB_WORKSPACE/scripts/review/ai_dsh.sh"

      # Доверенный мост в job verdict: ответ — это ДАННЫЕ (текст модели),
      # не код; verdict исполняет свой чистый чекаут main, а не эти файлы.
      # Ограничение канала — ~1 МБ на выводы job'а; ответ ревью — килобайты
      # (контракт: ≤5 находок + блоки задач). ДелIMITER не встретится в
      # ответе; даже если встретится — вывод исковеркается и verdict уйдёт
      # в error → ai:failed (fail-closed).
      - if: steps.fingerprint.outputs.go == 'true'
        name: Ответ ревью — в выводы job'а
        id: answer
        env:
          # head — из step-output фактов (закрыт ДО недоверенного шага):
          # meta.json лежит в $AI_WORK, куда агент пишет по контракту, и
          # подменой head вердикт применился бы к неревьюенному head.
          HEAD_FACT: ${{ steps.facts.outputs.head }}
        run: |
          AI_WORK="$RUNNER_TEMP/ai-review"
          {
            echo "head=$HEAD_FACT"
            # Код возврата dsh — сигнал «транспорт упал» для verdict (иначе
            # ошибка провайдера уходит как «модель нарушила контракт»,
            # silent-wrong). Файла может не быть при экзотическом обрыве шага
            # (например SIGKILL раннера) — тогда пусто читается как «неизвестно».
            echo "dsh_rc=$(cat "$AI_WORK/dsh_rc.txt" 2>/dev/null || echo '')"
            printf 'text<<AI_REVIEW_ANSWER_EOF_7f3a\n'
            cat "$AI_WORK/answer.txt"
            printf 'AI_REVIEW_ANSWER_EOF_7f3a\n'
          } >> "$GITHUB_OUTPUT"

  # ── Доверенный job: свежая VM, чекаут main, токен на запись ────────────────
  verdict:
    needs: review
    if: needs.review.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: write
      statuses: write
    steps:
      # Доверенный инструментарий — из main; ревьюимое дерево тут не нужно:
      # verdict парсит ответ и ходит в API, текущий head он сверяет сам.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: "Вердикт: комментарий + метка"
        env:
          GH_TOKEN: ${{ github.token }}
          # Номер PR — из outputs доверенного facts-шага job'а review: у
          # workflow_run-события pull_request-контекста нет, а сырой event
          # недоверенной стороной не редактируется. head — момент gather.
          PR_NUMBER: ${{ needs.review.outputs.pr }}
          HEAD_REVIEWED: ${{ needs.review.outputs.head }}
          ANSWER: ${{ needs.review.outputs.answer }}
          DSH_RC: ${{ needs.review.outputs.dsh_rc }}
        run: |
          printf '%s\n' "$ANSWER" > "$RUNNER_TEMP/answer.txt"
          python scripts/review/ai_review.py verdict \
            --pr "$PR_NUMBER" --answer "$RUNNER_TEMP/answer.txt" --head "$HEAD_REVIEWED" \
            --dsh-rc "$DSH_RC"

      # Разбудить оркестратор (#297) сразу после вердикта, а не ждать
      # расписания: тот же приём, что в pr-review.yml (workflow_dispatch —
      # документированное исключение из антирекурсии GITHUB_TOKEN, см.
      # комментарий там). Второй гейт (ai:ok/changes-requested/failed)
      # решает готовность PR не меньше первого — если этот вердикт делает
      # PR полностью готовым (review:ok уже стоит), слияние не должно ждать
      # следующего тика расписания.
      # if: always() + continue-on-error: true — тот же довод, что в
      # pr-review.yml: cmd_verdict возвращает 1 ровно при verdict == "error"
      # (ai:failed), а дефолтный `if: success()` пропускал бы будильник
      # именно в этой ветке; сбой самого диспатча (сеть/лимит) тоже не
      # должен красить job verdict — расписание остаётся страховкой.
      - name: "Разбудить оркестратор (#297): вердикт AI готов, не ждать расписания"
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orchestra.yml --ref main
