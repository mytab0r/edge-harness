# Звено ревью конвейера: срабатывает на каждый PR, вешает вердикт-метку
# review:ok / review:changes-requested (+ review:large для крупных диффов).
# Оркестратор сливает только PR с метками review:ok И ai:ok — метки и есть
# триггер следующих шагов (см. docs/agents/PROTOCOL.md и ADR 0007).
#
# Trust-зона (класс «PR подсунул код под write-токен», закрыт по ревью PR #138):
# чекаут по умолчанию — ref: main, ИЗ НЕГО исполняется check_pr.py с
# pull-requests:write. Дерево PR — отдельным чекаутом в pr-tree и только как
# ДАННЫЕ: check_pr компилирует из него изменённые .py (парс, не исполнение).
#
# Последний шаг (#297) будит orchestra.yml сразу, не дожидаясь расписания:
# `gh workflow run` — это workflow_dispatch, единственное (вместе с
# repository_dispatch) исключение из антирекурсии GITHUB_TOKEN
# (docs/research/21-github-actions.md: «events triggered by the GITHUB_TOKEN,
# with the exception of workflow_dispatch и repository_dispatch, will not
# create a new workflow run») — та же механика, что уже проверена живьём для
# scheduler.py → worker.yml. Ставить это на `labeled` нельзя: метку тоже
# ставит GITHUB_TOKEN, а `on: pull_request: [labeled]` для такого события НЕ
# создаёт рана (замерено 2026-08-31, #18, тот же файл-источник) — explicit
# workflow_dispatch обходит именно эту ловушку. Диспатч безусловный (не только
# при review:ok): review:changes-requested тоже может разблокировать других
# кандидатов в очереди (например снять conflict), а orchestra.yml сам решает,
# есть ли что сливать — быстро и дёшево, если нечего.
name: pr-review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # Доверенный код — из main: ревьюимый PR не может подсунуть скрипт,
      # который сам поставит себе review:ok или не снимет протухший ai:*.
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Дерево PR — данные для компиляционной проверки (файлы из диффа).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr-tree
          persist-credentials: false

      - name: Детерминированное ревью диффа
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          python scripts/review/check_pr.py
          --pr ${{ github.event.pull_request.number }}
          --tree pr-tree

      - name: "Разбудить оркестратор (#297): вердикт изменился, не ждать расписания"
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run orchestra.yml --ref main
