# Срез квот и лимитов харнеса (#324): Cloudflare/GitHub/LLM-провайдер в одну
# таблицу, а не гадание при следующем инциденте (см.
# scripts/measure/quotas.py). Секреты Cloudflare есть только здесь — поэтому
# отдельный маленький workflow с ручным триггером, а не часть другого файла.
#
# permissions.issues:write — escalate() пишет след в задачу-статус #120 при
# превышении порога 80% (тот же канал, что у предохранителя конвейера, второй
# не заводим). permissions.actions:read (находка ревью PR #327) — обе
# GitHub-аппроксимации (диспатчи/час, in-progress jobs) читают
# GET /repos/{repo}/actions/runs под github.token; без этого права запрос
# отдаёт 403 и обе строки навсегда «нет данных» в CI — тот самый срез, ради
# которого workflow заведён.
#
# Регулярный мониторинг — то самое «отдельное решение» (#605, не тихая
# мутация этого файла): полный срез здесь остаётся by-demand для человека
# (`workflow_dispatch`), а непрерывное наблюдение ведёт ОТДЕЛЬНЫЙ
# `.github/workflows/quota-watch.yml` — дешёвая частая проверка одной
# метрики (rows_read, та, что вызвала инцидент #324) по событию `pull_request`
# (надёжнее `schedule` — см. докстринг `scripts/measure/quota_watch.py`) плюс
# редкий полный срез (переиспользует `collect_cloudflare`/`collect_github`
# этого модуля напрямую, без дублирования логики) — не чаще раза в час,
# best-effort (см. докстринг `scripts/measure/quota_watch.py`, «Стоимость и
# троттлинг» — попадание в часовое окно не гарантировано). Обоснование
# интервала числами, дедупликация алертов и автозаведение задачи при
# пробитии порога — там же, в scripts/measure/quota_watch.py и
# scripts/measure/quota_alert.py.
name: quotas

on:
  workflow_dispatch:
    inputs:
      candidates_entry:
        description: >-
          Имя записи цепочки, для которой перебрать кандидатов в base_url
          (#1524). Пусто — перебор не запускается: каждый кандидат это
          реальный вызов чужого API, и тратить их на каждом срезе квот
          незачем. Живые кандидаты на перебор — GLM и NVIDIA-NIM-1/2: они
          отвечают 404 по Anthropic-маршруту (замер #1520).
        required: false
        default: ''

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  quotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тесты сборщика квот
        run: |
          pip install --quiet pytest
          python -m pytest scripts/measure/test_quotas.py -q

      - name: Снять срез квот
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # var, не секрет (гвардия #153) — без неё provider_no_quota_api_reason()
          # читает "не задан в окружении" и строка выглядит как "провайдер не
          # настроен", хотя он задан в vars репозитория, просто не проброшен сюда.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: python scripts/measure/quotas.py

      # Стектрейс исключения воркера (#1503). Секреты Cloudflare есть только в
      # этом workflow, поэтому зонд живёт здесь же, а не заводит второй набор
      # прав. `continue-on-error`: зонд диагностический — его отказ не имеет
      # права ронять замер квот, ради которого workflow и существует.
      - name: Стектрейс исключения воркера (Workers Logs, #1503)
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Читает ТОЛЬКО /api/status (счётчики по статусам) — размеры таблиц,
          # без которых «кто жрёт квоту» остаётся гаданием (#1503).
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
        run: python scripts/measure/worker_error_probe.py

      # Чем провайдер отвергает тело запроса dsh (#1520). Цепочка мертва
      # (#1502), конвейер не делает работы вовсе: воркер девятый раз за сутки
      # берёт одну задачу, падает за секунду и возвращает её в пул. Что именно
      # не устраивает провайдера, никто не спрашивал — тело ответа в логи не
      # попадает ни у одной из сторон. Зонд спрашивает и печатает ответ
      # дословно.
      #
      # Живёт здесь, а не в отдельном workflow: ключи цепочки уже проброшены в
      # соседние замеры, и второй набор прав ради одного вопроса — лишняя
      # поверхность. `continue-on-error` по той же причине, что у зонда выше:
      # диагностика не имеет права ронять замер квот.
      - name: Чем провайдер отвергает запрос dsh (#1520)
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
        run: python scripts/measure/anthropic_route_probe.py

      # Перебор кандидатов в base_url (#1524) — только по явному запросу, см.
      # описание входа. Секреты те же, что у зонда выше; отдельного набора
      # прав ради одного вопроса не заводим.
      - name: Кандидаты в base_url для мёртвого маршрута (#1524)
        if: inputs.candidates_entry != ''
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          ENTRY: ${{ inputs.candidates_entry }}
        run: python scripts/measure/anthropic_route_probe.py --candidates "$ENTRY"
