# Срез квот и лимитов харнеса (#324): Cloudflare/GitHub/LLM-провайдер в одну
# таблицу, а не гадание при следующем инциденте (см.
# scripts/measure/quotas.py). Секреты Cloudflare есть только здесь — поэтому
# отдельный маленький workflow с ручным триггером, а не часть другого файла.
#
# permissions.issues:write — escalate() пишет след в задачу-статус #120 при
# превышении порога 80% (тот же канал, что у предохранителя конвейера, второй
# не заводим). permissions.actions:read (находка ревью PR #327) — обе
# GitHub-аппроксимации (диспатчи/час, in-progress jobs) читают
# GET /repos/{repo}/actions/runs под github.token; без этого права запрос
# отдаёт 403 и обе строки навсегда «нет данных» в CI — тот самый срез, ради
# которого workflow заведён.
#
# Регулярный мониторинг — то самое «отдельное решение» (#605, не тихая
# мутация этого файла): полный срез здесь остаётся by-demand для человека
# (`workflow_dispatch`), а непрерывное наблюдение ведёт ОТДЕЛЬНЫЙ
# `.github/workflows/quota-watch.yml` — дешёвая частая проверка одной
# метрики (rows_read, та, что вызвала инцидент #324) по событию `pull_request`
# (надёжнее `schedule` — см. докстринг `scripts/measure/quota_watch.py`) плюс
# редкий полный срез (переиспользует `collect_cloudflare`/`collect_github`
# этого модуля напрямую, без дублирования логики) — не чаще раза в час,
# best-effort (см. докстринг `scripts/measure/quota_watch.py`, «Стоимость и
# троттлинг» — попадание в часовое окно не гарантировано). Обоснование
# интервала числами, дедупликация алертов и автозаведение задачи при
# пробитии порога — там же, в scripts/measure/quota_watch.py и
# scripts/measure/quota_alert.py.
name: quotas

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  quotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тесты сборщика квот
        run: |
          pip install --quiet pytest
          python -m pytest scripts/measure/test_quotas.py -q

      - name: Снять срез квот
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # var, не секрет (гвардия #153) — без неё provider_no_quota_api_reason()
          # читает "не задан в окружении" и строка выглядит как "провайдер не
          # настроен", хотя он задан в vars репозитория, просто не проброшен сюда.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: python scripts/measure/quotas.py
