# Срез квот и лимитов харнеса (#324): Cloudflare/GitHub/LLM-провайдер в одну
# таблицу, а не гадание при следующем инциденте (см.
# scripts/measure/quotas.py). Секреты Cloudflare есть только здесь — поэтому
# отдельный маленький workflow с ручным триггером, а не часть другого файла.
#
# permissions.issues:write — escalate() пишет след в задачу-статус #120 при
# превышении порога 80% (тот же канал, что у предохранителя конвейера, второй
# не заводим). permissions.actions:read (находка ревью PR #327) — обе
# GitHub-аппроксимации (диспатчи/час, in-progress jobs) читают
# GET /repos/{repo}/actions/runs под github.token; без этого права запрос
# отдаёт 403 и обе строки навсегда «нет данных» в CI — тот самый срез, ради
# которого workflow заведён. Периодического расписания нет намеренно: снятие
# среза — by-demand операция; если станет нужен регулярный мониторинг —
# добавить cron отдельным решением, а не тихой мутацией этого файла.
name: quotas

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  # ВРЕМЕННО (issue #503, снять этим же PR до мержа) — прогон доказательства
  # после реального деплоя фикса; см. коммит фикса для контекста.
  diag-503-proof:
    if: github.ref == 'refs/heads/agent/503-integrations-404-cause'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Морда — логин владельца и запрос прокси (тот же путь, что плагин)
        env:
          DSH_EDGE_URL: ${{ vars.DSH_EDGE_URL }}
          DSH_EDGE_ACCESS_KEY: ${{ secrets.DSH_EDGE_ACCESS_KEY }}
        run: |
          set -euo pipefail
          login_code=$(curl -sS -o /tmp/login.json -D /tmp/login_headers.txt -w '%{http_code}' \
            -X POST "${DSH_EDGE_URL%/}/api/auth/login" \
            -H 'content-type: application/x-www-form-urlencoded' \
            --data-urlencode "accessKey=${DSH_EDGE_ACCESS_KEY}" \
            --max-redirs 0 || true)
          echo "логин HTTP $login_code"
          cookie=$(grep -i '^set-cookie:' /tmp/login_headers.txt | head -1 | sed -E 's/^[Ss]et-[Cc]ookie: *//; s/\r$//' | cut -d';' -f1)
          [ -n "$cookie" ] || { echo "::error::кука не выдана"; cat /tmp/login.json; exit 1; }
          for id in telegram jira confluence bitbucket slack; do
            url="${DSH_EDGE_URL%/}/api/harness/events?task_id=integration:$id&limit=5&after=0"
            code=$(curl -sS -o /tmp/body.json -w '%{http_code}' -H "cookie: ${cookie}" -H 'accept: application/json' "$url")
            echo "integration:$id → HTTP $code"
            cat /tmp/body.json
            echo
            if [ "$code" != "200" ]; then
              echo "::error::integration:$id — прокси всё ещё не 200"
              exit 1
            fi
          done
          echo "OK: все интеграции получают 200 через прокси после фикса"

  quotas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Тесты сборщика квот
        run: |
          pip install --quiet pytest
          python -m pytest scripts/measure/test_quotas.py -q

      - name: Снять срез квот
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # var, не секрет (гвардия #153) — без неё provider_no_quota_api_reason()
          # читает "не задан в окружении" и строка выглядит как "провайдер не
          # настроен", хотя он задан в vars репозитория, просто не проброшен сюда.
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
        run: python scripts/measure/quotas.py
