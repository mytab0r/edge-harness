# Создаёт issue для директивы инбокса владельца (#20) по repository_dispatch
# из DO морды (GH_DISPATCH_TOKEN, event_type inbox-issue). Владелец решил не
# заводить отдельный секрет GH_ISSUES_TOKEN (ADR 0015, заменяет ADR 0011):
# штатный github.token под permissions: issues: write делает то же самое —
# точно такая же поверхность прав, что уже стоит у orchestra.yml, новой не
# заводит.
#
# 204 от POST /repos/.../dispatches доказывает только приём события
# (docs/research/21-github-actions.md: «успешный HTTP-код здесь не является
# доказательством запуска»), а не то, что issue реально создана. Поэтому этот
# job ОБЯЗАН подтвердить исход явным callback'ом в DO — POST
# /api/messages/issue-created, тем же каналом (Bearer HANDS_TOKEN), которым
# hands.yml подтверждает живость job'а (heartbeat). Пока подтверждения нет,
# сообщение в инбоксе остаётся processing — ватчдог DO вернёт его в очередь,
# если этот job не запустился вовсе или упал раньше callback'а (fail loud,
# не silent-wrong: 204 ≠ issue создана).
#
# #720: заведённая issue обязана нести машиночитаемое объявление связи —
# это задача пула (`labels[]=task`). Тело директивы владельца при этом НЕ
# блокируется на форме записи: недостающее объявление дописывает сам job
# (`БЛОКИРУЕТСЯ: ничем`, тот же ответ, каким автосоздатели объявляют
# «связей не знаю»), а решает «дописывать или нет» общий парсер гейта
# заведения (scripts/lib/pool_issue.py check-body — единственный парсер на
# Python-гейт, bash-обёртку и этот job; локальной копии регэкспа здесь нет).
# Своё объявление в теле директивы не трогается.
name: inbox-issue

on:
  repository_dispatch:
    types: [inbox-issue]

permissions:
  contents: read
  issues: write

# Группа — по сообщению: два дубля dispatch'а одного message_id (ретрай DO
# после сетевой ошибки на самом dispatch'е) не создают issue параллельно;
# разные сообщения не блокируют друг друга.
concurrency:
  group: inbox-issue-${{ github.event.client_payload.message_id }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Общий парсер объявления связи живёт в репозитории (#720) — job без
      # чекаута его не видит. persist-credentials: false — токен нужен
      # только явным шагам ниже, git-клиенту не остаётся.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Issue из директивы инбокса
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # Из event.client_payload — НЕ интерполируется прямо в run: (шаблоны
          # ${{ }} внутри многострочного title/body были бы инъекцией в shell);
          # DO уже замаскировал секреты в title/body до dispatch'а (redact()).
          TITLE: ${{ github.event.client_payload.title }}
          BODY: ${{ github.event.client_payload.body }}
        run: |
          set -euo pipefail
          # #720: дописать объявление связи, если в теле его нет (парсер —
          # тот же, что у гейтов заведения; stderr парсера с готовой строкой
          # остаётся в логе — это объяснение, почему объявление дописано).
          if ! printf '%s' "$BODY" | python3 scripts/lib/pool_issue.py check-body >/dev/null; then
            BODY="${BODY}"$'\n'"БЛОКИРУЕТСЯ: ничем"
          fi
          created=$(gh api -X POST "repos/$REPO/issues" \
            -f "title=$TITLE" -f "body=$BODY" \
            -f "labels[]=task" -f "labels[]=source:inbox")
          echo "number=$(printf '%s' "$created" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "url=$(printf '%s' "$created" | jq -r .html_url)" >> "$GITHUB_OUTPUT"

      # always(): подтверждение уходит и при упавшем шаге создания — тогда
      # с explicit error, чтобы DO не ждал ватчдога (10 минут) без нужды.
      - name: Подтвердить исход в DO (HANDS_TOKEN)
        if: always()
        env:
          HANDS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          # Эхо claimed_ts из dispatch'а НЕТРОНУТЫМ — DO сверяет его с текущим
          # processing_ts сообщения (CAS): без этого запоздавшее подтверждение
          # от проходки, которую ватчдог уже увёл дальше, задвоило бы issue.
          CLAIMED_TS: ${{ github.event.client_payload.claimed_ts }}
          ISSUE_NUMBER: ${{ steps.create.outputs.number }}
          ISSUE_URL: ${{ steps.create.outputs.url }}
          CREATE_OUTCOME: ${{ steps.create.outcome }}
        run: |
          set -euo pipefail
          if [ -z "$HANDS_URL" ] || [ -z "$HANDS_TOKEN" ]; then
            echo "::error::HARNESS_URL/HANDS_TOKEN не заданы — DO не узнает об этом job'е, сообщение $MESSAGE_ID зависнет до ватчдога"
            exit 1
          fi
          if [ "$CREATE_OUTCOME" = "success" ] && [ -n "$ISSUE_NUMBER" ] && [ "$ISSUE_NUMBER" != "null" ]; then
            body=$(jq -n --argjson id "$MESSAGE_ID" --argjson ts "$CLAIMED_TS" --argjson n "$ISSUE_NUMBER" --arg u "$ISSUE_URL" \
              '{message_id: $id, claimed_ts: $ts, issue_number: $n, issue_url: $u}')
          else
            body=$(jq -n --argjson id "$MESSAGE_ID" --argjson ts "$CLAIMED_TS" --arg e "inbox-issue job: создание issue не удалось (outcome=$CREATE_OUTCOME)" \
              '{message_id: $id, claimed_ts: $ts, error: $e}')
          fi
          # HTTP через общую библиотеку (#1371/#1381): отказ DO обязан нести ТЕЛО.
          # Прежний `curl -fsS` выбрасывал его, и «400 need_claimed_ts» приходил
          # как «curl: (22) The requested URL returned error» — причина, которую
          # DO назвал прямо, терялась по дороге.
          source "$GITHUB_WORKSPACE/scripts/lib/canary_http.sh"
          response=$(canary_http "Подтверждение issue-created" \
            --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $HANDS_TOKEN" -H "Content-Type: application/json" \
            -d "$body" "$HANDS_URL/api/messages/issue-created")
          # 2xx — ещё НЕ приём (#1381). Устаревший claimed_ts DO отвечает
          # 200 + {"accepted": false}: чужая проходка уже увела сообщение, и
          # запись этого job'а отброшена. Раньше шаг выходил нулём — issue
          # создана, DO о ней не знает, дубль всплывёт позже и никто не свяжет
          # его с этим прогоном. Молчать об этом нельзя.
          if [ "$(jq -r '.accepted' <<<"$response")" != "true" ]; then
            echo "::error::DO отклонил подтверждение (accepted != true): $response" >&2
            echo "::error::Issue МОГЛА быть создана этим прогоном (outcome=$CREATE_OUTCOME, number=$ISSUE_NUMBER) — проверь дубль по сообщению $MESSAGE_ID: обычная причина в том, что ватчдог увёл сообщение другой проходке, и её claimed_ts новее нашего" >&2
            exit 1
          fi
