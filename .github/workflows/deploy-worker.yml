# Деплой морды в Cloudflare. Требует секретов репозитория CLOUDFLARE_API_TOKEN и
# CLOUDFLARE_ACCOUNT_ID; без них job падает с явной ошибкой — молча пропущенного
# деплоя быть не должно.
# npm ci идёт ДО всех шагов с npx: иначе wrangler types берёт свежий wrangler из сети,
# генерирует другой контент и гвардия типов ложно падает.
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "cf-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:
    inputs:
      measure_rows_read_days:
        description: >-
          Задача #320: если задано (число суток), вместо деплоя запускает
          разовый замер rows_read Durable Objects (scripts/measure/do_rows_read.py)
          и ничего не деплоит. Пусто — обычный ручной деплой.
        required: false
        default: ""

jobs:
  # Задача #320: разовый диагностический прогон в существующем workflow — здесь
  # уже прокинуты CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID, а новый workflow-файл
  # не дал бы себя задиспатчить до мержа в main (workflow_dispatch виден GitHub
  # только для файлов, уже существующих на default branch). Job независим от
  # deploy, деплойные шаги не трогает.
  measure-rows-read:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.measure_rows_read_days != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Замер rows_read (#320)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MEASURE_DAYS: ${{ github.event.inputs.measure_rows_read_days }}
        run: python scripts/measure/do_rows_read.py --days "$MEASURE_DAYS"

  deploy:
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.measure_rows_read_days == ''
    runs-on: ubuntu-latest
    # issues: write — эскалация автооткота (#614, scripts/orchestra/
    # deploy_worker_rollback_alert.py::escalate_rollback) пишет след в задачу
    # #120 тем же токеном; contents: read обязателен рядом (находка ревью
    # PR #486, тот же приём, что owner-decision.yml/branch-protection-watch.yml) —
    # явный блок permissions обнуляет ВСЕ остальные скоупы токена, а
    # actions/checkout@v7 ниже клонирует репозиторий этим же github.token.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cf-worker/package-lock.json

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: npm ci
        working-directory: cf-worker

      - name: Проверка секретов
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDS: ${{ secrets.HANDS_TOKEN }}
          DISPATCH: ${{ secrets.GH_DISPATCH_TOKEN }}
          SESSION: ${{ secrets.SESSION_SECRET }}
          TG_BOT: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_WEBHOOK: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          missing=0
          for pair in "CLOUDFLARE_API_TOKEN:$CF_TOKEN" "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT" \
                      "HANDS_TOKEN:$HANDS" "GH_DISPATCH_TOKEN:$DISPATCH" "SESSION_SECRET:$SESSION"; do
            name=${pair%%:*}
            if [ -z "${pair#*:}" ]; then
              echo "::error::Секрет ${name} не задан. Деплой невозможен: задай его в Settings → Secrets → Actions."
              missing=1
            fi
          done
          # TELEGRAM_BOT_TOKEN/TELEGRAM_WEBHOOK_SECRET/TELEGRAM_CHAT_ID (#254) —
          # тем же приёмом опциональны: без них кнопка в Telegram у владельца
          # «крутится» (callback_query честно логируется, деплой не блокируем).
          if [ -z "$TG_BOT" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN не задан: морда не сможет ответить на нажатие инлайн-кнопки (answerCallbackQuery/editMessageText, #254)."
          fi
          if [ -z "$TG_WEBHOOK" ]; then
            echo "::warning::TELEGRAM_WEBHOOK_SECRET не задан: вебхук-путь для callback_query закрыт наглухо (#254) — заведи секрет и передай то же значение в Telegram setWebhook."
          fi
          # TELEGRAM_CHAT_ID (находка ревью PR #486, ADR 0014 шаг 1): без него
          # вебхук-путь принимает апдейты ЛЮБОГО чата бота, не только владельца —
          # секрет вебхука аутентифицирует бота, не отправителя.
          if [ -z "$TG_CHAT" ]; then
            echo "::warning::TELEGRAM_CHAT_ID не задан: вебхук-путь (message и callback_query) закрыт наглухо — секрет вебхука сам по себе не привязывает вебхук к владельцу."
          fi
          exit $missing

      - name: Типы актуальны?
        # Имена секретов wrangler types читает из .dev.vars (значения не важны,
        # важны ключи) — иначе генерат молча теряет их и гвардия ложно падает.
        # Хеш конфигурации wrangler может отличаться от закоммиченного из-за
        # окружения CI; комментарий про секреты добавляется вручную после генерации.
        # Сравниваем только существенные различия: Env-интерфейс и runtime types.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -f .dev.vars ] || cp .dev.vars.example .dev.vars
          npx wrangler types
          # Фильтруем известные безвредные отличия: строка хеша, комментарий про секреты
          # (в новых версиях wrangler его нет), заголовки diff (---/+++).
          # В diff строки начинаются с -/+; паттерны учитывают это.
          if ! git diff -- worker-configuration.d.ts | grep -vE '^[-+].*hash: |^[-+].*Secrets \(HANDS_TOKEN|^[-+].*they are set via|^--- |^\+\+\+ ' | grep -q '^[+-]'; then
            exit 0
          fi
          git diff -- worker-configuration.d.ts | head -40
          echo "::error::worker-configuration.d.ts устарел: запусти 'npm run types' и закоммить."
          exit 1
        working-directory: cf-worker

      # Гвардия узости GH_DISPATCH_TOKEN (задача #6): морда — поверхность,
      # смотрящая в интернет, и её dispatch-токен обязан быть fine-grained.
      # Классический PAT GitHub помечает свои скоупы заголовком X-OAuth-Scopes
      # (проверено живым запросом 2026-08-31), у fine-grained его нет — по
      # отсутствию заголовка и отличаем. Набор пермишенов fine-grained токена
      # API не интроспектирует — это ограничение гвардии, а не её ошибка.
      # Включается переменной vars.GH_DISPATCH_TOKEN_KIND=fine-grained ВМЕСТЕ
      # с установкой узкого токена (до свапа в секрете лежит широкий PAT, и
      # гвардия честно предупреждает, а не красит каждый деплой).
      # Шаг обязан стоять ДО wrangler deploy и secret put: красный деплой
      # обязан ОСТАНОВИТЬ установку широкого токена в секрет морды, а не
      # констатировать её задним числом (находка AI-ревью #146).
      - name: Гвардия узости GH_DISPATCH_TOKEN (напоминание о миграции)
        if: vars.GH_DISPATCH_TOKEN_KIND != 'fine-grained'
        run: |
          echo '::warning::GH_DISPATCH_TOKEN не проверен: vars.GH_DISPATCH_TOKEN_KIND != fine-grained. Миграция #6 не завершена — в секрете может лежать широкий PAT.'
      - name: Гвардия узости GH_DISPATCH_TOKEN
        if: vars.GH_DISPATCH_TOKEN_KIND == 'fine-grained'
        env:
          TOKEN_VALUE: ${{ secrets.GH_DISPATCH_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          headers=$(mktemp)
          code=$(curl -sS -o /dev/null -D "$headers" -w '%{http_code}' \
            -H "Authorization: Bearer $TOKEN_VALUE" \
            -H "Accept: application/vnd.github+json" \
            -H "User-Agent: edge-harness-deploy" \
            "https://api.github.com/repos/$REPO")
          if [ "$code" != "200" ]; then
            rm -f "$headers"
            echo "::error::GH_DISPATCH_TOKEN не читает этот репозиторий: GET /repos/$REPO → $code"
            exit 1
          fi
          if grep -qi '^x-oauth-scopes:' "$headers"; then
            scopes=$(grep -i '^x-oauth-scopes:' "$headers" | tail -1 | cut -d' ' -f2-)
            rm -f "$headers"
            echo "::error::GH_DISPATCH_TOKEN — классический PAT (X-OAuth-Scopes: $scopes), ожидается fine-grained с Contents+Actions только на этот репозиторий (ADR 0008, задача #6)"
            exit 1
          fi
          rm -f "$headers"
          echo "GH_DISPATCH_TOKEN: fine-grained (X-OAuth-Scopes отсутствует), репозиторий читается — гвардия пройдена"

      - name: Деплой
        id: deploy
        run: npx wrangler deploy
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Воркер удалялся из CF вместе с его секретами. Переустанавливаем их при каждом
      # деплое идемпотентно: wrangler secret put обновляет существующее значение.
      # Значения — те же секреты репозитория, что использует канарейка и hands-job.
      # GH_DISPATCH_TOKEN — узкий fine-grained PAT (Contents+Actions на этот
      # репозиторий, задача #6): морда больше не держит широкий PAT владельца.
      # Директивы инбокса несёт этот же токен (repository_dispatch → job
      # .github/workflows/inbox-issue.yml, ADR 0015) — третьего секрета
      # GH_ISSUES_TOKEN больше нет.
      # TELEGRAM_BOT_TOKEN/TELEGRAM_WEBHOOK_SECRET/TELEGRAM_CHAT_ID (#254, находка
      # ревью PR #486): опциональны — без них callback_query честно логируется,
      # кнопка у владельца «крутится», но деплой не красится. Без
      # TELEGRAM_CHAT_ID вебхук-путь закрыт наглухо даже с верным
      # TELEGRAM_WEBHOOK_SECRET — секрет вебхука аутентифицирует бота, не
      # отправителя.
      - name: Секреты воркера
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          printf '%s' "$HANDS_TOKEN" | npx wrangler secret put HANDS_TOKEN
          printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN
          printf '%s' "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET
          if [ -n "$TELEGRAM_BOT_TOKEN" ]; then
            printf '%s' "$TELEGRAM_BOT_TOKEN" | npx wrangler secret put TELEGRAM_BOT_TOKEN
          else
            echo "::warning::TELEGRAM_BOT_TOKEN не задан — морда не сможет ответить на нажатие кнопки (#254)"
          fi
          if [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
            printf '%s' "$TELEGRAM_WEBHOOK_SECRET" | npx wrangler secret put TELEGRAM_WEBHOOK_SECRET
          else
            echo "::warning::TELEGRAM_WEBHOOK_SECRET не задан — вебхук-путь для callback_query закрыт наглухо (#254)"
          fi
          if [ -n "$TELEGRAM_CHAT_ID" ]; then
            printf '%s' "$TELEGRAM_CHAT_ID" | npx wrangler secret put TELEGRAM_CHAT_ID
          else
            echo "::warning::TELEGRAM_CHAT_ID не задан — вебхук-путь (message и callback_query) закрыт наглухо (находка ревью PR #486)"
          fi

      # Канарейка на проде: вход в морду реальным браузером. Упала — деплой красный.
      - name: Канарейка UI на проде
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/canary-ui.mjs --url "${{ vars.HARNESS_URL }}" --token "$HANDS_TOKEN"
        working-directory: cf-worker
        env:
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}

      # Тормоз без газа не принимается (задача #614, тот же класс, что issue
      # #549 закрыл в deploy-dsh-edge.yml, — приём взят оттуда буквально):
      # красная канарейка/шаг после деплоя оставляла прод на сломанной версии
      # до ручного вмешательства, без единого следа в Telegram/#120. Условие —
      # ровно то же, что у соседа: деплой обязан был пройти (steps.deploy.
      # outcome == 'success', не откатываем то, чего не разворачивали, если
      # упал сам `wrangler deploy`), а job красный (failure()) — неважно, упала
      # ли именно канарейка или шаг синка секретов после неё (тот же охват,
      # что у образца).
      #
      # `wrangler rollback` без явного version-id сам находит нужную версию
      # (packages/wrangler/src/versions/rollback/index.ts::
      # fetchDefaultRollbackVersionId апстрима cloudflare/workers-sdk):
      # сортирует деплои по created_on, убирает текущий (только что раскатанный
      # сломанный) и берёт первый с percentage:100. Наш путь деплоя всегда
      # 100% (без gradual-сплита), так что «прошлая 100%-версия» = «прошлый
      # деплой». `--message` заполняет confirm()/prompt() дефолтом без
      # интерактива на не-TTY раннере — тот же паттерн, каким этот файл уже
      # гоняет `wrangler deploy`/`wrangler secret put` без зависаний.
      #
      # Первый деплой воркера вообще (нет ни одной прежней 100%-версии) —
      # апстрим бросает «Could not find stable Worker Version»; continue-on-error
      # не даёт этому отказу потеряться поверх уже красной канарейки (исходный
      # сигнал остаётся видимым, а не маскируется вторичным), а следующий шаг
      # эскалации честно назовёт «автооткат не подтверждён».
      - name: Автооткат прода при красной канарейке
        id: auto_rollback
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 3
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler rollback --yes \
            --message "auto-rollback: канарейка красная, run ${{ github.run_id }}" \
            2>&1 | tee rollback.log
          grep -qi "has been deployed to 100% of traffic" rollback.log \
            || { echo "::error::Автооткат не подтвердил успех — см. лог шага, прод может остаться на сломанной версии"; exit 1; }
          echo "rolled_back=true" >> "$GITHUB_OUTPUT"
          echo "🔙 Прод автоматически откачен на предыдущую 100%-версию"

      # Газ обязан быть доказан, не заявлен (тот же приём, что deploy-dsh-edge.yml):
      # после отката корень морды снова обязан отвечать полным циклом входа —
      # той же канарейкой Playwright, что и выше (браузер уже установлен
      # предыдущим шагом в этом же job'е, переустанавливать не нужно). Красная
      # повторная канарейка — худший случай (задача #614, п.1) и обязана
      # остаться громкой: continue-on-error здесь НЕТ нарочно.
      - name: Канарейка после автооткота
        id: post_rollback_canary
        if: failure() && steps.deploy.outcome == 'success'
        run: node scripts/canary-ui.mjs --url "${{ vars.HARNESS_URL }}" --token "$HANDS_TOKEN"
        working-directory: cf-worker
        env:
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}

      # Эскалация (задача #614, п.2): тот же канал, что предохранитель
      # конвейера — задача-статус #120 + Telegram (scripts/orchestra/
      # pulse_guard.py::escalate, вызван через deploy_worker_rollback_alert.py).
      # Второй канал для того же класса «поломка прода после деплоя» не
      # заводим. continue-on-error: true — сама эскалация best-effort
      # (см. pulse_guard.escalate) и не имеет права затенить собой исходный
      # сигнал о красной канарейке/автооткате.
      - name: Эскалация автооткота (#120/Telegram)
        if: failure() && steps.deploy.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ROLLBACK_CONFIRMED: ${{ steps.auto_rollback.outputs.rolled_back == 'true' }}
          POST_ROLLBACK_OK: ${{ steps.post_rollback_canary.outcome == 'success' }}
        run: python scripts/orchestra/deploy_worker_rollback_alert.py
