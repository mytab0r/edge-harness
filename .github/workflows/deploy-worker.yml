# Деплой морды в Cloudflare. Требует секретов репозитория CLOUDFLARE_API_TOKEN и
# CLOUDFLARE_ACCOUNT_ID; без них job падает с явной ошибкой — молча пропущенного
# деплоя быть не должно.
# npm ci идёт ДО всех шагов с npx: иначе wrangler types берёт свежий wrangler из сети,
# генерирует другой контент и гвардия типов ложно падает.
name: deploy-worker

on:
  push:
    branches: [main]
    paths:
      - "cf-worker/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cf-worker/package-lock.json

      - run: npm ci
        working-directory: cf-worker

      - name: Проверка секретов
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDS: ${{ secrets.HANDS_TOKEN }}
          DISPATCH: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          missing=0
          for pair in "CLOUDFLARE_API_TOKEN:$CF_TOKEN" "CLOUDFLARE_ACCOUNT_ID:$CF_ACCOUNT" \
                      "HANDS_TOKEN:$HANDS" "GH_DISPATCH_TOKEN:$DISPATCH"; do
            name=${pair%%:*}
            if [ -z "${pair#*:}" ]; then
              echo "::error::Секрет ${name} не задан. Деплой невозможен: задай его в Settings → Secrets → Actions."
              missing=1
            fi
          done
          exit $missing

      - name: Типы актуальны?
        # Имена секретов wrangler types читает из .dev.vars (значения не важны,
        # важны ключи) — иначе генерат молча теряет их и гвардия ложно падает.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -f .dev.vars ] || cp .dev.vars.example .dev.vars
          npx wrangler types
          if ! git diff --exit-code -- worker-configuration.d.ts; then
            git diff -- worker-configuration.d.ts | head -40
            echo "::error::worker-configuration.d.ts устарел: запусти 'npm run types' и закоммить."
            exit 1
          fi
        working-directory: cf-worker

      - name: Деплой
        run: npx wrangler deploy
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Воркер удалялся из CF вместе с его секретами. Переустанавливаем их при каждом
      # деплое идемпотентно: wrangler secret put обновляет существующее значение.
      # Значения — те же секреты репозитория, что использует канарейка и hands-job.
      - name: Секреты воркера
        working-directory: cf-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          GH_DISPATCH_TOKEN: ${{ secrets.GH_DISPATCH_TOKEN }}
        run: |
          printf '%s' "$HANDS_TOKEN" | npx wrangler secret put HANDS_TOKEN
          printf '%s' "$GH_DISPATCH_TOKEN" | npx wrangler secret put GH_DISPATCH_TOKEN

      # Канарейка на проде: вход в морду реальным браузером. Упала — деплой красный.
      - name: Канарейка UI на проде
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node scripts/canary-ui.mjs --url "${{ vars.HARNESS_URL }}" --token "$HANDS_TOKEN"
        working-directory: cf-worker
        env:
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
