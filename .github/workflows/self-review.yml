# Периодическая саморевизия конвейера (issue #1025,
# scripts/orchestra/self_review.py) — открытое исследование сырых данных
# ("что здесь не сходится?") плюс дешёвый второй проход по чек-листу уже
# оплаченных классов (config/self-review-checklist.json). Не замена
# реактивным детекторам (failure_watch/stall_detector/health_regression) —
# те ищут УЖЕ НАЗВАННЫЙ класс; этот механизм ищет то, у чего пока нет ни
# отпечатка, ни сигнатуры.
#
# Периодичность — раз в 6 часов (4 прогона/сутки), РЕЖЕ пульса оркестратора
# (каждые 15 мин, ~96/сутки) и дешевле ai-review (~50 дорогих прогонов/сутки,
# design.md «Периодичность»): окно данных (SELF_REVIEW_WINDOW_HOURS=72,
# scripts/orchestra/self_review.py) шире интервала — соседние прогоны
# перекрываются, пропуск одного прогона по инфраструктурной причине не
# теряет находку целиком.
#
# Трёхшаговый трест-контур — тот же приём, что ai-review.yml (ADR 0007):
# `gather` (доверенный, read-only) строит промпт из сырых данных; `investigate`
# (недоверенный, БЕЗ GitHub-токена) гоняет его через DSH транспортом
# scripts/review/ai_dsh.sh (переиспользован БЕЗ ИЗМЕНЕНИЙ — скрипт уже общий,
# ничего специфичного для PR-ревью внутри него нет); `apply` (доверенный,
# write) разбирает ответ по контракту находок и заводит задачи с
# дедупом/потолком/наблюдаемостью (scripts/orchestra/self_review.py::cmd_apply).
#
# Провайдер — тот же манифест использования, что у ai-review/worker/hands
# (config/provider-usage.json, consumer id "self-review" -> default-chain,
# scripts/lib/collect_provider_usage.py::CONSUMERS).
name: self-review

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      hours:
        description: "Окно сырых данных в часах (по умолчанию — SELF_REVIEW_WINDOW_HOURS в self_review.py)"
        required: false
        type: string

concurrency:
  group: self-review
  cancel-in-progress: false

jobs:
  gather:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      go: ${{ steps.quota.outputs.skip != 'true' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Тот же ранний гейт квоты, что у ai-review/orchestra (#454,
      # scripts/lib/rate_guard.py) — этот шаг сам по себе не дорогой (много
      # чтения: workflow runs х8, issues/events по всему репо, PR/issues
      # списком), но каскад к дорогому вызову модели ниже не должен
      # стартовать посреди чужого исчерпанного часового бюджета.
      - name: Квота GitHub API — ранняя проверка
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lib/rate_guard.py --job self-review

      # Транспортный отказ (403/сеть) здесь ФАТАЛЕН по построению
      # (self_review.GatherTransportError, см. докстринг модуля) — шаг падает
      # красным, а не молча пишет пустой дайджест: «отказ прав/транспорта
      # обязан краснить прогон, а не возвращать 0» (AGENTS.md).
      - name: Сбор сырых данных и промпт
        if: steps.quota.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AI_WORK="$RUNNER_TEMP/self-review"
          mkdir -p "$AI_WORK"
          HOURS="${{ github.event.inputs.hours }}"
          if [ -n "$HOURS" ]; then
            python scripts/orchestra/self_review.py gather --repo "$GITHUB_REPOSITORY" --hours "$HOURS" --out "$AI_WORK"
          else
            python scripts/orchestra/self_review.py gather --repo "$GITHUB_REPOSITORY" --out "$AI_WORK"
          fi

      - name: Промпт/дайджест — в артефакт для следующих job'ов
        if: steps.quota.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: self-review-prompt
          path: ${{ runner.temp }}/self-review
          retention-days: 3

  # ── НЕдоверенный job: НИКАКОГО GitHub-токена в env ──────────────────────────
  investigate:
    needs: gather
    if: needs.gather.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: self-review-prompt
          path: ${{ runner.temp }}/self-review

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Саморевизия агентом (DSH headless, без GitHub-токена)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ZAI_1_API_KEY: ${{ secrets.ZAI_1_API_KEY }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          DSH_PROVIDER_CHAIN: ${{ vars.DSH_PROVIDER_CHAIN }}
          DSH_PROVIDER_QUOTA_UNTIL: ${{ vars.DSH_PROVIDER_QUOTA_UNTIL }}
          DSH_TIMEOUT_SECS: "3600"
        run: |
          AI_WORK="$RUNNER_TEMP/self-review"
          export AI_WORK
          bash scripts/review/ai_dsh.sh

      - uses: actions/upload-artifact@v4
        with:
          name: self-review-answer
          path: |
            ${{ runner.temp }}/self-review/answer.txt
            ${{ runner.temp }}/self-review/digest.json
            ${{ runner.temp }}/self-review/dsh_rc.txt
            ${{ runner.temp }}/self-review/failure_reason.txt
          retention-days: 3

  # ── Доверенный job: контракт находок, дедуп, потолок, заведение задач ───────
  apply:
    needs: investigate
    if: always() && needs.investigate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v4
        with:
          name: self-review-answer
          path: ${{ runner.temp }}/self-review

      - name: "Контракт находок: фильтр факта + дедуп + потолок + задачи"
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          AI_WORK="$RUNNER_TEMP/self-review"
          python scripts/orchestra/self_review.py apply --repo "$GITHUB_REPOSITORY" \
            --answer "$AI_WORK/answer.txt" --digest "$AI_WORK/digest.json"
