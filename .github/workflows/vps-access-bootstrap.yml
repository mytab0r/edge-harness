# Одноразовый бутстрап SSH-доступа агента к VPS (167.99.134.201).
#
# Зачем: воркеры Hermes (контейнер hermes на сервере UroBorOS / домашний ПК)
# не имеют ключа к VPS — проверить образ в проде (`docker inspect autopilot`)
# без SSH нельзя. Канал доставки pubkey: этот job уже имеет SSH_DEPLOY_KEY
# (форс-командный ключ деплоя) и легитимно ходит на VPS по SSH.
#
# Что делает (идемпотентно):
#   1. добавляет PUBKEY (из input workflow_dispatch) в /root/.ssh/authorized_keys
#      — данные через stdin, удалённая команда статична: input'ы НЕ
#      интерполируются в root-shell (находка AI-ревью этого PR);
#   2. выполняет контрольную команду и печатает её вывод в лог.
#      check_cmd произволен ПО ЗАМЫСЛУ (диагностический канал для admin'ов
#      репо: github write-access и так даёт root через SSH_DEPLOY_KEY).
#
# Отзыв доступа: удалить строку с "kanban t_fafa14e5" из
# /root/.ssh/authorized_keys на VPS, или удалить этот workflow.
# Приватный ключ на VPS не попадает и в логи не печатается.
name: vps-access-bootstrap

on:
  workflow_dispatch:
    inputs:
      pubkey:
        description: "Открытый SSH-ключ агента (одна строка, ssh-ed25519 AAAA... comment)"
        required: true
        type: string
      check_cmd:
        description: "Контрольная команда на VPS после добавления ключа"
        required: false
        default: "docker ps --format '{{.Names}}' | head -20"

permissions: {}

concurrency:
  group: vps-access-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Append pubkey + run check
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          PUBKEY: ${{ inputs.pubkey }}
          CHECK_CMD: ${{ inputs.check_cmd }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          {
            echo 'Host vps'
            echo '  HostName 167.99.134.201'
            echo '  User root'
            echo '  IdentityFile ~/.ssh/id_deploy'
            echo '  IdentitiesOnly yes'
            echo '  StrictHostKeyChecking accept-new'
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # stdin у трубы один: pubkey кладём отдельным вызовом во временный
          # файл; идемпотентность и верификацию делаем уже по файлу
          # (grep -f - съел бы stdin до cat — находка AI-ревью round 2).
          printf '%s\n' "$PUBKEY" | ssh -F ~/.ssh/config vps 'cat > /tmp/agent_pubkey && wc -c /tmp/agent_pubkey'
          ssh -F ~/.ssh/config vps 'mkdir -p /root/.ssh && chmod 700 /root/.ssh && touch /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys && { grep -qxF -f /tmp/agent_pubkey /root/.ssh/authorized_keys || cat /tmp/agent_pubkey >> /root/.ssh/authorized_keys; }'
          # верификация установки: без ключа job красный, не надеемся на check_cmd
          ssh -F ~/.ssh/config vps 'grep -qxF -f /tmp/agent_pubkey /root/.ssh/authorized_keys && rm -f /tmp/agent_pubkey && echo KEY-INSTALLED'
          ssh -F ~/.ssh/config vps "$CHECK_CMD"
