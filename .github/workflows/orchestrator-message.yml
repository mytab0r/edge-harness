# Оркестратор сообщений владельца — читает chat-сообщение из DO, рассуждает,
# отвечает туда, откуда пришло сообщение (Telegram chat_id / сессия dsh-edge).
# Образец: ai-review.yml (gather -> DSH headless -> verdict), но без PR-контекста.
#
# Триггер: repository_dispatch (event_type harness-message) от DO на тике разбора
# после классификации kind='chat' (cf-worker/src/harness.ts::#processSingleMessage).
# Пульс orchestra.yml остаётся подстраховкой (design.md развилка 2).
name: orchestrator-message

on:
  repository_dispatch:
    types: [harness-message]

permissions:
  contents: read
  # actions:read не нужен — этот workflow не сверяет отпечатки и не ищет
  # параллельные прогоны; concurrency ниже — по message_id (каждое сообщение
  # независимо), и отменять прогон нельзя (cancel-in-progress: false).

concurrency:
  # Группа = message_id: два дубля dispatch'а одного сообщения (ретрай DO
  # после сетевой ошибки на самом dispatch'е) не создают двойной ответ;
  # разные сообщения не блокируют друг друга.
  group: orchestrator-message-${{ github.event.client_payload.message_id }}
  cancel-in-progress: false

jobs:
  process:
    # repository_dispatch всегда приходит от DO с валидным payload.
    if: github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    # 30 мин: DSH headless reasoning + запись результата + отправка ответа.
    # Job живёт до 6 часов (docs/research/21-github-actions.md) — запас большой.
    timeout-minutes: 30
    outputs:
      message_id: ${{ steps.facts.outputs.message_id }}
      chat_id: ${{ steps.facts.outputs.chat_id }}
      source: ${{ steps.facts.outputs.source }}
      result: ${{ steps.answer.outputs.result }}
      go: ${{ steps.fingerprint.outputs.go }}
    steps:
      # Доверенный чекаут main — скрипты исполняются с GH_TOKEN.
      - name: Чекаут main (для скриптов)
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      # Ранний отказ по квоте GITHUB_TOKEN вместо 403 посреди работы.
      - name: Квота GitHub API — ранняя проверка
        id: quota
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/lib/rate_guard.py --job orchestrator-message

      # Факты: читаем сообщение из DO, проверяем, что оно в статусе processing
      # и принадлежит этому джобу (CAS по processing_ts).
      - name: Факты сообщения (message_id, chat_id, text, claimed_ts)
        id: facts
        if: steps.quota.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          CLAIMED_TS: ${{ github.event.client_payload.claimed_ts }}
        run: |
          set -euo pipefail
          if [ -z "$HARNESS_URL" ] || [ -z "$HANDS_TOKEN" ]; then
            echo "::error::HARNESS_URL/HANDS_TOKEN не заданы — DO недоступен"
            exit 1
          fi
          # Читаем сообщение
          resp=$(curl -fsS --connect-timeout 10 --max-time 30 \
            -H "Authorization: Bearer $HANDS_TOKEN" \
            "$HARNESS_URL/api/messages/$MESSAGE_ID") || {
            echo "::error::не смог прочитать сообщение $MESSAGE_ID из DO"
            exit 1
          }
          status=$(printf '%s' "$resp" | jq -r '.message.status // "not_found"')
          if [ "$status" != "processing" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Сообщение $MESSAGE_ID не в processing (status=$status) — пропускаем, ватчдог или другая проходка уже заняла"
            exit 0
          fi
          # Проверяем CAS: processing_ts должен совпасть с claimed_ts из dispatch
          processing_ts=$(printf '%s' "$resp" | jq -r '.message.processing_ts // 0')
          if [ "$processing_ts" != "$CLAIMED_TS" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "CAS не совпал: processing_ts=$processing_ts, claimed_ts=$CLAIMED_TS — джоб потерял владение"
            exit 0
          fi
          text=$(printf '%s' "$resp" | jq -r '.message.text // ""')
          chat_id=$(printf '%s' "$resp" | jq -r '.message.chat_id // ""')
          source=$(printf '%s' "$resp" | jq -r '.message.source // ""')
          kind=$(printf '%s' "$resp" | jq -r '.message.kind // ""')
          if [ "$kind" != "chat" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Сообщение $MESSAGE_ID имеет kind=$kind, не chat — оркестратор не обрабатывает"
            exit 0
          fi
          if [ -z "$chat_id" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "Сообщение $MESSAGE_ID не имеет chat_id — некуда отвечать"
            exit 0
          fi
          {
            echo "message_id=$MESSAGE_ID"
            echo "chat_id=$chat_id"
            echo "source=$source"
            echo "text=$text"
            echo "go=true"
          } >> "$GITHUB_OUTPUT"
          echo "Сообщение $MESSAGE_ID (chat_id=$chat_id, source=$source) — обрабатываем"

      # Сверка владения: уже проверено в facts через CAS. Дополнительной
      # сверки отпечатка не нужно — это не PR-ревью, а одиночное сообщение.
      - name: Владение подтверждено (CAS в facts)
        id: fingerprint
        if: steps.facts.outputs.go == 'true'
        run: |
          echo "go=true" >> "$GITHUB_OUTPUT"

      # Сбор промпта для оркестратора: контекст из GitHub (issues/PR/labels)
      # + текст сообщения. DSH headless без git/PR — это не код-таск.
      - name: Сбор фактов и промпт (доверенный шаг)
        id: gather
        if: steps.fingerprint.outputs.go == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE_ID: ${{ steps.facts.outputs.message_id }}
          MESSAGE_TEXT: ${{ steps.facts.outputs.text }}
          CHAT_ID: ${{ steps.facts.outputs.chat_id }}
          SOURCE: ${{ steps.facts.outputs.source }}
        run: |
          AI_WORK="$RUNNER_TEMP/orchestrator-message"
          mkdir -p "$AI_WORK"
          python scripts/orchestra/orchestrator_message.py gather \
            --message-id "$MESSAGE_ID" \
            --text "$MESSAGE_TEXT" \
            --chat-id "$CHAT_ID" \
            --source "$SOURCE" \
            --out "$AI_WORK"

      # НЕдоверенный шаг: DSH headless reasoning (без GitHub-токена).
      # cwd = дерево репозитория (данные агента), транспорт — из main-чекаута.
      - name: Рассуждение оркестратора (DSH headless, без GitHub-токена)
        if: steps.gather.outputs.empty != 'true'
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_NIM_1_API_KEY: ${{ secrets.NVIDIA_NIM_1_API_KEY }}
          NVIDIA_NIM_2_API_KEY: ${{ secrets.NVIDIA_NIM_2_API_KEY }}
          OLLAMA_CLOUD_1_API_KEY: ${{ secrets.OLLAMA_CLOUD_1_API_KEY }}
          OLLAMA_CLOUD_2_API_KEY: ${{ secrets.OLLAMA_CLOUD_2_API_KEY }}
          OLLAMA_CLOUD_3_API_KEY: ${{ secrets.OLLAMA_CLOUD_3_API_KEY }}
          OPENROUTER_1_API_KEY: ${{ secrets.OPENROUTER_1_API_KEY }}
          OPENROUTER_2_API_KEY: ${{ secrets.OPENROUTER_2_API_KEY }}
          ZAI_1_API_KEY: ${{ secrets.ZAI_1_API_KEY }}
          DSH_PROVIDER_CHAIN: ${{ vars.DSH_PROVIDER_CHAIN }}
          DSH_PROVIDER_QUOTA_UNTIL: ${{ vars.DSH_PROVIDER_QUOTA_UNTIL }}
          DSH_TIMEOUT_SECS: "1800"
        run: |
          AI_WORK="$RUNNER_TEMP/orchestrator-message"
          export AI_WORK
          cd "$GITHUB_WORKSPACE"
          bash "$GITHUB_WORKSPACE/scripts/orchestra/orchestrator_dsh.sh"

      # Доверенный шаг: запись результата в DO через CAS (processing_ts),
      # затем отправка ответа в chat_id.
      - name: Запись результата и ответ (доверенный шаг)
        id: answer
        if: steps.gather.outputs.empty != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MESSAGE_ID: ${{ steps.facts.outputs.message_id }}
          CHAT_ID: ${{ steps.facts.outputs.chat_id }}
          CLAIMED_TS: ${{ github.event.client_payload.claimed_ts }}
          SOURCE: ${{ steps.facts.outputs.source }}
        run: |
          AI_WORK="$RUNNER_TEMP/orchestrator-message"
          python scripts/orchestra/orchestrator_message.py verdict \
            --message-id "$MESSAGE_ID" \
            --chat-id "$CHAT_ID" \
            --claimed-ts "$CLAIMED_TS" \
            --source "$SOURCE" \
            --answer "$AI_WORK/answer.txt" \
            --harness-url "$HARNESS_URL" \
            --hands-token "$HANDS_TOKEN" \
            --telegram-bot-token "$TELEGRAM_BOT_TOKEN" \
            --telegram-chat-id "$TELEGRAM_CHAT_ID"
