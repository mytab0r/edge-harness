# Форж плагинов dsh-edge: исходники плагина → релиз + PR в plugins.json
#
# Вход: ветка исходников плагина (относительно корня репо) — тремя путями:
#   - workflow_dispatch: путь и номер задачи руками (task_issue ОБЯЗАТЕЛЕН —
#     см. job prepare, #945/#661);
#   - push по plugins-src/**: состав и задача вычисляются механически из
#     diff'а пуша (см. job prepare);
#   - schedule (страховка): сравнение версии исходников с версией,
#     опубликованной в манифесте, ловит дрейф, который push не поймал —
#     см. комментарий у триггера ниже, класс тот же, что у deploy-dsh-edge.yml.
#     Найденный, но ничейный дрейф (задача закрыта/непригодна) ВАЛИТ prepare
#     громко: молча зелёный прогон здесь ровно в штатном случае крона прятал
#     бы зависший навсегда дрейф (находка ревью PR #952, п.2); тихо
#     пропускается только дедуп — уже есть открытый PR того же дрейфа.
#     Красный крон не висит без потребителя: plugin-forge.yml в
#     WATCHED_WORKFLOWS (pulse_guard.py::failure_watch) — ci-failure задача
#     с открытым владельцем заводится автоматически, газ замкнут.
# Выход: релиз plugins-<id>-v<version> с tarball и checksums, PR (из ветки
# agent/<task_issue>-forge-<id>-<ts> — контракт PR↔задача, #661) с обновлённым
# dsh-edge/plugins.json (sha256, версия). Вся сила — в чеклисте совместимости
# (design.md «Workers-совместимость») и интеграционном дыме.
#
# Форж не деплоит морду — деплой делает deploy-dsh-edge.yml после мержа PR
# (push по dsh-edge/** ИЛИ явный диспатч scheduler.py::after_merge — мерж
# через оркестратор не создаёт push-события, см. #945/#946).
name: plugin-forge

on:
  workflow_dispatch:
    inputs:
      plugin_path:
        description: "Путь к исходникам плагина (относительно корня репо, напр. plugins-src/my-plugin)"
        required: true
        type: string
      plugin_id:
        description: "ID плагина для манифеста (по умолчанию — имя каталога)"
        required: false
        type: string
      task_issue:
        description: "Номер issue-задачи — ОБЯЗАТЕЛЕН: ветка авто-PR agent/<task_issue>-forge-<id>-<ts> резолвится контрактом PR↔задача (#661) только по этому номеру, тело PR не читается."
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - "plugins-src/**"
  schedule:
    # Страховка (тот же паттерн, что deploy-dsh-edge.yml, «Страховка: догоняет
    # push, который не сработал»): весь путь оркестратора мержит PR под
    # GITHUB_TOKEN (`orchestra.yml`, шаг scheduler), а GITHUB_TOKEN-мержи НЕ
    # создают push-событие (защита GitHub от рекурсии — документировано
    # `scripts/orchestra/scheduler.py::dispatch_deploy_on_merge`, тот же факт
    # объясняет расхождение push-прогонов деплоя #560/#660). Значит push-
    # триггер выше НЕ сработает для подавляющего большинства слияний
    # plugins-src/** — этот крон сравнивает версию исходников с версией,
    # уже зашитой в dsh-edge/plugins.json, и форжит дрейф сам (job prepare,
    # ветка schedule). Полноценный фикс — явный диспатч в
    # scheduler.py::after_merge (по образцу dispatch_deploy_on_merge) —
    # заведён отдельной задачей (#946), scheduler.py вне территории этой
    # правки. Ограничение страховки, названное вслух (находка ревью PR
    # #952, п.2): дрейф резолвится в задачу, которую приёмка уже закрыла
    # (класс #320/#325), — prepare падает ГРОМКО, а не пропускает дрейф
    # молча-зелёным. Газ замкнут автоматикой: красный крон ловит
    # failure_watch (plugin-forge.yml в WATCHED_WORKFLOWS, pulse_guard.py) и
    # заводит ci-failure задачу — ОТКРЫТУЮ задачу-владельца дрейфа; взявший
    # её воркер делает ручной `gh workflow run plugin-forge -f task_issue=<
    # номер этой задачи>`. Решение класса «какая задача владеет дрейф-PR» —
    # #1009.
    - cron: "17 * * * *"

permissions:
  contents: write       # для создания релиза и PR
  pull-requests: write  # для scripts/git/pr-create и дедупа по открытым PR
  issues: read          # prepare сверяет пригодность task_issue (открыта,
                         # метка task) тем же контрактом, что contract_check.py
                         # (находка ревью PR #952, п.1) — без этого scope
                         # `gh api issues/N` вернул бы 403: непоименованный
                         # scope в явном permissions-блоке — none, не дефолт.
  # issues: write не нужен — статусы уходят по HTTP в журнал (POST /api/events,
  # scripts/plugins/plugin_status.sh), PR создаётся под GH_PIPELINE_PAT, к
  # GitHub Issues API/CLI на запись этот workflow не обращается (находка
  # AI-ревью PR #273).

jobs:
  # Единственное место, определяющее СОСТАВ форжа (какие плагины, с каким
  # task_issue) — не размазано по трём if-веткам job'а forge. Один плагин на
  # элемент include; forge запускается матрицей по этому списку (#945):
  # push/schedule могут дать больше одного плагина за раз (несколько
  # директорий изменились в одном пуше / дрейфуют одновременно).
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      matrix_len: ${{ steps.build.outputs.len }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Определить состав форжа (dispatch/push/schedule)
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN_PATH: ${{ inputs.plugin_path }}
          INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
          INPUT_TASK_ISSUE: ${{ inputs.task_issue }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Резолвер «коммит → номер задачи» — ЕДИНСТВЕННЫЙ путь push/schedule
          # определяют task_issue: PR, ассоциированный с коммитом (GitHub REST
          # «List pull requests associated with a commit»), его head.ref —
          # через тот же резолвер, что весь остальной репозиторий
          # (scripts/lib/task_ref.py::task_from_branch, решение владельца
          # 2026-09-06 — не второй regex рядом, тот же паттерн вызова, что
          # scripts/git/pr-create).
          resolve_task_issue_from_sha() {
            local sha="$1" context="$2" pulls branch task_issue
            pulls=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${sha}/pulls" -H "Accept: application/vnd.github+json") \
              || { echo "::error::${context}: GitHub не отдал PR, ассоциированные с коммитом $sha — не могу определить задачу-источник" >&2; return 1; }
            branch=$(jq -r '[.[] | select(.merged_at != null)] | sort_by(.merged_at) | last | .head.ref // empty' <<<"$pulls")
            [ -n "$branch" ] || branch=$(jq -r '.[0].head.ref // empty' <<<"$pulls")
            task_issue=""
            if [ -n "$branch" ]; then
              # Однострочный -c — не многострочный (класс «heredoc без YAML-
              # отступа обрывает run: |», AGENTS.md): любая строка python-кода
              # с отступом меньше блока YAML завершила бы block scalar раньше
              # времени и валила бы разбор всего workflow (PyYAML "while
              # scanning a simple key").
              task_issue=$(PYTHONPATH="$GITHUB_WORKSPACE/scripts/lib${PYTHONPATH:+:$PYTHONPATH}" python3 -c \
                'import sys, task_ref; n = task_ref.task_from_branch(sys.argv[1]); print(n if n is not None else "")' \
                "$branch")
            fi
            if [ -z "$task_issue" ]; then
              echo "::error::${context}: коммит $sha не резолвится в номер задачи (ветка «${branch:-<не найдена>}» не формы agent/<N>-slug) — авто-форж не откроет неслияемый PR (#661); форжи вручную с явным task_issue" >&2
              return 1
            fi
            printf '%s' "$task_issue"
          }

          # Пригодность задачи для авто-форжа push/schedule — тот же критерий,
          # что contract_check.py::task_eligibility_problems (issue открыта,
          # несёт метку `task`), плюс дедуп по уже открытому PR того же
          # дрейфа. Без этой проверки push/schedule открывал PR на задачу,
          # которую приёмка (`accept_merged_tasks`, 15-минутный цикл) успевает
          # закрыть, пока форж собирается (~20-60 минут) — такой PR навсегда
          # висит `contract:failed` (живой класс #320/#325), релиз идемпотентен
          # (clobber), а часовой крон плодил бы новый мёртвый PR каждый час
          # (находка ревью PR #952, п.1). Возвращает 1 (пропустить ТОЛЬКО этот
          # элемент состава, не весь prepare) — остальные плагины/дрейфы того
          # же прогона обрабатываются штатно; какой открытой задачей владеет
          # застрявший дрейф — отдельное решение владельца (беклог-задача из
          # ревью PR #952).
          SKIP_REASON=""
          task_issue_usable() {
            local task_issue="$1" context="$2" issue_json out count
            SKIP_REASON=""
            issue_json=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${task_issue}" -H "Accept: application/vnd.github+json") \
              || { SKIP_REASON="issue-unreadable"; echo "::error::${context}: не удалось прочитать issue #$task_issue — пригодность задачи не проверена" >&2; return 1; }
            # Одно место правды (находка ревью PR #952, раунд 3, п.2):
            # пригодность задачи считает contract_check.py::
            # task_eligibility_problems — ТА ЖЕ функция, которой контракт
            # красит PR (открыта, метка `task`, НЕ `blocked`). Ранняя
            # bash-копия здесь разошлась с источником при рождении (нога
            # `blocked` отсутствовала): задача с `blocked` проходила
            # pre-flight, жгла 20-60 минут сборки и открывала
            # contract:failed PR. Функция чистая (issue-JSON на stdin,
            # список проблем на stdout, первая строка — число проблем), тот
            # же однострочный `python3 -c` через PYTHONPATH, что и резолвер
            # task_ref выше; gh из python не вызывается — issues:read
            # хватает.
            out=$(printf '%s' "$issue_json" \
              | PYTHONPATH="$GITHUB_WORKSPACE/scripts/orchestra${PYTHONPATH:+:$PYTHONPATH}" python3 -c \
                'import sys, json, contract_check; ps = contract_check.task_eligibility_problems(json.load(sys.stdin), int(sys.argv[1])); print(len(ps)); [print("::error::пригодность задачи: " + p) for p in ps]' \
                "$task_issue")
            count=$(head -1 <<<"$out")
            if [ "$count" != "0" ]; then
              SKIP_REASON="task-ineligible"
              tail -n +2 <<<"$out" >&2
              echo "::error::${context}: задача #$task_issue непригодна по контракту (причины выше — contract_check.py::task_eligibility_problems, то же место правды, что красит PR)" >&2
              return 1
            fi
            return 0
          }

          # Разрешён ли АВТО-триггеру (push/schedule) форж этой задачи:
          # пригодность + дедуп по уже открытому PR форжа той же задачи —
          # иначе часовой крон плодит новый релиз каждый час, пока прежний
          # PR не слился (находка ревью PR #952, п.1). Сбой gh pr list —
          # НЕ «дублей нет» (находка ревью PR #952, чеклист): код возврата
          # разбирается явно; --limit 200 — дефолт gh (30) молча видел бы
          # только первые 30 открытых PR.
          auto_forge_allowed() {
            local task_issue="$1" context="$2" pr_heads
            task_issue_usable "$task_issue" "$context" || return 1
            pr_heads=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 --json headRefName -q '.[].headRefName') \
              || { SKIP_REASON="pr-list-failed"; echo "::error::${context}: gh pr list не отработал — дедуп по открытым форж-PR не выполнен" >&2; return 1; }
            if grep -q "^agent/${task_issue}-forge-" <<<"$pr_heads"; then
              SKIP_REASON="duplicate-pr"
              echo "::notice::${context}: уже есть открытый PR форжа для задачи #$task_issue (agent/${task_issue}-forge-*) — пропуск повтора, пока он не закрылся" >&2
              return 1
            fi
            return 0
          }

          items="[]"

          case "$EVENT_NAME" in
            workflow_dispatch)
              [ -n "$INPUT_PLUGIN_PATH" ] || { echo "::error::plugin_path обязателен"; exit 1; }
              [ -n "$INPUT_TASK_ISSUE" ] || { echo "::error::task_issue обязателен: без него авто-PR форжа откроется из ветки не по контракту PR↔задача и никогда не сольётся штатным циклом (#661)"; exit 1; }
              [[ "$INPUT_TASK_ISSUE" =~ ^[0-9]+$ ]] || { echo "::error::task_issue '$INPUT_TASK_ISSUE' должен быть числом (номер issue)"; exit 1; }
              # Pre-flight пригодности ДО сборки (находка ревью PR #952,
              # чеклист): ручной диспатч с закрытым/непригодным номером иначе
              # собирался бы 20-60 минут и открывал мёртвый contract:failed
              # PR — ровно тот расход, который правило «форж отказывает ДО
              # сборки» называет недопустимым. Дедуп здесь сознательно НЕ
              # проверяется: человек, назвавший задачу явно, может осознанно
              # форжить второй плагин под ту же задачу.
              task_issue_usable "$INPUT_TASK_ISSUE" "workflow_dispatch" || exit 1
              items=$(jq -n --arg p "$INPUT_PLUGIN_PATH" --arg id "$INPUT_PLUGIN_ID" --arg t "$INPUT_TASK_ISSUE" \
                '[{plugin_path:$p, plugin_id:$id, task_issue:$t}]')
              ;;

            push)
              if [ -z "$BEFORE_SHA" ] || [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
                echo "::error::github.event.before пуст или нулевой — не могу вычислить diff пуша, авто-форж не знает, какой плагин собирать"
                exit 1
              fi
              mapfile -t dirs < <(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA" -- 'plugins-src/**' \
                | awk -F/ '{print $1"/"$2}' | sort -u)
              if [ "${#dirs[@]}" -eq 0 ]; then
                echo "::error::push задел paths plugins-src/** (иначе job бы не запустился), но diff $BEFORE_SHA..$AFTER_SHA не нашёл ни одного каталога plugins-src/<имя> — несовпадение триггера и вычисления, чинить здесь"
                exit 1
              fi
              plugin_dirs=()
              for d in "${dirs[@]}"; do
                if [ ! -f "$d/package.json" ]; then
                  echo "::notice::$d изменён, но package.json нет — не плагин форжа (например, shared/), пропускаю"
                  continue
                fi
                plugin_dirs+=("$d")
              done
              if [ "${#plugin_dirs[@]}" -gt 0 ]; then
                # Один task_issue на весь пуш (все каталоги — из одного
                # коммита слияния) — пригодность проверяется РАЗ, не на
                # каждый каталог: результат одинаков для всех.
                task_issue=$(resolve_task_issue_from_sha "$AFTER_SHA" "push $AFTER_SHA") || exit 1
                # Скип НЕ молча: причина (непригодная задача / дедуп / сбой
                # gh) уходит в лог — «задача закрыта» на пушах, задержавшихся
                # дольше 15-минутного цикла приёмки, остаётся видимой, а
                # зависший из-за неё дрейф громко ловит schedule-страховка
                # (она на тот же отказ падает, не скипает).
                if auto_forge_allowed "$task_issue" "push $AFTER_SHA"; then
                  for d in "${plugin_dirs[@]}"; do
                    items=$(jq -c --arg p "$d" --arg t "$task_issue" '. + [{plugin_path:$p, plugin_id:"", task_issue:$t}]' <<<"$items")
                  done
                else
                  echo "::notice::push $AFTER_SHA: авто-форж пропущен (причина: ${SKIP_REASON}) — подробности в ::error/::notice выше" >&2
                fi
              fi
              ;;

            schedule)
              # Битый манифест не даёт молча-пустой матрицы (находка ревью
              # PR #952, чеклист): внутри `< <(jq …)` отказ jq не роняет шаг —
              # валидируем до цикла, громко.
              jq -e '.plugins | type == "array"' dsh-edge/plugins.json >/dev/null \
                || { echo "::error::dsh-edge/plugins.json не читается как {plugins:[...]} — дрейф-контроль крона слеп, чинить манифест"; exit 1; }
              while IFS=$'\t' read -r manifest_id manifest_pkg manifest_asset; do
                src_dir=""
                for d in plugins-src/*/; do
                  [ -f "${d}package.json" ] || continue
                  name=$(jq -r '.name' "${d}package.json")
                  [ "$name" = "$manifest_pkg" ] || continue
                  src_dir="${d%/}"
                  break
                done
                # Пакет манифеста без исходников в этом репозитории (иное
                # происхождение) — не забота этого крона, но не молча:
                # выпадение из дрейф-контроля видно в логе (находка ревью
                # PR #952, чеклист).
                if [ -z "$src_dir" ]; then
                  echo "::notice::schedule: пакет $manifest_pkg (id $manifest_id) есть в манифесте, но исходников plugins-src/ для него нет — вне дрейф-контроля" >&2
                  continue
                fi

                src_version=$(jq -r '.version' "$src_dir/package.json")
                # Версия зашита в имя asset'а (RELEASE_ASSET, шаг «Собрать
                # tarball» ниже: "<id>-<version>.tgz") — вырезаем regex'ом
                # версии (semver + необязательный суффикс), а не префиксом
                # id: legacy-записи манифеста (напр. hello-world-0.1.1.tgz
                # при id=hello) не всегда совпадают с текущим id.
                asset_version=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+[A-Za-z0-9.+-]*\.tgz$' <<<"$manifest_asset" | sed -E 's/\.tgz$//')
                # Пустая версия — «не смог распарсить», НЕ дрейф (находка
                # ревью PR #952, чеклист): иначе любой asset без semver
                # («» ≠ версия) форжился бы кроном каждый час вечно.
                if [ -z "$asset_version" ]; then
                  echo "::notice::schedule: $manifest_id — в имени asset '$manifest_asset' нет semver-версии, дрейф не констатирую" >&2
                  continue
                fi
                [ "$asset_version" != "$src_version" ] || continue

                # Направление дрейфа (находка ревью PR #952, чеклист): форжим
                # ТОЛЬКО дрейф «исходники новее манифеста». Манифест новее
                # исходников — сознательная правка/откат манифеста руками:
                # авто-PR, откатывающий её обратно, — не страховка, а порча.
                older=$(printf '%s\n%s\n' "$asset_version" "$src_version" | sort -V | head -1)
                if [ "$older" = "$src_version" ]; then
                  echo "::notice::schedule: $manifest_id — манифест (v$asset_version) новее исходников (v$src_version): сознательная правка манифеста, авто-откат не делаем" >&2
                  continue
                fi

                last_sha=$(git log -1 --format=%H -- "$src_dir/package.json")
                [ -n "$last_sha" ] || { echo "::error::дрейф найден ($src_dir: исходники v$src_version, манифест v$asset_version), но не нашёл коммит, менявший $src_dir/package.json — резолвить задачу не от чего"; exit 1; }
                task_issue=$(resolve_task_issue_from_sha "$last_sha" "schedule-дрейф $src_dir") || exit 1
                if ! auto_forge_allowed "$task_issue" "schedule-дрейф $src_dir"; then
                  # Дедуп — единственный тихий скип: работа уже идёт (открытый
                  # PR того же дрейфа), повтор не нужен. ЛЮБОЙ другой отказ —
                  # дрейф найден, но ничейный: валить prepare ГРОМКО. Молча
                  # зелёный прогон здесь ровно в штатном случае крона (задача
                  # закрыта приёмкой ~15 мин после мержа, сборка идёт 20-60
                  # минут) прятал бы зависший навсегда дрейф — находка ревью
                  # PR #952, п.2. Газ автоматический: этот красный крон ловит
                  # failure_watch (plugin-forge.yml в WATCHED_WORKFLOWS) и
                  # заводит ci-failure задачу — открытую задачу-владельца
                  # дрейфа; взявший её воркер делает ручной форж с явным
                  # task_issue этой задачи. Решение класса — #1009.
                  if [ "$SKIP_REASON" = "duplicate-pr" ]; then
                    continue
                  fi
                  echo "::error::schedule-дрейф $src_dir не форжится: дрейф есть ($src_dir исходники v$src_version, манифест v$asset_version), владельца нет (причина: ${SKIP_REASON}) — прогон валится громко; красный крон заведёт ci-failure задачу (WATCHED_WORKFLOWS), её номер и есть task_issue для ручного форжа (#1009 — решение класса)" >&2
                  exit 1
                fi
                items=$(jq -c --arg p "$src_dir" --arg t "$task_issue" '. + [{plugin_path:$p, plugin_id:"", task_issue:$t}]' <<<"$items")
                echo "Дрейф: $src_dir исходники v$src_version ≠ манифест v$asset_version (id $manifest_id) — форжу под задачу #$task_issue"
              done < <(jq -r '.plugins[] | [.id, .package, .source.asset] | @tsv' dsh-edge/plugins.json)
              # Новый плагин (исходники есть, записи в манифесте нет) цикл
              # выше не посещает вовсе — он идёт по МАНИФЕСТУ (находка ревью
              # PR #952, чеклист: «выпадает из дрейф-контроля молча»). Не
              # молча: честный notice. Форжить НОВЫЙ плагин автоматически
              # крон не может — у исходников нет резолвимой задачи-источника,
              # новый плагин = осознанный ручной форж с явным task_issue.
              for d in plugins-src/*/; do
                [ -f "${d}package.json" ] || continue
                pkg=$(jq -r '.name' "${d}package.json")
                jq -e --arg pkg "$pkg" '.plugins[] | select(.package == $pkg)' dsh-edge/plugins.json >/dev/null \
                  || echo "::notice::schedule: пакет $pkg ($d) есть в plugins-src, но его НЕТ в dsh-edge/plugins.json — крон его не форжит (новый плагин = ручной форж с осознанным task_issue)" >&2
              done
              ;;

            *)
              echo "::error::неизвестный event_name '$EVENT_NAME' — job prepare не умеет его разбирать"
              exit 1
              ;;
          esac

          matrix_json=$(jq -c -n --argjson inc "$items" '{include: $inc}')
          echo "matrix=$matrix_json" >> "$GITHUB_OUTPUT"
          echo "len=$(jq 'length' <<<"$items")" >> "$GITHUB_OUTPUT"
          echo "Состав форжа ($EVENT_NAME): $(jq -c . <<<"$items")"

  forge:
    needs: prepare
    if: needs.prepare.outputs.matrix_len != '0'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      # Ключ по plugin_path (не workflow-уровень, как раньше) — с job prepare
      # один запуск может дать НЕСКОЛЬКО плагинов одновременно (push/schedule
      # с несколькими элементами матрицы), их форжи не обязаны сериализоваться
      # друг с другом, а конкурирующие запуски ЗА ОДИН И ТОТ ЖЕ плагин
      # (dispatch поверх ещё идущего push-форжа того же плагина) — обязаны.
      group: ${{ github.workflow }}-${{ matrix.plugin_path }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: pnpm/setup@v2
        with:
          version: 11
          install: false

      - name: Валидация входа
        id: validate
        env:
          PLUGIN_PATH: ${{ matrix.plugin_path }}
          PLUGIN_ID_INPUT: ${{ matrix.plugin_id }}
          TASK_ISSUE_INPUT: ${{ matrix.task_issue }}
        run: |
          PLUGIN_PATH="${PLUGIN_PATH}"
          [ -d "$PLUGIN_PATH" ] || { echo "::error::Каталог плагина не найден: $PLUGIN_PATH"; exit 1; }
          [ -f "$PLUGIN_PATH/package.json" ] || { echo "::error::package.json не найден в $PLUGIN_PATH"; exit 1; }

          PLUGIN_NAME=$(jq -r '.name' "$PLUGIN_PATH/package.json")
          PLUGIN_VERSION=$(jq -r '.version' "$PLUGIN_PATH/package.json")
          [ "$PLUGIN_NAME" != "null" ] && [ -n "$PLUGIN_NAME" ] || { echo "::error::package.json: name обязателен"; exit 1; }
          [ "$PLUGIN_VERSION" != "null" ] && [ -n "$PLUGIN_VERSION" ] || { echo "::error::package.json: version обязателен"; exit 1; }

          # ID плагина: из ввода или из имени каталога
          if [ -n "$PLUGIN_ID_INPUT" ]; then
            PLUGIN_ID="$PLUGIN_ID_INPUT"
          else
            PLUGIN_ID=$(basename "$PLUGIN_PATH")
          fi
          # Проверка формата ID — паттерн ЧИТАЕТСЯ из manifest.mjs
          # (ID_PATTERN_SOURCE), а не копируется строкой: manifest.mjs
          # объявляет ID_BODY_SOURCE единственным местом правды с явным
          # запретом копий, вторая копия регэкспа здесь расходилась бы
          # молча при правке паттерна там (находка AI-ревью PR #273).
          ID_PATTERN_SOURCE=$(node -e "import('./dsh-edge/manifest.mjs').then(m => process.stdout.write(m.ID_PATTERN_SOURCE))") \
            || { echo "::error::не удалось прочитать ID_PATTERN_SOURCE из dsh-edge/manifest.mjs"; exit 1; }
          [[ "$PLUGIN_ID" =~ ^($ID_PATTERN_SOURCE)$ ]] || { echo "::error::plugin_id '$PLUGIN_ID' не соответствует паттерну ^$ID_PATTERN_SOURCE\$"; exit 1; }

          # Номер задачи для ветки и тела авто-PR — обязателен (#945/#661):
          # job prepare уже гарантирует непустое числовое значение для ЛЮБОГО
          # триггера (dispatch/push/schedule), но форж проверяет это ЕЩЁ РАЗ
          # здесь же — «форж обязан отказать громко, а не открыть неслияемый
          # PR» держится в двух местах, не в одном, ровно на случай будущей
          # правки job'а prepare, которая по ошибке пропустит пустое значение.
          [ -n "$TASK_ISSUE_INPUT" ] || { echo "::error::task_issue не передан — форж не откроет неслияемый PR (контракт PR↔задача резолвит номер только из ветки agent/<N>-*, #661)"; exit 1; }
          [[ "$TASK_ISSUE_INPUT" =~ ^[0-9]+$ ]] || { echo "::error::task_issue '$TASK_ISSUE_INPUT' должен быть числом (номер issue)"; exit 1; }

          # Сверка с манифестом: basename каталога — только дефолт, а пакет
          # может уже быть установлен под ДРУГИМ id (канонический
          # plugins-src/hello-world → package @edge-harness/dsh-plugin-hello,
          # в dsh-edge/plugins.json id "hello"). Без сверки форж заводит
          # фантомную вторую установку того же пакета вместо бампа
          # существующей записи — весь апсерт-путь остаётся мёртвым кодом
          # (находка AI-ревью PR #273, воспроизведена на каноническом
          # прогоне: смоук строил состав из пяти плагинов вместо четырёх).
          # Пакет уже известен манифесту под другим id — берём id манифеста, а
          # не красим прогон: явный ввод остаётся способом завести НОВЫЙ id,
          # а бамп существующего пакета без --plugin_id обязан находить
          # свою историческую запись сам (находка AI-ревью PR #273: критерий
          # готовности #268 требует зелёного прогона без явного plugin_id
          # именно на историческом пакете hello-world/id=hello).
          MANIFEST_ID=$(jq -r --arg pkg "$PLUGIN_NAME" '.plugins[] | select(.package == $pkg) | .id' dsh-edge/plugins.json)
          if [ -n "$MANIFEST_ID" ] && [ "$MANIFEST_ID" != "$PLUGIN_ID" ]; then
            echo "Пакет $PLUGIN_NAME уже в манифесте под id '$MANIFEST_ID' (вычислен был '$PLUGIN_ID') — беру id манифеста"
            PLUGIN_ID="$MANIFEST_ID"
          fi

          # Зеркальный случай: явный (или вычисленный) plugin_id уже занят в
          # манифесте ЧУЖИМ пакетом. Без этой проверки апсерт в шаге «Подготовить
          # PR» молча перепишет чужую запись — id, package и sha256 — вместо
          # того, чтобы завести новую (находка AI-ревью PR #273: проверка выше
          # ловит совпадение по package в одну сторону, но не по id в другую).
          MANIFEST_PACKAGE=$(jq -r --arg id "$PLUGIN_ID" '.plugins[] | select(.id == $id) | .package' dsh-edge/plugins.json)
          if [ -n "$MANIFEST_PACKAGE" ] && [ "$MANIFEST_PACKAGE" != "$PLUGIN_NAME" ]; then
            echo "::error::id '$PLUGIN_ID' уже в манифесте под пакетом '$MANIFEST_PACKAGE', а вычислен пакет '$PLUGIN_NAME' — id занят другим плагином, укажите свой plugin_id"
            exit 1
          fi

          # server существующей записи манифеста (для дыма, см. FORGE_EXTRA_PLUGIN
          # ниже): бамп client-only плагина (server:false, напр. plugin-manager)
          # не должен внезапно валидировать серверную композицию, которую
          # PR-шаг потом не опубликует (находка AI-ревью PR #273). Пусто —
          # значит пакета в манифесте ещё нет (новый плагин); дефолт true —
          # известное ограничение, см. комментарий у FORGE_EXTRA_PLUGIN.
          MANIFEST_SERVER=$(jq -r --arg pkg "$PLUGIN_NAME" '.plugins[] | select(.package == $pkg) | .server' dsh-edge/plugins.json)
          [ -n "$MANIFEST_SERVER" ] || MANIFEST_SERVER=true

          # Определяем, есть ли клиентская часть
          CLIENT=$(jq -r '.dsh.client.platform // ""' "$PLUGIN_PATH/package.json")
          [ "$CLIENT" = "web" ] && HAS_CLIENT=true || HAS_CLIENT=false

          echo "plugin_name=$PLUGIN_NAME" >> "$GITHUB_OUTPUT"
          echo "plugin_version=$PLUGIN_VERSION" >> "$GITHUB_OUTPUT"
          echo "plugin_id=$PLUGIN_ID" >> "$GITHUB_OUTPUT"
          echo "plugin_server=$MANIFEST_SERVER" >> "$GITHUB_OUTPUT"
          echo "has_client=$HAS_CLIENT" >> "$GITHUB_OUTPUT"
          echo "plugin_path=$PLUGIN_PATH" >> "$GITHUB_OUTPUT"
          echo "task_issue=$TASK_ISSUE_INPUT" >> "$GITHUB_OUTPUT"

          echo "Плагин: $PLUGIN_NAME v$PLUGIN_VERSION (id: $PLUGIN_ID, client: $HAS_CLIENT, задача: #$TASK_ISSUE_INPUT)"

      - name: plugin_status → building
        if: env.HARNESS_URL != '' && env.HANDS_TOKEN != ''
        continue-on-error: true
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          PLUGIN_ID: ${{ steps.validate.outputs.plugin_id }}
          STATE: building
          SOURCE: forge
        run: |
          PLUGIN_ID="$PLUGIN_ID" STATE=building SOURCE=forge bash scripts/plugins/plugin_status.sh

      # ── 1. Чеклист совместимости (design.md «Workers-совместимость») ──────────────
      - name: Проверка совместимости с Workers Free
        id: compat
        run: |
          node dsh-edge/check-plugin-compat.mjs "${{ steps.validate.outputs.plugin_path }}" \
            ${{ steps.validate.outputs.has_client == 'true' && '--client' || '' }}

      # ── 2. Сборка tarball ────────────────────────────────────────────────────────
      - name: Собрать клиентский бандл (если есть build.mjs)
        id: build-client
        working-directory: ${{ steps.validate.outputs.plugin_path }}
        run: |
          if [ -f "build.mjs" ]; then
            echo "Обнаружен build.mjs — собираем клиентский бандл"
            node build.mjs
          else
            echo "build.mjs не найден — пропускаем сборку клиента"
          fi

      - name: Собрать tarball (npm pack)
        id: pack
        working-directory: ${{ steps.validate.outputs.plugin_path }}
        env:
          NPM_CONFIG_CACHE: /tmp/npm-cache
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          npm pack --cache /tmp/npm-cache --pack-destination "$GITHUB_WORKSPACE/artifacts" --loglevel=error >/dev/null
          TARBALL=$(ls "$GITHUB_WORKSPACE/artifacts"/*.tgz | head -1)
          SHA256=$(sha256sum "$TARBALL" | cut -d' ' -f1)
          ASSET_NAME=$(basename "$TARBALL")
          # Имя asset'а для релиза: <id>-<version>.tgz — от plugin_id, не от
          # basename пакета (hello-world — ровно тот случай, где name пакета
          # ≠ id манифеста, находка AI-ревью PR #273).
          RELEASE_ASSET="${{ steps.validate.outputs.plugin_id }}-${{ steps.validate.outputs.plugin_version }}.tgz"
          cp "$TARBALL" "$GITHUB_WORKSPACE/artifacts/$RELEASE_ASSET"
          SHA256_RELEASE=$(sha256sum "$GITHUB_WORKSPACE/artifacts/$RELEASE_ASSET" | cut -d' ' -f1)
          [ "$SHA256" = "$SHA256_RELEASE" ] || { echo "::error::sha256 не сошёлся после копирования"; exit 1; }

          echo "tarball=$TARBALL" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "asset=$RELEASE_ASSET" >> "$GITHUB_OUTPUT"
          echo "Тарболл: $ASSET_NAME → $RELEASE_ASSET (sha256: $SHA256)"

      - name: plugin_status → built
        if: env.HARNESS_URL != '' && env.HANDS_TOKEN != ''
        continue-on-error: true
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          PLUGIN_ID: ${{ steps.validate.outputs.plugin_id }}
          STATE: built
          SOURCE: forge
          DETAIL: "tarball ${{ steps.pack.outputs.asset }}, sha256 ${{ steps.pack.outputs.sha256 }}"
        run: |
          PLUGIN_ID="$PLUGIN_ID" STATE=built SOURCE=forge DETAIL="$DETAIL" bash scripts/plugins/plugin_status.sh

      # ── 3. Интеграционный дым: локальная сборка клона с плагином ─────────────────
      - name: Интеграционный дым (локальная сборка с плагином)
        id: smoke
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_TARBALL: ${{ steps.pack.outputs.tarball }}
          PLUGIN_ID: ${{ steps.validate.outputs.plugin_id }}
          PLUGIN_PACKAGE: ${{ steps.validate.outputs.plugin_name }}
          # dsh-edge/plugins.json на этом шаге ещё не обновлён (PR с манифестом
          # создаётся позже, см. шаг «Подготовить PR с обновлением манифеста») —
          # без FORGE_EXTRA_PLUGIN кодогенерация и гвардия состава проверяли бы
          # только старый состав, а новый плагин нигде бы не верифицировался.
          # server — из существующей записи манифеста (steps.validate.outputs.
          # plugin_server), НЕ безусловный true: PR-шаг ниже сохраняет текущий
          # .server при бампе (не переворачивает его на true), так что дым
          # обязан валидировать ту же композицию, которую PR-шаг реально
          # опубликует (находка AI-ревью PR #273 — было рассинхронизировано).
          # true остаётся дефолтом ТОЛЬКО для генуинно нового плагина (записи
          # в манифесте ещё нет) — известное ограничение форжа (design.md):
          # client-only плагин, форжащийся впервые, всё равно провалидируется
          # как серверный.
          FORGE_EXTRA_PLUGIN: >-
            {"id":"${{ steps.validate.outputs.plugin_id }}",
            "package":"${{ steps.validate.outputs.plugin_name }}",
            "server":${{ steps.validate.outputs.plugin_server }},
            "client":${{ steps.validate.outputs.has_client }}}
        run: |
          # Клонируем апстрим на пине, применяем патчи, ставим плагин, кодогеним,
          # билдим, прогоняем smoke-edge-plugins и verify — полный конвейер сборки.
          # Читаем манифест АБСОЛЮТНЫМ путём и без подавления stderr: без
          # фоллбэков — если manifest.mjs упадёт (битый манифест, нет
          # upstream.json) или вернёт пустые upstream.repo/sha, job обязан
          # провалиться здесь и громко, а не молча подставить дефолт и
          # собрать плагин против не того апстрима (silent-wrong — находка
          # AI-ревью PR #162). Заодно чинит соседний баг: относительный путь
          # "dsh-edge/manifest.mjs" резолвился от $GITHUB_WORKSPACE/forge-clone
          # (мы туда уже cd'нулись) — файла там нет, вызов падал всегда, и
          # 2>/dev/null маскировал именно это, а не что-то редкое.
          MANIFEST_JSON=$(node "$GITHUB_WORKSPACE/dsh-edge/manifest.mjs") \
            || { echo "::error::dsh-edge/manifest.mjs не прочитался — не удалось получить upstream.json"; exit 1; }
          UPSTREAM=$(jq -r '.upstream.repo' <<<"$MANIFEST_JSON")
          SHA=$(jq -r '.upstream.sha' <<<"$MANIFEST_JSON")
          [ -n "$UPSTREAM" ] && [ "$UPSTREAM" != "null" ] || { echo "::error::upstream.repo пуст в манифесте"; exit 1; }
          [ -n "$SHA" ] && [ "$SHA" != "null" ] || { echo "::error::upstream.sha пуст в манифесте"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/forge-clone" && cd "$GITHUB_WORKSPACE/forge-clone"
          git init -q
          git remote add origin "https://github.com/$UPSTREAM.git"
          git fetch -q --depth 1 origin "$SHA"
          git checkout -q FETCH_HEAD

          # Патчи. Гвардия на пустую серию — то же место правды о поведении,
          # что и deploy-dsh-edge.yml, шаг «Патч-серия»: без неё опустевшая
          # серия молча даёт tarball, собранный и опубликованный против
          # непатченного апстрима (находка AI-ревью PR #273).
          shopt -s nullglob
          patches=("$GITHUB_WORKSPACE/dsh-edge/patches"/*.patch)
          [ ${#patches[@]} -gt 0 ] || { echo "::error::Патч-серия пуста, а манифест требует source-build"; exit 1; }
          for p in "${patches[@]}"; do
            git apply --whitespace=nowarn "$p" || { echo "::error::Патч не применился: $p"; exit 1; }
          done

          # Зависимости standalone
          pnpm --dir apps/dsh-edge/standalone install --frozen-lockfile

          # Остальные плагины манифеста (кроме бампимого — для него уже есть
          # свежий tarball из шага «Собрать tarball»). Кодогенерация эмитит
          # импорты под ВЕСЬ состав манифеста, а @edge-harness/* пакеты нигде
          # не публикуются в npm-registry и патчами не ставятся — без них
          # smoke-edge-plugins.mjs красится ERR_MODULE_NOT_FOUND на любом
          # плагине всегда, а не на реальной проблеме (находка AI-ревью PR
          # #273). Тот же паттерн скачивания и сверки sha256, что и
          # deploy-dsh-edge.yml, шаг «Скачать плагины и сверить sha256».
          mkdir -p "$GITHUB_WORKSPACE/other-plugins-tgz"
          jq -r --arg id "$PLUGIN_ID" \
            '.plugins[] | select(.id != $id) | [.id, .source.release, .source.asset, .source.sha256] | @tsv' \
            "$GITHUB_WORKSPACE/dsh-edge/plugins.json" > "$GITHUB_WORKSPACE/other-plugins.tsv"
          : > "$GITHUB_WORKSPACE/other-checksums.txt"
          OTHER_TGZ=()
          while IFS=$'\t' read -r other_id other_release other_asset other_sha; do
            echo "плагин манифеста $other_id: релиз $other_release, asset $other_asset"
            gh release download "$other_release" --repo "$GITHUB_REPOSITORY" \
              --dir "$GITHUB_WORKSPACE/other-plugins-tgz" --pattern "$other_asset" --clobber \
              || { echo "::error::Релиз $other_release недоступен — манифест ссылается на несуществующий источник (плагин $other_id)"; exit 1; }
            [ -f "$GITHUB_WORKSPACE/other-plugins-tgz/$other_asset" ] || { echo "::error::В релизе $other_release нет asset'а $other_asset (плагин $other_id)"; exit 1; }
            echo "$other_sha  $GITHUB_WORKSPACE/other-plugins-tgz/$other_asset" >> "$GITHUB_WORKSPACE/other-checksums.txt"
            OTHER_TGZ+=("$GITHUB_WORKSPACE/other-plugins-tgz/$other_asset")
          done < "$GITHUB_WORKSPACE/other-plugins.tsv"
          [ ! -s "$GITHUB_WORKSPACE/other-checksums.txt" ] || sha256sum -c "$GITHUB_WORKSPACE/other-checksums.txt" \
            || { echo "::error::sha256 остальных плагинов манифеста не сошёлся"; exit 1; }

          # Добавляем плагин: свежий tarball + весь остальной состав манифеста разом
          pnpm --dir apps/dsh-edge/standalone add --save-exact "${OTHER_TGZ[@]}" "$PLUGIN_TARBALL"
          # pnpm-патчи Workers обязательны; add обязан сохранить patchedDependencies
          # (класс silent-wrong #43, та же гвардия, что deploy-dsh-edge.yml —
          # без неё дым проходит зелёным на уже запатченных node_modules от
          # --frozen-lockfile, пока прод соберёт другой состав).
          grep -q "patchedDependencies" apps/dsh-edge/standalone/pnpm-workspace.yaml || { echo "::error::pnpm add потерял patchedDependencies — план Б из design.md"; exit 1; }

          # Кодогенерация
          node "$GITHUB_WORKSPACE/dsh-edge/codegen-edge-plugins.mjs" "$GITHUB_WORKSPACE/forge-clone"

          # Дым инсталла (cordis + ToolRuntime)
          node "$GITHUB_WORKSPACE/dsh-edge/smoke-edge-plugins.mjs" "$GITHUB_WORKSPACE/forge-clone"

          # Сборка
          pnpm --dir apps/dsh-edge/standalone run build

          # Гвардия gzip-бюджета direct-воркера (design.md «Workers-совместимость»,
          # «Размер») — ДЕШЁВЫЙ прокси на уже собранном артефакте: gzip всего
          # direct-воркера (с новым плагином внутри, т.к. кодогенерация выше
          # уже включила его через FORGE_EXTRA_PLUGIN) против общего бюджета.
          # Не точный вклад одного плагина, а верхняя граница на весь бандл —
          # без гейта плагины ехали бы без проверки размера вовсе, а не с
          # приблизительной (находка AI-ревью PR #273). Точный замер вклада —
          # отдельная работа (design.md, tasks.md §3).
          #
          # Порог — НЕ своя константа: `bundle-standalone.mjs` (только что
          # отработавший в `pnpm run build` выше) уже гвардирует тот же
          # DIRECT_GZIP_BUDGET_BYTES сам (design.md «Факты-основания» п.1) —
          # вторая копия числа здесь разошлась бы молча, если апстрим подвинет
          # бюджет (находка AI-ревью PR #273). Читаем константу из уже
          # склонированного и запатченного файла на диске, а не дублируем.
          BUNDLE_BUDGET_SRC="apps/dsh-edge/standalone/scripts/bundle-standalone.mjs"
          [ -f "$BUNDLE_BUDGET_SRC" ] || { echo "::error::$BUNDLE_BUDGET_SRC не найден — гвардия бюджета не может прочитать порог"; exit 1; }
          # (?=;|$) — не только «;»: апстрим 0.11.1 объявляет константу без
          # завершающей точки с запятой (`const X = 900 * 1024` + перенос
          # строки, ASI), а прежний паттерн требовал «;» строго — гвардия
          # слепла на КАЖДОМ прогоне форжа после бампа пина #505, хотя число
          # читалось прежним способом на 0.8.0. Дальше по коду тот же exit 1,
          # если апстрим когда-нибудь уберёт константу вовсе — это не снято.
          BUNDLE_BUDGET_EXPR=$(grep -oP 'DIRECT_GZIP_BUDGET_BYTES\s*=\s*\K[0-9 *_]+(?=;|$)' "$BUNDLE_BUDGET_SRC" | head -1)
          [ -n "$BUNDLE_BUDGET_EXPR" ] || { echo "::error::не удалось прочитать DIRECT_GZIP_BUDGET_BYTES из $BUNDLE_BUDGET_SRC — апстрим переименовал/убрал константу, гвардия слепа"; exit 1; }
          BUNDLE_BUDGET_BYTES=$(( BUNDLE_BUDGET_EXPR ))
          DIRECT_WORKER="apps/dsh-edge/standalone/worker/direct/index.js"
          [ -f "$DIRECT_WORKER" ] || { echo "::error::direct-воркер не собран: $DIRECT_WORKER"; exit 1; }
          BUNDLE_GZIP_BYTES=$(gzip -c "$DIRECT_WORKER" | wc -c)
          echo "gzip direct-воркера: $BUNDLE_GZIP_BYTES / $BUNDLE_BUDGET_BYTES байт (прокси, не точный вклад плагина)"
          [ "$BUNDLE_GZIP_BYTES" -le "$BUNDLE_BUDGET_BYTES" ] || { echo "::error::gzip-бюджет direct-воркера превышен: $BUNDLE_GZIP_BYTES > $BUNDLE_BUDGET_BYTES байт (design.md «Размер»)"; exit 1; }

          # Гвардия состава
          node "$GITHUB_WORKSPACE/dsh-edge/verify-edge-plugins.mjs" "$GITHUB_WORKSPACE/forge-clone"

          # Контракт и детерминизм
          pnpm --dir apps/dsh-edge/standalone run verify

          echo "smoke=passed" >> "$GITHUB_OUTPUT"

      # ── 4. Релиз ─────────────────────────────────────────────────────────────────
      - name: Создать/обновить релиз plugins-<id>-v<version>
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_NAME: ${{ steps.validate.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ steps.validate.outputs.plugin_version }}
          PLUGIN_ID: ${{ steps.validate.outputs.plugin_id }}
          ASSET: ${{ steps.pack.outputs.asset }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
        run: |
          RELEASE_TAG="plugins-${PLUGIN_ID}-v${PLUGIN_VERSION}"
          RELEASE_TITLE="${PLUGIN_NAME}: ${PLUGIN_ID} v${PLUGIN_VERSION}"

          # Проверяем, существует ли релиз
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Релиз $RELEASE_TAG уже существует — обновляем asset"
            gh release delete-asset "$RELEASE_TAG" "$ASSET" --yes || true
            gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/artifacts/$ASSET" --clobber
          else
            echo "Создаём релиз $RELEASE_TAG"
            gh release create "$RELEASE_TAG" "$GITHUB_WORKSPACE/artifacts/$ASSET" \
              --title "$RELEASE_TITLE" --notes "Автоматический релиз из plugin-forge (${GITHUB_RUN_ID})"
          fi

          # Публикуем checksums как отдельный asset. Без `|| true`: упавшая
          # заливка молча давала бы зелёный job и релиз без checksums, хотя
          # задача требует релиз «с checksums» (находка AI-ревью PR #273) —
          # tarball строкой выше уже заливается без маскировки, здесь то же.
          echo "$SHA256  $ASSET" > "$GITHUB_WORKSPACE/artifacts/${ASSET}.sha256"
          gh release upload "$RELEASE_TAG" "$GITHUB_WORKSPACE/artifacts/${ASSET}.sha256" --clobber

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      # ── 5. PR с обновлением plugins.json ────────────────────────────────────────
      - name: Подготовить PR с обновлением манифеста
        id: pr
        env:
          # GITHUB_TOKEN-пуши/PR не зажигают другие workflows (защита GitHub от
          # рекурсии) — этот PR должен пройти test/CodeQL/review/contract, как
          # любой другой, поэтому широкий PAT конвейера (тот же класс операций,
          # что в orchestra.yml/deploy-dsh-edge.yml), а не github.token.
          GH_TOKEN: ${{ secrets.GH_PIPELINE_PAT }}
          PLUGIN_ID: ${{ steps.validate.outputs.plugin_id }}
          PLUGIN_PACKAGE: ${{ steps.validate.outputs.plugin_name }}
          PLUGIN_VERSION: ${{ steps.validate.outputs.plugin_version }}
          RELEASE_TAG: ${{ steps.release.outputs.release_tag }}
          ASSET: ${{ steps.pack.outputs.asset }}
          SHA256: ${{ steps.pack.outputs.sha256 }}
          HAS_CLIENT: ${{ steps.validate.outputs.has_client }}
          TASK_ISSUE: ${{ steps.validate.outputs.task_issue }}
        run: |
          # GH_TOKEN авторизует только `gh`-вызовы; голому `git push` нужен
          # credential helper — `gh auth setup-git` (тот же паттерн, что в
          # worker.yml: без него push идёт анонимно и падает 403).
          token="$GH_TOKEN"
          unset GH_TOKEN
          printf '%s' "$token" | gh auth login --with-token
          unset token
          gh auth setup-git

          # Ветка — agent/<task_issue>-forge-<id>-<ts>, НЕ forge/<id>-v<version>-<ts>
          # (#661/#945): контракт «PR↔задача» (scripts/lib/task_ref.py::
          # task_from_branch, решение владельца 2026-09-06) резолвит номер
          # ТОЛЬКО из имени ветки формы agent/<N>-slug — без этого PR получал
          # contract:failed и не сливался никогда (живые эпизоды: runner-bridge
          # #658 CLOSED, plugin-manager #556/#558 CLOSED). TASK_ISSUE к этому
          # моменту уже гарантированно непустой (шаг «Валидация входа» выше).
          BRANCH="agent/${TASK_ISSUE}-forge-${PLUGIN_ID}-$(date -u +%Y%m%dT%H%M%S)"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Между чекаутом в начале job'а и этим шагом лежат чеклист/сборка/
          # дым — 10-20 минут; concurrency-группа задана по plugin_path, т.е.
          # другие плагины форжатся ОДНОВРЕМЕННО и могут за это время смержить
          # свою правку dsh-edge/plugins.json в main. Ветка обязана расти от
          # СВЕЖЕГО main, а не от того, что видел actions/checkout на старте
          # job'а: иначе jq ниже пересериализует устаревший манифест в
          # идентичном формате, git не увидит конфликта при пуше — и авто-PR
          # молча откатит чужую запись (находка AI-ревью PR #273).
          git fetch origin main
          git switch -c "$BRANCH" origin/main

          # Обе сверки занятости из шага «Валидация входа» — ЗАНОВО, по
          # только что политянутому манифесту, а не по тому, что читался в
          # начале job'а: за время чеклиста/сборки/дыма манифест мог
          # измениться так, что прежний вывод validate больше не верен (тот
          # же пакет успел появиться под другим id, или id занят другим
          # пакетом). Совпало — бампаем ниже штатно; разошлось — падаем
          # громко с внятным сообщением, а не молча переписываем чужую
          # запись (тот же класс проверки, что и первичная сверка).
          FRESH_MANIFEST_ID=$(jq -r --arg pkg "$PLUGIN_PACKAGE" '.plugins[] | select(.package == $pkg) | .id' dsh-edge/plugins.json)
          if [ -n "$FRESH_MANIFEST_ID" ] && [ "$FRESH_MANIFEST_ID" != "$PLUGIN_ID" ]; then
            echo "::error::Манифест изменился, пока форж собирался: пакет $PLUGIN_PACKAGE теперь в манифесте под id '$FRESH_MANIFEST_ID', а форж вычислил id '$PLUGIN_ID' — перезапустите форж с plugin_id=$FRESH_MANIFEST_ID"
            exit 1
          fi
          FRESH_MANIFEST_PACKAGE=$(jq -r --arg id "$PLUGIN_ID" '.plugins[] | select(.id == $id) | .package' dsh-edge/plugins.json)
          if [ -n "$FRESH_MANIFEST_PACKAGE" ] && [ "$FRESH_MANIFEST_PACKAGE" != "$PLUGIN_PACKAGE" ]; then
            echo "::error::Манифест изменился, пока форж собирался: id '$PLUGIN_ID' теперь занят пакетом '$FRESH_MANIFEST_PACKAGE', а форж собирал пакет '$PLUGIN_PACKAGE' — запустите форж заново с другим plugin_id"
            exit 1
          fi

          # Читаем текущий манифест (уже свежий — из git fetch выше)
          MANIFEST=$(cat dsh-edge/plugins.json)

          # Проверяем, есть ли уже плагин с таким id
          EXISTS=$(jq --arg id "$PLUGIN_ID" '.plugins[] | select(.id == $id)' <<<"$MANIFEST")
          if [ -n "$EXISTS" ]; then
            # Обновляем существующую запись. server НЕ переписывается на true
            # безусловно: для client-only плагина (напр. plugin-manager,
            # server:false) бамп через форж иначе тихо сделал бы его
            # серверным (находка AI-ревью PR #273) — .server внутри update-
            # фильтра ссылается на текущее значение поля этой же записи.
            MANIFEST=$(jq --arg id "$PLUGIN_ID" \
              --arg pkg "$PLUGIN_PACKAGE" \
              --arg release "$RELEASE_TAG" \
              --arg asset "$ASSET" \
              --arg sha "$SHA256" \
              --argjson client "$HAS_CLIENT" \
              '(.plugins[] | select(.id == $id)) |= {
                id: $id,
                package: $pkg,
                source: { release: $release, asset: $asset, sha256: $sha },
                server: .server,
                client: $client
              }' <<<"$MANIFEST")
            PR_TITLE="chore(plugins): обновить $PLUGIN_ID до v$PLUGIN_VERSION"
          else
            # Добавляем новую запись
            MANIFEST=$(jq --arg id "$PLUGIN_ID" \
              --arg pkg "$PLUGIN_PACKAGE" \
              --arg release "$RELEASE_TAG" \
              --arg asset "$ASSET" \
              --arg sha "$SHA256" \
              --argjson server true \
              --argjson client "$HAS_CLIENT" \
              '.plugins += [{
                id: $id,
                package: $pkg,
                source: { release: $release, asset: $asset, sha256: $sha },
                server: $server,
                client: $client
              }]' <<<"$MANIFEST")
            PR_TITLE="feat(plugins): добавить плагин $PLUGIN_ID v$PLUGIN_VERSION"
          fi

          echo "$MANIFEST" > dsh-edge/plugins.json

          # Валидируем манифест
          node dsh-edge/manifest.mjs >/dev/null || { echo "::error::Обновлённый манифест невалиден"; exit 1; }

          # Гвардия пустого диффа (#658, живой факт 2026-09-07): между `git
          # fetch origin main` выше и этим моментом окно гонки — секунды, не
          # минуты, но не ноль: тот же фикс манифеста мог попасть в main
          # ДРУГИМ путём (ручной PR, повторный форж того же плагина) буквально
          # только что. Раньше PR открывался безусловно — живой итог (#658):
          # авто-PR с содержимым, уже слитым в main через update-branch
          # соседнего PR, `gh pr diff` пуст навсегда, ai-review.yml падал на
          # пустом диффе четыре прогона подряд, а contract:failed (ветка
          # forge/* не matчится agent/<N>-) не давал закрыть его штатно.
          # Проверка на входе (AGENTS.md: «проверять на входе, а не
          # постфактум»), а не в ai-review — не закрывает класс целиком (окно
          # между этой строкой и push всё ещё секунды, не ноль), но резко
          # сужает его: остаточную гонку добивает cmd_gather (empty_diff,
          # scripts/review/ai_review.py).
          if git diff --quiet -- dsh-edge/plugins.json; then
            echo "Манифест уже содержит эту запись в main (id=$PLUGIN_ID v$PLUGIN_VERSION) — PR не нужен, пропускаю создание"
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "branch=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git add dsh-edge/plugins.json
          # Многострочные тексты — через printf с явными \n, а не heredoc:
          # heredoc-тело без YAML-отступа обрывает блочный литерал run: | раньше
          # времени (PyYAML: "while scanning a simple key" — гвардия «все workflows
          # валидный YAML» в repo-ci красит именно на этом). printf-формат —
          # одна физическая строка YAML, аргументы подставляются как обычно.
          COMMIT_MSG=$(printf '%s\n\nАвтоматический PR из plugin-forge (run %s).\nПлагин: %s (%s) v%s\nРелиз: %s\nAsset: %s\nSHA256: %s\nЗадача: #%s' \
            "$PR_TITLE" "${{ github.run_id }}" "$PLUGIN_PACKAGE" "$PLUGIN_ID" "$PLUGIN_VERSION" "$RELEASE_TAG" "$ASSET" "$SHA256" "$TASK_ISSUE")
          git commit -m "$COMMIT_MSG"

          git push -u origin "$BRANCH"

          # task_issue гарантированно непуст с шага «Валидация входа» — строка
          # со ссылкой пишется всегда, не условно (#945: раньше task_issue был
          # опциональным, и мёртвая ссылка «#hello» на plugin_id уже чинилась
          # находкой AI-ревью PR #273 — теперь второго обхода того же класса
          # не нужно, значение всегда номер issue).
          TASK_LINE=$(printf 'Задача: #%s\n\n' "$TASK_ISSUE")
          # #664: deploy-dsh-edge.yml ИМЕЕТ push-триггер по dsh-edge/** (с #374)
          # — этот PR меняет dsh-edge/plugins.json, значит push его заденет.
          # Честная оговорка тут же: мерж идёт через оркестратор (GITHUB_TOKEN),
          # который push-событие НЕ создаёт (scheduler.py::dispatch_deploy_on_merge,
          # документированный факт, объясняет расхождение живых прогонов #560/
          # #660) — на практике деплой чаще всего запускает ЯВНЫЙ диспатч
          # scheduler.py::after_merge при мерже, push — запасной путь на случай
          # мержа не через оркестратор. Суточный schedule (04:37) — станет
          # финальной страховкой, если оба пути промолчат.
          PR_BODY=$(printf '%s## Что сделано\n- Плагин собран и опубликован в релиз `%s`\n- Интеграционный дым пройден (локальная сборка клона с плагином)\n- Манифест `dsh-edge/plugins.json` обновлён с новым sha256\n- Финальный статус этого шага в журнале — `built` (design.md «Канал обновления и статусы»: форж не деплоит и не постит `deploying`/`ready`)\n\n## Чем доказано\n- Чеклист совместимости Workers Free (запрещённые импорты, нет динамических import) — зелёный\n- Интеграционная сборка dsh-edge с плагином — зелёная\n- Гвардия состава (verify-edge-plugins) — зелёная\n- Контракт и детерминизм артефактов — зелёные\n\n## Пост-мерж проверка\n`deploy-dsh-edge.yml` ИМЕЕТ push-триггер по `dsh-edge/**` (с #374) — этот PR меняет `dsh-edge/plugins.json`. Мерж через оркестратора не создаёт push-событие (GITHUB_TOKEN, защита GitHub от рекурсии) — деплой в таком случае запускает явный диспатч `scheduler.py::after_merge`. Итог один и тот же:\n1. Деплой соберёт морду с обновлённым манифестом (явный диспатч на мерже ИЛИ push, если мерж создал событие) и пройдёт канарейки (ingest-шов #119, реестр провайдеров #378, e2e #502)\n2. Не сработали оба пути — суточный `schedule` (04:37) дособерёт в течение суток; ручной `gh workflow run deploy-dsh-edge` ускоряет ожидание, но не обязателен\n3. `plugin_status: deploying`/`ready` постит канал деплоя, а не этот PR — это отдельная задача (доводка деплоя до ready, остаток #162), сюда ещё не подключена\n\n## Чек-лист\n- [ ] Чеклист совместимости пройден\n- [ ] Интеграционный дым пройден\n- [ ] Релиз создан\n- [ ] Манифест валиден' \
            "$TASK_LINE" "${{ steps.release.outputs.release_tag }}")
          # scripts/git/pr-create (#496) — единственный документированный путь
          # открытия PR, тот же интерфейс, что gh pr create.
          PR_URL=$(scripts/git/pr-create --base main --head "$BRANCH" --title "$PR_TITLE" --body "$PR_BODY")
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Итог
        run: |
          echo "✅ Форж завершён для плагина ${{ steps.validate.outputs.plugin_id }}"
          echo "Релиз: ${{ steps.release.outputs.release_tag }}"
          echo "Тарболл: ${{ steps.pack.outputs.asset }} (sha256: ${{ steps.pack.outputs.sha256 }})"
          if [ -n "${{ steps.pr.outputs.pr_url }}" ]; then
            echo "PR: ${{ steps.pr.outputs.pr_url }}"
          else
            echo "PR: не создан — манифест уже содержал эту запись в main (гвардия пустого диффа, #658)"
          fi
          echo ""
          # Форж заканчивается на built (design.md, «Канал обновления и
          # статусы») — deploying/ready принадлежат каналу деплоя, а не
          # этому job'у. Постить ready здесь было бы silent-wrong: журнал
          # сказал бы «готов» в момент, когда манифест-PR только создан,
          # морда не пересобрана и плагина в ростере ещё нет (находка разбора
          # PR #273, устраняющая расхождение с design.md, введённое в ходе
          # AI-ревью того же PR). deploy-dsh-edge.yml ИМЕЕТ push-триггер по
          # dsh-edge/** (с #374) и явный диспатч на мерже (scheduler.py::
          # after_merge, #945) — обычно доедет само; суточный schedule
          # (04:37) — финальная страховка. Канал «мерж → деплой → ready» —
          # отдельная задача (см. #268 и issue из остатка #162 про доводку
          # deploying/ready до деплоя).
          echo "Следующий шаг: ревью и мёрж PR (ветка agent/<задача>-forge-<id>-<ts>, контракт PR↔задача резолвится штатно, #661). Финальный статус этого шага — built. Ready проставит канал деплоя (отдельная задача) — деплой обычно триггерится сам (push по dsh-edge/** или явный диспатч на мерже), суточный schedule 04:37 — страховка на случай, если оба промолчали."

      - name: plugin_status → failed (если форж упал)
        # Перенесено из отдельного job'а forge-failed (#945): с матрицей
        # (несколько плагинов за один прогон) выход job'а forge отдал бы ОДИН
        # неоднозначный plugin_id на все упавшие элементы матрицы разом —
        # шаг внутри СВОЕГО элемента матрицы знает точный plugin_id/plugin_path
        # без чужого вывода. `if: failure()` — истина, если хоть один
        # предыдущий шаг ЭТОГО job'а (этого элемента матрицы) упал.
        if: failure() && env.HARNESS_URL != '' && env.HANDS_TOKEN != ''
        continue-on-error: true
        env:
          HARNESS_URL: ${{ vars.HARNESS_URL }}
          HANDS_TOKEN: ${{ secrets.HANDS_TOKEN }}
          # Канонический id из шага «Валидация входа» (после сверки с
          # манифестом) — фолбэк на basename(matrix.plugin_path) в BASH ниже,
          # если validate упала до записи output (находка AI-ревью PR #273:
          # без канонического id падение ПОСЛЕ валидации уезжало в
          # plugin:<basename>, а не в тот id, что уже видел building/built).
          PLUGIN_ID_INPUT: ${{ steps.validate.outputs.plugin_id }}
          PLUGIN_PATH: ${{ matrix.plugin_path }}
          STATE: failed
          SOURCE: forge
          DETAIL: "форж упал: см. лог job ${{ github.run_id }}"
        run: |
          PLUGIN_ID="${PLUGIN_ID_INPUT:-$(basename "$PLUGIN_PATH")}"
          PLUGIN_ID="${PLUGIN_ID:-unknown}"
          PLUGIN_ID="$PLUGIN_ID" STATE=failed SOURCE=forge DETAIL="$DETAIL" bash scripts/plugins/plugin_status.sh || true
