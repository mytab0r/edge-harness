<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>edge-harness</title>
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<div id="gate" hidden>
  <div class="card">
    <h1 data-i18n="gate.title">edge-harness</h1>
    <p data-i18n="gate.hint">Доступ закрыт разделяемым секретом. Введи HANDS_TOKEN — сервер обменяет его на сессионную куку; сам токен не сохраняется.</p>
    <div class="row">
      <input id="gate-token" type="password" autocomplete="off" data-i18n-attr="placeholder:gate.token_placeholder">
      <label class="show"><input type="checkbox" id="gate-show"> <span data-i18n="gate.show">показать</span></label>
    </div>
    <div class="error" id="gate-error" role="alert"></div>
    <button id="gate-enter" data-i18n="gate.enter">Войти</button>
  </div>
</div>

<header>
  <h1>edge-harness</h1>
  <span class="badge bad" id="hands">…</span>
  <span class="badge" id="queue">…</span>
  <span class="badge warn" id="watchdog" hidden></span>
  <span class="badge bad" id="pulse" hidden></span>
  <span class="badge warn" id="retention" hidden></span>
  <span id="conn">…</span>
  <span style="flex:1"></span>
  <button class="ghost" id="forget" data-i18n="gate.forget" title="Завершить сессию (сервер сбросит куку)">выйти</button>
</header>

<main>
  <section>
    <h2 data-i18n="section.new_task">Новая задача</h2>
    <div class="row">
      <textarea id="payload" data-i18n-attr="placeholder:payload.placeholder"></textarea>
      <button id="submit" data-i18n="submit">Поставить задачу</button>
    </div>
    <div id="tasks"></div>
  </section>

  <section>
    <h2 data-i18n="section.journal">Журнал</h2>
    <ol id="journal"></ol>
  </section>
</main>

<script src="/assets/config.js"></script>
<script src="/assets/i18n/ru.js"></script>
<script src="/assets/app.js"></script>
</body>
</html>
